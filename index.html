"MOH of her parent's MOH area.", "E": "Obstetrician of the hospital where she delivered the baby"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture says that if the mother shifts to another residential area after delivery, the respective MOH and PHM are notified to provide the necessary care. The direct home care is given by the PHM of the area where she is staying, so B is correct. D is the main wrong option because the MOH has overall responsibility but does not make the postnatal visits. This is consistent with Q120, where the answer is the PHM of the parents' village.", "source": "02-ANC and PNC revised (Post partum care at field: shifted to a different residential area; home visits by PHM).", "confidence": "CHECK on B. \"Directly responsible\" could also be read as the MOH, who is notified as well. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 143, "batch": "B30 Q15", "file": "B30", "paperNo": 15, "topic": "Postpartum contraception while breastfeeding", "type": "SBA", "theme": 2, "stem": "When Mala went to the polyclinic for the second time she declared that she wants to postpone her next pregnancy for at least another three years. She has no postpartum complications and her baby is healthy, and she is breastfeeding the baby. What is the most suitable contraceptive method to recommend to her immediately?", "options": {"A": "None", "B": "Intradermal progesterone implant", "C": "COCP", "D": "Progesterone injection", "E": "IUCD"}, "answer": "B", "prov": null, "cannot": false, "explanation": "She is breastfeeding and wants at least 3 years of spacing. A long-acting progestogen-only implant (Jadelle, listed in the national programme) lasts years, does not affect milk supply and needs no further visits. The combined pill (C) is avoided while breastfeeding in early months. DMPA (D) is available only in clinics with a doctor and resuscitation facilities. IUCD (E) can be a good alternative but depends on the timing since delivery. \"None\" (A) would be right only if lactational amenorrhoea applied, and the stem gives no sign of it.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Modern Family Planning Methods\" slide (implants, levonorgestrel - Jadelle; DMPA; Cu-IUD). The breastfeeding and postpartum timing rules are standard knowledge.", "confidence": "CHECK on E. The stem gives no time since delivery, so the IUCD is also defensible. Best answer is B.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "note": "This continues the Mala story in Q140 to Q142.", "scored": true}, {"id": 144, "batch": "B30 Q16", "file": "B30", "paperNo": 16, "topic": "JE vaccine after febrile convulsion", "type": "SBA", "theme": 9, "stem": "A 12-month-old baby was taken for her Japanese encephalitis vaccination. She had one episode of febrile convulsions 2 months ago. As the MOH, what is your management?", "options": {"A": "Admit the baby in pediatric ward and give JE vaccine", "B": "Give necessary advice and review the baby after 10 months", "C": "Postpone and give the vaccine after 6 months", "D": "Give live attenuated JE vaccine", "E": "Give inactivated JE vaccine"}, "answer": "D", "prov": null, "cannot": false, "explanation": "A past febrile convulsion is not a contraindication to routine vaccines, so the vaccine should not be delayed or given in hospital (standard knowledge). Sri Lanka's national schedule gives the live attenuated JE vaccine at 12 months. Postponing for 6 or 10 months (B, C) leaves the child unprotected, and the inactivated vaccine (E) is not the routine product.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on D. No lecture in project, and the vaccine type in the national schedule is from memory. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 145, "batch": "B30 Q17", "file": "B30", "paperNo": 17, "topic": "Leptospirosis prevention at season start", "type": "SBA", "theme": 8, "stem": "You are appointed as the MOH of the Buttala area where there is a high prevalence of leptospirosis. What is the most useful preventive measure you can take at the start of the season of farming?", "options": {"A": "Educate on signs and symptoms of leptospirosis to the villagers", "B": "Organize school-level educational campaigns", "C": "Prescribe doxycycline 200mg per week for all farmers.", "D": "Tetracycline 500mg stat dose for high-risk groups.", "E": "Raising funds from local businessmen to purchase boots for farmers."}, "answer": "C", "prov": null, "cannot": false, "explanation": "Weekly doxycycline 200 mg given before and during exposure is the chemoprophylaxis used for high-risk farmers in Sri Lanka (standard knowledge), and it is the same measure chosen in Q125. D is wrong because a single stat tetracycline dose is not the regimen. A and B raise awareness but do not directly stop infection, and E helps only partly. The word \"all\" in C is loose because the target group is high-risk farmers, but it is still the best option.", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on C. No lecture covers it, and \"all farmers\" is wider than the usual high-risk target group. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 146, "batch": "B30 Q18", "file": "B30", "paperNo": 18, "topic": "Adolescent with falling school work", "type": "SBA", "theme": 5, "stem": "Wishwa is a 15-year-old student in grade 10. His class teacher has noticed a deterioration in school work and increasingly quiet behavior. What is the first step that should be taken by the class teacher?", "options": {"A": "Inform the parents and inquire", "B": "Inform the MOH at the school medical inspection", "C": "Refer him to the school counselor", "D": "Ask him to go to Mithuru piyasa", "E": "Talk to Wishwa privately after school."}, "answer": "E", "prov": null, "cannot": false, "explanation": "The adolescent lecture stresses confidentiality, sensitivity and communicating well with adolescents, and the mental health lecture describes asking the right questions so the person can reflect on their own needs. A private, non-judgemental conversation is therefore the natural first step, before involving parents (A), the counsellor (C) or other services (B, D). Referral steps follow once the teacher knows what is wrong.", "source": "05-Adolescent health narrated, \"Ethics and adolescent health\" slide; 11-Mental Health Promotion batch32, Mentoring slides; 10 School Health Program Sri Lanka, SMI slide (counselling). Order of steps: standard knowledge.", "confidence": "CHECK on E. The lectures do not give a step-by-step approach. Best answer is E. C (school counsellor) is the nearest alternative.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 147, "batch": "B30 Q19", "file": "B30", "paperNo": 19, "topic": "School health programme, 463 students", "type": "SBA", "theme": 5, "stem": "In a school of 463 students, a school health program was planned. What is the best thing to do in this,", "options": {"A": "Educating grade 5 students about reproductive health", "B": "Assessing the condition of the food outlets within a distance of 1km from the school", "C": "Taking a 24-hour dietary recall from the students of grades 1 - 4", "D": "Giving a mid-day meal for all the students", "E": "Immunizing the grade 1 students who had missed the pentavalent vaccine dose."}, "answer": "E", "prov": null, "cannot": false, "explanation": "With more than 200 students, SMI is done for grades 1, 4, 7 and 10, and immunization on the SMI day is a core activity, including catch-up DT/OPV in grade 1 for children not previously immunised. Reproductive health education starts in grade 8 and is compulsory in grade 9, so A is wrong. The lecture has the PHI inspect canteens and food outlets in and around the school but gives no 1 km rule (B), nutrition screening at SMI uses height, weight and BMI rather than dietary recall (C), and it does not describe a mid-day meal for all (D).", "source": "10 School Health Program Sri Lanka (Dr Gunathilake), SMI, Immunization and awareness programme slides, Components of SHS (School canteen).", "confidence": "CHECK on E. The lecture names DT/OPV at grade 1, not the pentavalent dose, so the option is read as the same catch-up idea. Best answer is E. B is the nearest alternative.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "SchHlth", "atName": "School health programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 148, "batch": "B30 Q20", "file": "B30", "paperNo": 20, "topic": "Notification of fatal occupational accidents", "type": "SBA", "theme": 6, "stem": "All fatal occupational accidents have to be notified to the,", "options": {"A": "PHM", "B": "MOH", "C": "Regional epidemiologist", "D": "District Factory Inspecting Engineer", "E": "Occupational Hygiene division of the Labour department"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Section 61 requires written notice of fatal accidents, and of the other notifiable accidents, to the District Factory Inspecting Engineer, as the \"Notification to District Factory Inspecting Engineer\" slide states. A, B and C belong to the health sector. The Occupational Hygiene division (E) promotes worker health and gives monitoring and advice, and it does not receive accident notices.", "source": "Occupational safety & health legislature lectures (both files, read by OCR from the slide images), Part VI and slide \"Notification to District Factory Inspecting Engineer\".", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccLaw", "atName": "Occupational safety and health legislation", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 149, "batch": "B30 Q21", "file": "B30", "paperNo": 21, "topic": "Classifying a postpartum suicide death", "type": "SBA", "theme": 2, "stem": "A 24-year-old woman with a history of depression was found dead in her house. She was 4 weeks after the delivery. The forensic conclusion after the autopsy was a suicide by a drug overdose. What is the best term to describe her death,", "options": {"A": "Direct maternal death", "B": "Early maternal death", "C": "Indirect maternal death", "D": "Late maternal death", "E": "Pregnancy-related death"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The death is 4 weeks after delivery, inside 42 days, so it is not a late maternal death (D). It is not from obstetric complications or their management, so it is not direct (A). Her pre-existing depression, made worse by the puerperium, makes it an indirect maternal death by the lecture definition of disease aggravated by the physiological effects of pregnancy. \"Early maternal death\" (B) is not a term in the lecture. \"Pregnancy-related death\" (E) covers any death in the period irrespective of cause, so it fits only if the suicide is judged incidental.", "source": "08 Maternal Mortality, Definitions slides (maternal, direct, indirect, late and pregnancy related deaths). Classifying suicide as indirect follows standard ICD maternal mortality practice.", "confidence": "CHECK on E. If the examiner treats the suicide as an incidental cause, the answer becomes E. Best answer is C.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 150, "batch": "B30 Q22", "file": "B30", "paperNo": 22, "topic": "Main cause of low weight for age", "type": "SBA", "theme": 4, "stem": "What is the main reason for having low weight for age in preschool children?", "options": {"A": "Early cessation of breastfeeding", "B": "Inadequate amounts of food given.", "C": "Formula feeding", "D": "Improper complement feeding", "E": "Frequent and recurring diarrhea"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The nutrition epidemiology lecture lists the modifiable determinants of undernutrition under 2 years as low birth weight, inadequate income, lack of food or adequate nutrition, and limited maternal access to information. Underweight there is a weight-for-age value below -2SD, with highest prevalence at 3 to 4 years (23%). The ECD lecture defines preschool as 3 to 5 years, an age at which \"complementary feeding\" is less relevant. So inadequate food intake is the best fit, and A, C and E are not named as the main cause.", "source": "05 Epidemiology of nutritional issues B34 (underweight and stunting slides; modifiable determinants); 13 Early Childhood Development Batch 34 (age definitions).", "confidence": "CHECK on D. The lecture never states a single \"main reason\", and D is also plausible. Best answer is B.", "check": true, "checkLetters": ["D"], "otherDiffers": "Guidelines on Infant and Young Child Feeding (introduction) say incorrect complementary feeding is an important cause of undernutrition from around 6 months into the second year, which would favour D. CHECK", "dupOf": null, "at": "NutEpi", "atName": "Epidemiology of nutritional issues in Sri Lanka", "atCat": "Nutrition", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 151, "batch": "B30 Q23", "file": "B30", "paperNo": 23, "topic": "Abnormal cervix at Pap test", "type": "SBA", "theme": 1, "stem": "A 35-year-old woman underwent a Papanicolaou (Pap) test at a Well Woman Clinic and an unhealthy cervix with bleeding was noted. Which of the following is the first step that should be taken as the MOH in this situation?", "options": {"A": "Request for the Pap test urgent reporting", "B": "Refer to the gynecology clinic", "C": "Education and counseling", "D": "Obtaining a core biopsy", "E": "Refer to an oncologist"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The WWC lectures say that women with abnormal cervical findings are referred to specialist gynaecology care, with counselling by trained staff. An unhealthy, bleeding cervix on examination should not wait for the smear report, so A is wrong. A biopsy (D) is a specialist procedure and the oncologist (E) is not the first referral point.", "source": "14 WELL WOMAN CLINIC PROGRAMME Recorded (cervical screening: abnormal PAP or abnormal cervical findings referred to specialized care after counselling). 14 WWC (Implementation slide: abnormal smears referred to a Specialist Gynaecology Clinic).", "confidence": "CHECK on B. The recorded lecture says \"referred after counselling\", so C (counselling) could be argued as the first step. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "WWC", "atName": "Well Woman Clinic programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 152, "batch": "B30 Q24", "file": "B30", "paperNo": 24, "topic": "Leading cause of mortality (CVD)", "type": "SBA", "theme": 9, "stem": "Cardiovascular diseases have been the leading cause of mortality over the past 4 decades. The percentage has increased up to 22%. What is the main predisposing cause of it?", "options": {"A": "Aging of the population", "B": "Environmental pollution", "C": "Increase diagnosis", "D": "Less healthcare facilities", "E": "Unhealthy diet"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The rise in cardiovascular deaths follows the epidemiological transition, and the main modifiable predisposing factors are lifestyle ones such as unhealthy diet, inactivity and tobacco (standard knowledge). The stem asks for the main \"predisposing cause\", which points to a risk factor rather than a demographic change. Ageing (A) contributes but is not itself a risk factor, and pollution, better diagnosis and poorer facilities are minor or wrong explanations.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on E. No lecture in project, and A (ageing) is a close alternative. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 153, "batch": "B30 Q25", "file": "B30", "paperNo": 25, "topic": "Needle-stick injury, suspected HIV", "type": "SBA", "theme": 9, "stem": "While assisting with surgery of a suspected HIV-infected patient, a theatre nurse had a cut injury. Who is the healthcare personnel that she should contact in the first place?", "options": {"A": "Consultant microbiologist.", "B": "Consultant physician.", "C": "Consultant Venereologist", "D": "Infection Control Nursing Officer", "E": "MOH"}, "answer": "D", "prov": null, "cannot": false, "explanation": "In hospital practice the first point of contact after a sharps injury is the Infection Control Nursing Officer, who records the incident and arranges urgent assessment and post-exposure prophylaxis (standard knowledge). The microbiologist and venereologist are involved later in the risk assessment and prophylaxis. The area MOH deals with community public health, not hospital staff injuries.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on D. No lecture in project, and the venereologist (C) or microbiologist (A) could be the first contact under some local protocols. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 154, "batch": "B31 Q1", "file": "B31", "paperNo": 1, "topic": "Screening investigations for workers", "type": "MTF", "theme": 6, "stem": "Investigations for screening of workers include,", "options": {"A": "Blood count", "B": "Lipid profile", "C": "Chest x-ray", "D": "Pulmonary function test", "E": "Renal function test"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture's screening slide lists history, examination and the investigations blood counts, chest X-ray, pulmonary function tests, biological monitoring and audiometry, so A, C and D are True. B is False because a lipid profile is not on the list. E is also not listed, so it is taken as False, although renal function would be checked in workers exposed to mercury or cadmium (standard knowledge).", "source": "Occupational Diseases lecture, \"Screening for occupational diseases\" slide.", "confidence": "CHECK on E. The lecture's list does not include renal function tests, but they are used for specific exposures. Best answer is E False.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 155, "batch": "B31 Q2", "file": "B31", "paperNo": 2, "topic": "Lead poisoning symptoms", "type": "MTF", "theme": 6, "stem": "Symptoms of lead poisoning in an adult include,", "options": {"A": "Chest pain", "B": "Joint and muscle pain", "C": "Abdominal pain", "D": "Mental confusion", "E": "Headache"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture names lead poisoning under metals and says it develops over weeks to months, but it gives no symptom list, so this is standard knowledge. Lead poisoning in adults causes abdominal colic, joint and muscle pain, headache and mental confusion, so B, C, D and E are True. Chest pain is not a typical feature, so A is False.", "source": "Occupational Diseases lecture, \"Diseases due to exposure to chemicals\" and \"Occupational diseases\" slides (lead poisoning, weeks to months). The symptoms are standard knowledge.", "confidence": "CHECK on A. The lecture has no symptom list, and A rests on standard knowledge. Best answer is A False.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 156, "batch": "B31 Q3", "file": "B31", "paperNo": 3, "topic": "Falciparum malaria drugs", "type": "MTF", "theme": 8, "stem": "Drugs used in uncomplicated falciparum malaria in Sri Lanka include,", "options": {"A": "Chloroquine", "B": "Artemether, lumefantrine", "C": "Mefloquine", "D": "Primaquine", "E": "Artesunate injection"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Uncomplicated falciparum malaria is treated with artemether-lumefantrine, plus primaquine to clear gametocytes (standard knowledge). Chloroquine is no longer used for falciparum because of resistance, and mefloquine is not a current treatment here. Artesunate injection is for severe malaria rather than uncomplicated disease.", "source": "No lecture in project (the Emerging and Re-emerging lecture only lists malaria among re-emerging diseases relevant to Sri Lanka). Standard knowledge.", "confidence": "CHECK on D. No lecture covers treatment, and I am not fully sure the national guideline's primaquine dose and use are what the question intends. Best answer is A False, B True, C False, D True, E False.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 157, "batch": "B31 Q4", "file": "B31", "paperNo": 4, "topic": "Dengue control in Sri Lanka", "type": "MTF", "theme": 8, "stem": "Regarding Dengue control in Sri Lanka", "options": {"A": "Gampaha district is identified as a high-priority and high-risk area.", "B": "Edes egypti larvae are more prevalent than Edes albopictus.", "C": "Community empowerment is not an effective strategy for dengue control.", "D": "Regular fogging is the most effective method of prevention.", "E": "Bureau index is more effective than the container index."}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "Gampaha, with the rest of the Western Province, is a high-burden dengue district, so A is true (standard knowledge). C is false because community participation in source reduction is a core strategy, and D is false because fogging is a supplementary outbreak measure while breeding-site removal is the mainstay. B is false because Aedes albopictus is the more widespread species in Sri Lanka, and E is doubtful because the entomological indices measure infestation rather than effectiveness. The paper prints \"Edes\" for Aedes and \"Bureau\" for Breteau.", "source": "No lecture in project (the Emerging and Re-emerging lecture only lists dengue as a re-emerging disease and one with epidemic potential). Standard knowledge.", "confidence": "CHECK on B. The relative prevalence of the two Aedes species and the Breteau versus container index comparison in E are in no lecture. Best answer is A True, B False, C False, D False, E False.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 158, "batch": "B31 Q5", "file": "B31", "paperNo": 5, "topic": "Lymphatic filariasis in Sri Lanka", "type": "MTF", "theme": 8, "stem": "Regarding lymphatic filariasis in Sri Lanka", "options": {"A": "Antibody test is the main diagnosis method for the detection of lymphatic filariasis.", "B": "Parasitological surveillance is carried out by field public health officers.", "C": "Microfilaria count assesses the progression of transmission of disease.", "D": "Entomological surveillance is not a good method of controlling the disease.", "E": "Sri Lanka is declared as a country that has eliminated filariasis."}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Diagnosis in the field rests on detecting microfilariae (night blood film) or filarial antigen, not antibody testing, so A is false. The microfilaria rate and count are used to judge whether transmission is continuing, so C is true. Entomological surveillance is a recognised part of surveillance and control, so D is false. WHO validated Sri Lanka as having eliminated filariasis as a public health problem in 2016 (standard knowledge), so E is true.", "source": "Lecture \"Emerging and Re-emerging Infectious Diseases\": slide \"Re-emerging diseases\" (filariasis listed for Sri Lanka) and slide \"Prevention of re-emergence of diseases\" (good surveillance, case and foci investigation). Option-level details are standard knowledge.", "confidence": "CHECK on B. The lecture does not say who does parasitological surveillance (field staff of the Anti-Filariasis Campaign versus public health inspectors). Best answer is True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 159, "batch": "B31 Q6", "file": "B31", "paperNo": 6, "topic": "Mortality rate statements", "type": "MTF", "theme": 3, "stem": "Regarding mortality rate", "options": {"A": "Infant mortality rate is measured per 1000 live births.", "B": "Maternal mortality rates are measured per 100000 live births.", "C": "The neonatal mortality rate was stagnant during previous years.", "D": "Age-specific mortality rates are more useful than crude mortality rates.", "E": "Mortality rates are useful to compare health care systems of different countries."}, "answer": {"A": true, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "A: lecture formula, IMR = deaths of children under 1 year in a year ÷ live births in the same year × 1000. B: per 100,000 live births is the maternal mortality ratio (the ANC lecture says \"Maternal Mortality Ratio (per 100,000 live births)\"), so calling it a rate is wrong. C: the mortality lecture's DHS chart shows neonatal mortality falling from 11 (2006/07) to 7 (2016), so it was not stagnant. D: the crude rate depends on age-sex structure, while age-specific rates identify risk groups. E: the lecture lists international comparison as a use of mortality data, and case fatality as an idea of how good the health system is.", "source": "07-Measures of Mortality, Crude Death Rate, Mortality Rates in children <1 year, Uses of mortality data and DHS neonatal mortality chart slides; 02-ANC and PNC revised, Sri Lanka statistics slide.", "confidence": "CHECK on B and C. B: the printed \"rates\" may be loose usage for the ratio. C: national data may show a plateau in recent years, but the lecture chart shows a fall. Best answer is B False, C False.", "check": true, "checkLetters": ["A", "B", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 160, "batch": "B31 Q7", "file": "B31", "paperNo": 7, "topic": "Hepatitis A", "type": "MTF", "theme": 8, "stem": "Which of the following statements is/are T/F regarding Hepatitis A infection?", "options": {"A": "It is spread via contaminated water or food.", "B": "Travellers are at a high risk of acquiring infection.", "C": "Smaller children less than 6 years usually do not show symptoms.", "D": "It is preventable by vaccination.", "E": "Public Health Inspector is the main stakeholder in prevention."}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Hepatitis A is faeco-orally transmitted through contaminated food and water, so A is true. Young children are usually asymptomatic, while adults are more often symptomatic, so C is true. An effective vaccine exists, so D is true. Prevention depends on safe water and food, which is the public health inspector's field work, so E is true (standard knowledge).", "source": "No lecture in project. Answers are standard knowledge.", "confidence": "CHECK on B and E. B depends on the traveller's origin (high-risk mainly for those from low-endemicity settings), and E rests on the PHI's role, which no lecture states. Best answer is True for both.", "check": true, "checkLetters": ["A", "B", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 161, "batch": "B31 Q8", "file": "B31", "paperNo": 8, "topic": "Waterborne diseases", "type": "MTF", "theme": 8, "stem": "Which of the following is/are true/ false regarding waterborne diseases,", "options": {"A": "Enteric fever can be caused by Salmonella typhi.", "B": "People infected with Salmonella typhi can become permanent carriers.", "C": "Cholera is a group B notifiable disease in Sri Lanka.", "D": "Vaccination is the sole preventive method in the Cholera endemic area.", "E": "Sri Lanka is a cholera endemic country."}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "S. typhi causes enteric fever and some infected people become chronic carriers, so A and B are true. Cholera needs immediate (group A) notification, so C is false. Prevention rests mainly on safe water, sanitation and hygiene (WASH), with vaccine only as an adjunct, so D is false. Sri Lanka has sporadic outbreaks rather than endemic cholera, so E is false (standard knowledge).", "source": "Lecture \"Emerging and Re-emerging Infectious Diseases\": slide \"How does an animal pathogen become an endemic pathogen\" (cholera as a stage 4 example) and slide \"Genetic or Biologic Determinants\" (poor WASH). Options A, B, C and E are standard knowledge.", "confidence": "CHECK on C and E. I am relying on memory for the notification group and for Sri Lanka's endemic status. Best answer is C False and E False.", "check": true, "checkLetters": ["A", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 162, "batch": "B31 Q9", "file": "B31", "paperNo": 9, "topic": "Measles outbreak since 2023", "type": "MTF", "theme": 8, "stem": "Sri Lanka has been experiencing measles outbreak since 2023 May,", "options": {"A": "Sri Lanka is in a situation of measles elimination.", "B": "Vaccination is the most effective method of preventing measles.", "C": "MMR vaccine is given at the age of one year according to the National Programme of Immunization.", "D": "Supplementary Immunization Activity conducted for the measles outbreak in 2023.", "E": "Additional two doses of Measles at the SIA given to children 6-9 months of age."}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture lists measles among re-emerging diseases relevant to Sri Lanka and names immunisation as a prevention measure, so A is false and B is true. The first MMR dose is given at one year in the national schedule (standard knowledge), so C is true. An outbreak-response vaccination round fits D. An \"additional two doses\" for infants of 6-9 months sounds wrong, because an additional single dose is the usual approach, so E is false.", "source": "Lecture \"Emerging and Re-emerging Infectious Diseases\": slide \"Re-emerging diseases\" (measles) and slide \"Prevention of re-emergence\" (immunisation). Options C, D and E are standard knowledge.", "confidence": "CHECK on A, D and E. The lecture does not give Sri Lanka's current elimination status or the 2023 campaign details. Best answer is A False, D True, E False.", "check": true, "checkLetters": ["A", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 163, "batch": "B31 Q10", "file": "B31", "paperNo": 10, "topic": "Indicators of maternal health care", "type": "MTF", "theme": 1, "stem": "Indicators that provide evidence of the adequacy of maternal health care in the country,", "options": {"A": "100% of the births are being attended by skilled personnel.", "B": "C section is 32% of all the deliveries.", "C": "10% of teenage pregnancy.", "D": "First pregnancy before 18 years old.", "E": "Tripposha given for low BMI pregnant women."}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "Skilled birth attendance supports the timely obstetric care that the lectures list as a means of reducing maternal risk, so A is true. A caesarean rate of 32% is a high figure, and teenage pregnancy and a first pregnancy before 18 are risk or outcome measures, so B, C and D do not show adequate care (standard knowledge). Thriposha is given to all pregnant mothers in the lecture, not only those with low BMI, so E does not fit. The stem has a typo (\"Tripposha\").", "source": "08 Maternal Mortality (Prevention: antenatal care, obstetric care, postnatal care). Nutrition in Pregnancy Batch 35 (Thriposha beneficiaries). B, C and D: standard knowledge, no lecture figures.", "confidence": "CHECK on B and E. The lectures give no list of indicators for the adequacy of maternal health care. Best answer is A True, B False, E False.", "check": true, "checkLetters": ["A", "B", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 164, "batch": "B31 Q11", "file": "B31", "paperNo": 11, "topic": "Best method to control occupational hazard", "type": "SBA", "theme": 6, "stem": "The best method to control hazards in an occupational setting is by,", "options": {"A": "Wearing personal protective equipment", "B": "Substitution", "C": "Administrative control", "D": "Elimination", "E": "Engineer control"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lecture says removing the hazard completely is always the safest course of action, so elimination is the best method, the same answer as Q124. A is the last line of defence, and B, C and E sit below elimination in the hierarchy (E's \"Engineer control\" is a typo for \"Engineering control\").", "source": "Occupational Diseases lecture, \"Controlling hazards; hierarchy of control\" and \"Elimination\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": ["OccDis"], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 165, "batch": "B31 Q12", "file": "B31", "paperNo": 12, "topic": "Suspected polio, who to inform", "type": "SBA", "theme": 8, "stem": "A 4-year-old boy presented with fever, and acute onset bilateral lower limb paralysis to CNTH. The intern house officer diagnosed him with acute poliomyelitis during his first clerking. Who should be urgently informed?", "options": {"A": "Paediatrician in charge", "B": "Infection control nursing officer", "C": "Hospital director", "D": "Regional epidemiologist", "E": "Medical officer – Ragama"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Fever with acute flaccid paralysis in a child under 15 is an AFP case that is notified immediately to the regional epidemiologist, who coordinates the surveillance response. The infection control nursing officer (B) carries out hospital-level AFP surveillance duties, but the urgent notification goes to the epidemiologist. The MOH of residence (E) is informed through the epidemiologist for the field response (standard knowledge).", "source": "No lecture in project. Answer is standard knowledge.", "confidence": "CHECK on B. Hospital AFP duties sit with the infection control nursing officer, so B could be what the examiner intended. Best answer is D.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 166, "batch": "B31 Q13", "file": "B31", "paperNo": 13, "topic": "Leptospirosis social history", "type": "SBA", "theme": 8, "stem": "A 36-year-old banker from Waththala was admitted to CNTH due to a fever for 4 days and reduced urine output. Which of the following in his social history most suggestive of Leptospirosis", "options": {"A": "Regularly buy lunch from a small roadside vendor.", "B": "Goes on regular hikes in his leisure time for wildlife photography.", "C": "He has a pet parrot.", "D": "His drinking source is the house well.", "E": "His brother living in Anuradhapura got the same diagnosis last month."}, "answer": "B", "prov": null, "cannot": false, "explanation": "Fever with reduced urine output (renal involvement) points to leptospirosis, which is acquired through contact of skin or mucosa with water or soil contaminated by rodent or animal urine, as happens on outdoor hikes (standard knowledge). Roadside food (A) suggests enteric infection, and a pet parrot (C) suggests psittacosis. A brother's illness in another district (E) does not show a shared exposure, because leptospirosis is not spread person to person (the stem also has a typo, missing \"is\" before \"most suggestive\").", "source": "No lecture in project. Answer is standard knowledge.", "confidence": "CHECK on D. A house well can be contaminated, but it is a weaker link than direct environmental exposure. Best answer is B.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 167, "batch": "B31 Q14", "file": "B31", "paperNo": 14, "topic": "Best fertility indicator", "type": "SBA", "theme": 3, "stem": "Which of the following is the most suitable indicator of fertility of Sri Lanka", "options": {"A": "Prevalence of the current users of modern family planning methods", "B": "Proportion of the eligible couples under care", "C": "Abortion rate", "D": "Net reproduction rate", "E": "Prevalence of low birth weight"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The fertility lecture lists the measures of fertility as CBR, GFR, ASFR, TFR, GRR and NRR, and only D is on that list. NRR is the GRR adjusted for female mortality, and NRR = 1 marks replacement level (TFR about 2.1), the lecture's basis for judging population stabilisation. A and B measure family planning coverage, C is not a fertility measure, and E is a birth outcome.", "source": "06-Measures of Fertility, \"How do we measure fertility?\", Net Reproduction Rate and Replacement level fertility slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 168, "batch": "B31 Q15", "file": "B31", "paperNo": 15, "topic": "Postpartum request for sterilisation", "type": "SBA", "theme": 2, "stem": "A 23-year-old postpartum woman who delivered her first child requested permanent sterilization prior to discharge from the postnatal ward. What is the most appropriate approach internal medical officer can get,", "options": {"A": "Keep her in the ward until the obstetrician comes and consults the case.", "B": "Advise to take a temporary contraceptive method and come back after six weeks.", "C": "Advise to discuss with the area PHM on the first post-natal home visit.", "D": "Advise to discuss with the area MOH at the post-natal clinic visit.", "E": "Prescribe to take OCP and come back in six months."}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture's sterilisation rule for a woman under 26 needs at least 3 living children and a spouse who insists. A 23-year-old with her first child does not qualify. The sensible approach is to counsel her on a temporary method so she is protected now and review the decision later. Keeping her in the ward (A) is unnecessary. The PHM (C) does not decide on sterilisation. D leaves her unprotected meanwhile. The pill (E) is poor for a breastfeeding mother. The stem is garbled (\"approach internal medical officer can get\"), and I read it as asking what advice the ward doctor should give. This fits Q121 and Q212.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Eligibility for Sterilization\" slide (General Circular No. 1586) and \"Counselling in FP services\" slides.", "confidence": "CHECK on D. The stem is garbled, and D (counselling by the MOH at the postnatal clinic) is also defensible. Best answer is B.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 169, "batch": "B31 Q16", "file": "B31", "paperNo": 16, "topic": "Domestic violence, referral", "type": "SBA", "theme": 5, "stem": "A woman with a broken arm was noticed by PHM on a home visit. On inquiry, she found that it was due to a beating by her husband after smoking cannabis. Further, she found that this is occurring continuously in the household. Previously she has been admitted 3 times in the hospital. She stated that she is frightened of her husband and he threatens her that he will kill her if she leaves him.\nWhat is the most suitable institution/ person she should be referred to during her hospital stay?", "options": {"A": "Family Health Bureau", "B": "Hospital police post", "C": "Mithuru piyasa", "D": "Chief priest of the village temple", "E": "Consultant psychiatrist"}, "answer": "C", "prov": null, "cannot": false, "explanation": "Mithuru Piyasa is the hospital-based GBV care centre that offers befriending, counselling, medical care, referral and support with legal action, so it covers her safety and care needs while she is an inpatient. The hospital police post (B) deals only with the complaint and would not give support, and she has not asked for a complaint to be made. The Family Health Bureau (A) is a national programme body and does not see patients, and the temple priest (D) and psychiatrist (E) do not address the violence.", "source": "No lecture in project covers GBV referral pathways (5_6082615564579119301 covers definition, prevalence, impact and prevention only). Answer is standard knowledge.", "confidence": "CHECK on C. The referral route is not in the lectures. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 170, "batch": "B31 Q17", "file": "B31", "paperNo": 17, "topic": "5-day postnatal visit, what to inform MOH", "type": "SBA", "theme": 1, "stem": "PHM visited the home of a postpartum mother whose baby is 5 days old. During her post-natal care, several observations were found. From below which observation needs to inform immediately to the MOH", "options": {"A": "High score of Edinburgh Postnatal Depression scale of mother.", "B": "BCG scar is not visible.", "C": "Mild yellowish discoloration of the skin.", "D": "Bad lighting in the bedroom.", "E": "Yellow colour stools of the baby."}, "answer": "A", "prov": null, "cannot": false, "explanation": "The postpartum visits cover mental health and referral if needed, and a high depression score is a problem needing prompt action beyond the PHM. At 5 days a BCG scar is not yet expected (B), mild jaundice (C) is common at this age, yellow stools (E) are normal in a breastfed baby, and poor lighting (D) is advised on by the PHM herself (the last three are standard knowledge).", "source": "02 Antenatal and Postnatal Care (Prof Anuradhini), Postpartum care slides (general wellbeing, mental health, referral if needed). B, C, D and E: standard knowledge.", "confidence": "CHECK on A. The lectures do not mention the Edinburgh scale or give jaundice thresholds, and C could matter if it were more than mild. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 171, "batch": "B31 Q18", "file": "B31", "paperNo": 18, "topic": "6-year-old violent over phone use", "type": "SBA", "theme": 5, "stem": "A 6-year-old boy spends his leisure time watching YouTube videos and becomes violent when his parents restrict his phone use. Her mother complained about this case to MOH when she visited the field family planning clinic. What is the best advice to recommend to her?", "options": {"A": "Refer the child to a child psychiatrist.", "B": "Improve quality time spent with the child.", "C": "Have a timetable to use the phone.", "D": "Take the phone away from the child.", "E": "Use parental control of the device and allow to use the phone."}, "answer": "B", "prov": null, "cannot": false, "explanation": "The ECD lecture puts time with a responsive, stimulating and caring adult first, followed by play, reading and stories, and says screen time is best minimised because screens give impoverished stimulation compared with real experience. Quality time replaces the screen with the interaction the child needs and tackles the cause of the behaviour. A psychiatrist (A) is not needed for this problem, and taking the phone away abruptly (D) or allowing continued use with controls (E) does not deal with it. A timetable (C) is useful but is a limit and does not meet the underlying need.", "source": "13 Early Childhood Development Batch 34, slides 11, 24 to 27 (\"Spend time with children!\", \"Minimise screen time!\"); 11-Mental Health Promotion batch32, Parenting slide.", "confidence": "CHECK on B. The lecture supports both quality time (B) and limiting screen time (C), and it is aimed at young children. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "MHChild", "atName": "Mental health promotion in childhood", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 172, "batch": "B31 Q19", "file": "B31", "paperNo": 19, "topic": "School of 245 students, SMI", "type": "SBA", "theme": 5, "stem": "Narangodapaluwa School with 245 students and grades from 1-5 held its School medical inspection. Which of the following is the most suitable activity?", "options": {"A": "Providing mid-day meals for students with low BMI.", "B": "Referring all students to the pediatric eye clinic.", "C": "Reproductive health program for grade 5 students.", "D": "Vaccinating grade 4 children with varicella-zoster.", "E": "Measuring weight and height in grade 1 and 4 students."}, "answer": "E", "prov": null, "cannot": false, "explanation": "In schools with more than 200 students, SMI covers grades 1, 4, 7 and 10, and the PHI screens height, weight, BMI and clinical anaemia. A school of 245 therefore targets grades 1 and 4, so E is the activity that fits. Referral is only for children with identified problems (B), reproductive health education starts in grade 8 (C), and varicella is not in the school vaccine schedule of DT/OPV, HPV, aTd and MMR (D). The lecture describes no mid-day meal for low BMI children (A). This is consistent with Q115, where a school of 168 students has all students examined.", "source": "10 School Health Program Sri Lanka (Dr Gunathilake), School Medical Inspection (<200 and >200 children), Immunization and awareness programme slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "SchHlth", "atName": "School health programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 173, "batch": "B31 Q20", "file": "B31", "paperNo": 20, "topic": "Incorrect complementary feeding advice", "type": "SBA", "theme": 4, "stem": "Sandamali visits the MOH to get advice regarding complementary feeding for her 6-month-old child. Which of the following advice is incorrect?", "options": {"A": "Start with small amounts of mashed rice.", "B": "Continue breast feeding along with the complementary feeding.", "C": "Gradually add vegetables to the rice.", "D": "Fish can be added to the meal in the first month of feeding.", "E": "If the child refuses to eat add a small amount of salt to make it palatable."}, "answer": "E", "prov": null, "cannot": false, "explanation": "The first food is well-mashed rice in 2-3 teaspoon amounts, with breastfeeding continued. Iron-rich animal foods such as fish should be added within the first week of complementary feeding, and one new food is added at a time, so A to D are correct. Salt and sugar are avoided in the first year. If a child refuses food, the guideline advises trying different tastes, textures and preparations, patiently and without forcing. This is consistent with Q114.", "source": "Guidelines on Infant and Young Child Feeding (sections 4, 5 and 7); infant feeding - commed (national recommendations 4 and 9); Booklet on Complementary Feeding (pages 2 to 5).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "InfFeed", "atName": "Infant feeding practice", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 174, "batch": "B31 Q21", "file": "B31", "paperNo": 21, "topic": "Preventing adolescent drowning", "type": "SBA", "theme": 7, "stem": "A group of 15-year-old students have skipped school to bathe at sea. Later it was reported that all of them died due to drowning. Their blood alcohol levels were found to be high. What is the best method to prevent incidents like this in the future?", "options": {"A": "Increase the number of safeguards at the sea.", "B": "Strong enforcement of minimum age of alcohol purchase law for school.", "C": "Provide school students with swimming lessons.", "D": "Empower adolescents through targeted training programs aimed at enhancing their decision-making abilities and fostering positive lifestyle skills.", "E": "Ensure strict enforcement of school regulations about skipping school."}, "answer": "D", "prov": null, "cannot": false, "explanation": "The accidents lecture covers drowning only in young children (constant supervision, barricading unsafe water) and lists a water-safety working group, so it does not directly answer this scenario. Here the cause is adolescent risk-taking with alcohol and truancy, which is best addressed by building decision-making and life skills. A, B, C and E each address a single factor (supervision, access to alcohol, swimming ability, school rules).", "source": "Prevention of Accidents lecture, Drowning slide and Notification slide (water safety working group). The adolescent life-skills approach is standard knowledge.", "confidence": "CHECK on D. The lecture does not cover adolescent drowning, and B or C could be argued. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "Accid", "atName": "Prevention of accidents", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 175, "batch": "B31 Q22", "file": "B31", "paperNo": 22, "topic": "Well women clinic statement", "type": "SBA", "theme": 1, "stem": "The most correct statement regarding well-women clinics in Sri Lanka", "options": {"A": "It is conducted as a part of Healthy Lifestyle Centers.", "B": "It screens for risk factors of non-communicable diseases.", "C": "All 45-year-old women are encouraged to attend well women's clinic.", "D": "Anyone in the age category can go to any clinic in the country.", "E": "It is the only facility available at the primary care level."}, "answer": "C", "prov": null, "cannot": false, "explanation": "The lectures say WWC targets the 35-year and 45-year age cohorts since 2018, so C matches. The WWC is a separate programme from Healthy Lifestyle Centers, which the lecture lists alongside it for both sexes, so A is wrong. B is only partly true, because the WWC also screens for cancers, thyroid, menstrual and reproductive tract conditions. D is wrong because clinics are run through each MOH area with a register, and E is wrong because the Healthy Lifestyle Centers are also available at primary care level.", "source": "14 WWC (Implementation slide: 35-year and 45-year age cohorts). 14 WELL WOMAN CLINIC PROGRAMME Recorded (clinics at each MOH; Healthy Lifestyle Centers for both sexes; 45-year cohort for cervical screening; who is responsible).", "confidence": "CHECK on C. B is also partly true, and the lecture does not say which wording is \"most correct\". Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "WWC", "atName": "Well Woman Clinic programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 176, "batch": "B31 Q23", "file": "B31", "paperNo": 23, "topic": "Classifying a maternal death (assault, 12 weeks)", "type": "SBA", "theme": 2, "stem": "A 31-year-old pregnant clerk with a POA of 12 weeks was physically abused by a gang of robbers during a bank robbery. She was hospitalized with lower abdominal trauma and a head injury. She was unconscious at the time of admission and died on the same day due to a massive intracranial haemorrhage.\nWhat is the most suitable term according to the classification?", "options": {"A": "Direct obstetric death", "B": "Incidental death", "C": "Indirect obstetric death", "D": "Late maternal death", "E": "Pregnancy-related death"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The death was caused by external violence, not by pregnancy or its management, and it occurred during pregnancy. The lecture's investigation step sorts deaths into direct, indirect or incidental, and this one is incidental. A and C need an obstetric cause or aggravation by pregnancy. D applies only after 42 days. E (\"pregnancy-related death\") is the broader umbrella that includes incidental deaths, so it is true but less specific. This is a different scenario from Q149 (suicide in a woman with depression, which was judged indirect). The idea is the same, so the answers are kept consistent.", "source": "08 Maternal Mortality, \"Maternal Death Investigation\" process slide (direct / indirect / incidental) and the Pregnancy related Death definition slide.", "confidence": "CHECK on E. Both B and E fit the lecture definitions, and the examiner may want the umbrella term. Best answer is B.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 177, "batch": "B31 Q24", "file": "B31", "paperNo": 24, "topic": "Anaphylaxis after MMR", "type": "SBA", "theme": 9, "stem": "A baby got the MMR vaccine at the child welfare clinic. During the post-immunization period, the child develops fascial scratching and the mother complains of lip oedema. What is the immediate step of management as the MOH?", "options": {"A": "IM adrenaline 1:1000", "B": "IV Chlorpheniramine 1:1000", "C": "Hydration of the infant", "D": "Observing the child for an extended period", "E": "Transporting the child to NCTH"}, "answer": "A", "prov": null, "cannot": false, "explanation": "Facial itching (\"fascial\" is a typo for \"facial\") with lip swelling soon after a vaccine suggests an anaphylactic reaction, and the first-line treatment is IM adrenaline 1:1000 (standard knowledge). Antihistamine (B) is only an adjunct and is not given IV at that strength. Transfer (E) follows after adrenaline, and observing or hydrating alone (C, D) delays life-saving treatment.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on A. No lecture in project, but the management is standard for anaphylaxis. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 178, "batch": "B31 Q25", "file": "B31", "paperNo": 25, "topic": "HIV transmission pattern", "type": "SBA", "theme": 9, "stem": "Transmission of HIV in Sri Lanka commonly due to,", "options": {"A": "Female sex workers", "B": "Male to male sex", "C": "IV drug abusers", "D": "Transgender females", "E": "Beach boys"}, "answer": "B", "prov": null, "cannot": false, "explanation": "Sexual transmission accounts for most HIV infections in Sri Lanka, and among the groups listed, men who have sex with men make up the largest share of reported key-population cases (standard knowledge, from memory of national surveillance data). Injecting drug use is a minor route in Sri Lanka. Female sex workers, transgender women and beach boys are smaller groups.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on B. No lecture in project, I could not confirm current surveillance figures, and the stem wording is loose. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 179, "batch": "B32 Q1", "file": "B32", "paperNo": 1, "topic": "Chickenpox", "type": "MTF", "theme": 8, "stem": "Chicken pox,", "options": {"A": "Acyclovir is effective in preventing disease duration", "B": "Adults have higher risk developing complications", "C": "It is not a notifiable disease", "D": "Spread through respiratory droplets", "E": "Vaccination gives lifelong immunity"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Acyclovir started early shortens the illness (option A has a typo, \"preventing\" for \"reducing\"), and adults have more complications such as pneumonia, so B is true. Chickenpox is notifiable in Sri Lanka, so C is false. It spreads by respiratory droplets and contact with vesicle fluid, so D is true. Vaccine-induced protection is not guaranteed to be lifelong, so E is false (all standard knowledge).", "source": "No lecture in project. Answers are standard knowledge.", "confidence": "CHECK on A and C. A depends on how the examiner reads the wording, and I am relying on memory that chickenpox is on the notifiable list. Best answer is A True and C False.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 180, "batch": "B32 Q2", "file": "B32", "paperNo": 2, "topic": "Criteria for re-emerging disease", "type": "MTF", "theme": 8, "stem": "What are the criteria for a disease to consider as a re-emerging disease?", "options": {"A": "It has developed resistance to previously effective drugs", "B": "Previously controlled disease now increased incidence", "C": "It has once cause serious health issues word wide", "D": "It is known to cause disease only in animals", "E": "They are known to cause serious health complications in human"}, "answer": {"A": false, "B": true, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture defines a re-emerging disease as a previously known agent that had fallen to levels no longer seen as a public health problem and is now increasing in incidence and prevalence, which matches B. Drug resistance (A) is treated in the lecture as a separate threat (antimicrobial resistance), not as the criterion. A disease that affects only animals (D) is not yet a human disease, and past worldwide severity or severe complications (C, E) are not part of the definition (the options have typos \"once cause\" and \"word wide\").", "source": "Lecture \"Emerging and Re-emerging Infectious Diseases\": slide \"Definitions of Emerging Infectious Disease (EID) and Re-emerging Infectious Diseases\".", "confidence": "CHECK on A and C. An examiner could count drug-resistant re-surgence or past worldwide burden as supporting features, but neither is in the lecture definition. Best answer is A False and C False.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 181, "batch": "B32 Q3", "file": "B32", "paperNo": 3, "topic": "Threats to malaria re-establishment", "type": "MTF", "theme": 8, "stem": "Threats to prevention of re-establishment of malaria in Sri Lanka", "options": {"A": "Presence of vector", "B": "Patient not revealing travel history", "C": "Chemoprophylaxis is not given to travellers visiting malaria endemic countries", "D": "Availability of accurate diagnosis in private sector", "E": "Delayed diagnosis of imported malaria"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Sri Lanka still has receptive Anopheles vectors, and imported cases that are missed or diagnosed late can restart transmission, which makes A, B, C and E threats. The lecture's prevention slide stresses good surveillance, quality diagnosis and treatment, and case and foci investigation. Availability of accurate diagnosis (D) protects against re-establishment, so as printed it is not a threat (it reads like a typo for \"lack of\").", "source": "Lecture \"Emerging and Re-emerging Infectious Diseases\": slides \"Re-emerging diseases\" (malaria) and \"Prevention of re-emergence of diseases\". Options A to C and E are standard knowledge.", "confidence": "CHECK on C and D. C depends on the examiner counting missing traveller chemoprophylaxis as a threat, and D depends on the likely typo. Best answer is C True and D False.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 182, "batch": "B32 Q4", "file": "B32", "paperNo": 4, "topic": "Japanese encephalitis", "type": "MTF", "theme": 8, "stem": "Which of the following statements is/are true regarding Japanese Encephalitis", "options": {"A": "Special Surviellence is required in suspected cases", "B": "Japanese Encephalitis is primarily transmitted by Anopheles mosquitoes", "C": "Majority of cases affected to children below 15 years", "D": "Animal is the main host. Human is incidental.", "E": "Vector control is the most effective method for prevention and control"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "JE is transmitted mainly by Culex mosquitoes, not Anopheles, so B is false. Pigs and wading birds are the amplifying hosts and humans are dead-end hosts, so D is true, and cases cluster in children, so C is true. Vaccination is the most effective preventive measure because vector control is difficult in paddy areas, so E is false (A has a typo, \"Surviellence\").", "source": "No lecture in project. Answers are standard knowledge.", "confidence": "CHECK on A and E. I am relying on memory for the special surveillance requirement, and the \"most effective method\" wording is a judgement. Best answer is A True and E False.", "check": true, "checkLetters": ["A", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 183, "batch": "B32 Q5", "file": "B32", "paperNo": 5, "topic": "Illegal under substance prevention", "type": "MTF", "theme": 7, "stem": "What is currently illegal under the prevention of substance use in Sri Lanka", "options": {"A": "'Happy hour' alcohol beverage discounts in some restaurants", "B": "Chocolates containing cannabis being promoted on Facebook", "C": "Shisha lounge establishment in some hotels", "D": "Beer garden concept in some five star hotels", "E": "Selling single cigarette sticks without the whole pack"}, "answer": {"A": false, "B": true, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "Cannabis products are outside the legal medicinal and Ayurvedic use, so promoting cannabis chocolates is illegal (B True). Beer gardens in licensed hotels are lawful (D False). I could not confirm from the lecture or standard knowledge that discounts on alcohol (A), shisha lounges (C) or single-stick sales (E) are currently banned. I have therefore marked them False as the best answer.", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on A, C and E. There is no substance-use lecture, and I am not sure of the current legal position on these three. Best answer is False for all three.", "check": true, "checkLetters": ["A", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "Subst", "atName": "Substance use", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 184, "batch": "B32 Q6", "file": "B32", "paperNo": 6, "topic": "Filariasis", "type": "MTF", "theme": 8, "stem": "Which of the following are true regarding filariasis", "options": {"A": "Filariasis can be transmitted through close contact with an infected person", "B": "Matale & Kandy are endemic districts", "C": "Mass drug administration with DEC is an effective control strategy", "D": "Reduction of microfilaria rate to less than 0.1% indicates elimination as a public health problem", "E": "Vectors breed in stagnant and polluted water sources"}, "answer": {"A": false, "B": false, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Filariasis is mosquito-borne, not spread by close contact, so A is false. Mass drug administration with DEC is the main parasite-control strategy, and the Culex vector breeds in stagnant, polluted water, so C and E are true. The usual WHO threshold for stopping mass treatment is a microfilaria rate below 1%, not 0.1%, so D is false (standard knowledge). The endemic belt is in the western and southern coastal provinces, so Matale and Kandy (B) are not endemic districts.", "source": "Lecture \"Emerging and Re-emerging Infectious Diseases\": slide \"Re-emerging diseases\" (filariasis listed for Sri Lanka) and slide \"Prevention of re-emergence of diseases\". All option details are standard knowledge.", "confidence": "CHECK on B and D. I am relying on memory for the endemic districts and the exact elimination threshold. Best answer is B False and D False.", "check": true, "checkLetters": ["A", "B", "D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 185, "batch": "B32 Q7", "file": "B32", "paperNo": 7, "topic": "Enteric fever", "type": "MTF", "theme": 8, "stem": "T/F Regarding enteric fever", "options": {"A": "Caused by both Salmonella typhi and S. paratyphi", "B": "Chemoprophylaxis with antibiotics is a known preventive strategy", "C": "Children have a high chance to contract the disease", "D": "Ingestion of raw milk can cause the disease", "E": "Travelers going to endemic countries given typhoid vaccine"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Enteric fever is caused by S. typhi and S. paratyphi, so A is true, which is consistent with Q161 A. Prevention rests on safe water, food hygiene, handwashing and vaccination, not antibiotic chemoprophylaxis, so B is false. Contaminated milk can carry the organism, so D is true. Typhoid vaccine is advised for travellers to endemic areas, so E is true (all standard knowledge).", "source": "No lecture in project. The lecture only names typhus and cholera as stage 4 examples, so these answers are standard knowledge.", "confidence": "CHECK on C. Children are commonly affected in endemic settings, but the stem gives no age data. Best answer is True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 186, "batch": "B32 Q8", "file": "B32", "paperNo": 8, "topic": "Occupational cancers", "type": "MTF", "theme": 6, "stem": "Regarding occupational cancers T/F", "options": {"A": "Effective preventive method of occupational cancers is early detection", "B": "Exposure to radon gas causes lung cancers in miners", "C": "Genetic predisposition has a minimal contribution for occupational cancers", "D": "Only small percentage of total cancers are occupational cancers", "E": "Cancers develop rapidly when people are exposed to carcinogens"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture says occupational carcinogens act over decades, so E is False, and prevention rests on controlling exposure through the hierarchy of control, so early detection (A) is not the effective preventive method. Radon causing lung cancer in miners is standard knowledge, so B is True. C and D are taken as True because occupational cancers are driven by exposure and make up a small share of all cancers (standard knowledge, as the lecture's occupational cancers slide has only a heading).", "source": "Occupational Diseases lecture, \"Occupational diseases\" slide (decades in occupational carcinogens), \"Occupational cancers\" heading and \"Controlling hazards\" slides. B, C and D are standard knowledge.", "confidence": "CHECK on C and D. The lecture gives no content on genetic predisposition or the proportion of occupational cancers. Best answer is C True, D True.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": ["Cancer"], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 187, "batch": "B32 Q9", "file": "B32", "paperNo": 9, "topic": "Cancer epidemiology", "type": "MTF", "theme": 7, "stem": "Which of the following statement is/are true or false regarding the cancer epidemiology?", "options": {"A": "Oral cancer is the commonest cancer in Sri Lanka", "B": "Breast cancer is the commonest cancer in women worldwide", "C": "There is a significant influence in gender in terms of colorectal carcinoma", "D": "Thyroid carcinoma mainly occurs in males", "E": "Most of the cancers have a more impact on genetic predisposition than the modifiable risk factors"}, "answer": {"A": false, "B": true, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The NCCP lecture frames cancer prevention around modifiable risk factors (physical inactivity, unhealthy diet, alcohol, tobacco), so E is False. B is standard knowledge, since breast cancer is the commonest cancer in women worldwide. By standard knowledge, thyroid cancer is commoner in women (D False) and colorectal cancer has no strong sex predominance (C False). The lecture slides give no incidence data for A. Recent Sri Lankan registry figures show breast cancer as the leading cancer overall, but oral cancer led historically (mainly in men).", "source": "Prevention & Control of Cancers lecture, Primary Prevention of Cancers slide (risk factors). Incidence statements are standard knowledge, as the lecture has no epidemiology figures.", "confidence": "CHECK on A. The lecture gives no incidence data, and the answer depends on which year and which group (both sexes or males only) is meant. Best answer is False.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "Cancer", "atName": "National cancer control programme", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 188, "batch": "B32 Q10", "file": "B32", "paperNo": 10, "topic": "National Health Information System", "type": "MTF", "theme": 7, "stem": "Which of the following are true/false regarding the National Health Information System of Sri Lanka?", "options": {"A": "ICD-10 system coding is used to report morbidity and mortality rates in Sri Lanka", "B": "e-IMMR helps to increase timeliness of health information", "C": "Indoor Morbidity and Mortality Reporting (IMMR) is conducted only for public sector hospitals", "D": "National Health Information System collects data through both paper-based and electronic formats", "E": "Health information collected at the divisional level is compiled at the Medical Officer of Health (MOH) office for planning"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The HIS lecture shows IMMR as a bed head ticket, then ICD coding by the medical records unit, then electronic entry into e-IMMR with quarterly reporting across 500+ curative hospitals (A, B, C). Paper source documents (bed head ticket, notification card, field MCH records) feed electronic systems, so D is True. Field data are compiled through the MOH for planning (E). The lecture does not say \"ICD-10\", \"only public sector\" or \"divisional compilation\" in so many words.", "source": "HIS lecture, Components, E-IMMR, E-Surveillance and e-RHIMS slides. The ICD version, public-sector-only and divisional-compilation points are standard knowledge.", "confidence": "CHECK on C. The lecture does not state that IMMR covers only public hospitals. Best answer is True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "NHIS", "atName": "National health information system", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 189, "batch": "B32 Q11", "file": "B32", "paperNo": 11, "topic": "Purpose of IHR", "type": "SBA", "theme": 8, "stem": "Main purpose of IHR is to,", "options": {"A": "Prevent epidemics in countries", "B": "Prevent disruption of world trade due to infectious diseases", "C": "Prevent diseases entering from ports", "D": "Eradicate Plague", "E": "Improve quality of healthcare in a country"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The IHR aim to prevent the international spread of disease while avoiding unnecessary interference with international travel and trade. Of the options, B is the closest match to that objective. Option C reflects the older, port-focused regulations, and D and E are not objectives of the IHR (standard knowledge).", "source": "No lecture in project. The lecture defines PHEIC (an IHR concept) on the COVID-19 history slide but never names the IHR.", "confidence": "CHECK on A and C. The best-wording answer, \"prevent international spread of disease\", is not offered, so A or C could be the examiner's choice. Best answer is B.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": ["DevPH"], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 190, "batch": "B32 Q12", "file": "B32", "paperNo": 12, "topic": "Removing illegal bus accessories", "type": "SBA", "theme": 7, "stem": "The government decided to remove illegally fitted accessories and exterior attachments from buses and public vehicles...", "options": {"A": "Establishing a strong legal framework", "B": "Enhancing stakeholder involvement", "C": "Strengthening law enforcement by authorities", "D": "Providing a better scientific rationale", "E": "Implementing effective monitoring and evaluation"}, "answer": null, "prov": "C", "cannot": true, "explanation": "If the question asks which road-safety approach this action represents, C is the likely fit, because removing illegal fittings is an enforcement action. The lecture lists enforcement by a dedicated agency and legislation on vehicle safety and registration under \"Measures to take\". That is only a tentative reading, since the question itself is not printed.", "source": "Prevention of Accidents lecture, Measures to take (safety of vehicles; enact and enforce road safety legislation).", "confidence": "CHECK on C. The stem is cut, so I cannot confirm what is asked. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "Accid", "atName": "Prevention of accidents", "atCat": "Special topics", "at2": [], "incomplete": true, "evidence": "lecture", "accepted": false, "scored": false}, {"id": 191, "batch": "B32 Q13", "file": "B32", "paperNo": 13, "topic": "New bride, FP advice (stem cut)", "type": "SBA", "theme": 2, "stem": "Saheli was a new br
