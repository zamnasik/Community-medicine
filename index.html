, "B": "Condoms", "C": "DMPA", "D": "IUCD", "E": "Post coital contraception"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Under WHO eligibility criteria, a woman with BP in the 140-159 / 90-99 range should usually avoid the combined pill (A). Hormonal injectables (C) are not first choice either. The copper IUCD has no hormonal or blood pressure effect and is highly effective, so it suits a woman who wants reliable long-term contraception. Condoms (B) are safe but less effective. Post coital contraception (E) is not a regular method.", "source": "No lecture in project covers the content. The Family Planning lecture lists COCP, DMPA and Cu-IUD as national programme methods and only names the WHO Medical Eligibility Criteria (5th Ed. 2015), with details deferred to PBL sessions. The category details are standard knowledge.", "confidence": "CHECK on D. The eligibility categories are not in the lecture. Condoms (B) are the main alternative if she wants no procedure. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 41, "batch": "B24 Q13", "file": "B24", "paperNo": 13, "topic": "Key school health intervention", "type": "SBA", "theme": 5, "stem": "The most important intervention regarding school health programme which improves the health of the school health community is…", "options": {"A": "Implementation of health promotion club", "B": "Health session at health day", "C": "Periodical water quality of school surveillance in school", "D": "School medical inspection", "E": "Implementation of school canteen policy"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lecture says the school environment shapes lifestyle choices and NCD risk, and that focus on the school canteen is mandatory to improve nutritional status. The canteen policy is a whole-school, daily, policy-level measure, so it reaches every student and staff member. SMI (D) mainly screens grades 1, 4, 7 and 10 in schools above 200 students, and the health club (A) and health day sessions (B) depend on activity plans and are periodic. Water quality surveillance (C) is one part of the annual school health survey.", "source": "10 School Health Program Sri Lanka (Dr Gunathilake), School Canteen Policy 2006 slides; 10 School Health Programme final (Dr Pannala), School Canteen Policy slides.", "confidence": "CHECK on E. The lectures never rank the interventions, so \"most important\" is a judgement. Best answer is E. A (health promotion club) and D (SMI) are the nearest alternatives.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "SchHlth", "atName": "School health programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 42, "batch": "B24 Q14", "file": "B24", "paperNo": 14, "topic": "Foundation of safe motherhood", "type": "SBA", "theme": 1, "stem": "According to the safe mother concept, the foundation of safe motherhood is…", "options": {"A": "Antenatal care", "B": "Clean and safe delivery", "C": "Equity of health care", "D": "Family planning", "E": "Primary health care"}, "answer": "E", "prov": null, "cannot": false, "explanation": "Antenatal care, clean and safe delivery and family planning are the components or pillars in the lectures, so A, B and D are wrong. Primary health care is the foundation these rest on (standard knowledge, kept consistent with Q17). C is the main distractor because equity is also a foundation element in some versions of the model.", "source": "02-ANC and PNC revised (Safe motherhood slides list the components but do not name the foundation in text). Answer is standard knowledge.", "confidence": "CHECK on E. The lecture text is silent on the foundation, and C (equity) is arguable. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "RHC", "atName": "Reproductive health concepts", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 43, "batch": "B24 Q15", "file": "B24", "paperNo": 15, "topic": "Demographic transition phase, 2015 rates", "type": "SBA", "theme": 3, "stem": "In 2015, crude birth rate in Sri Lanka was 16 per 1000 population. Crude death rate was 6.3 per 1000 population. Based on 2015 data, Sri Lanka is in which phase of the demographic transition model?", "options": {"A": "Declining phase", "B": "Early expanding phase", "C": "High stationary phase", "D": "Late expanding phase", "E": "Low stationary phase"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Natural increase = CBR − CDR = 16 − 6.3 = 9.7 per 1000 (standard knowledge). The population is still growing, but the birth rate has fallen and the death rate is low, which matches the lecture's Stage 3 (late expanding). E is wrong because Stage 4 (low stationary) needs both rates low with a steady population, and births here are still more than double deaths. Same idea as Q18 with different figures, and the answer is consistent.", "source": "Demographic transition (Dr Nazneen Nazeer), Stage 2 to Stage 5 slides.", "confidence": "CHECK on D. The lecture gives no numeric cut-offs for the stages, so the placement rests on the pattern of the two rates. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 45, "batch": "B24 Q17", "file": "B24", "paperNo": 17, "topic": "Total fertility rate definition", "type": "SBA", "theme": 3, "stem": "Total fertility rate is …………… if she passes through her reproductive years conforming to the age specific fertility rates of a given year. What is the most appropriate phrase for the blank?", "options": {"A": "Number of children born to a married female", "B": "Number of children born to a female", "C": "Number of girls that would be born to a married female", "D": "Number of girls that would be born to a married female over her lifetime", "E": "Number of girls that would be born to a female over her lifetime"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture defines TFR as the number of children a woman in a hypothetical cohort will bear in her lifetime if she bore children at the age-specific rates and none of the females died in the reproductive years. The working is TFR = 5 × the sum of the ASFRs per woman, and the lecture's 2012 example gives 2.16. C, D and E count girls only, which is the gross reproduction rate, and A and C wrongly limit it to married women.", "source": "06-Measures of Fertility, Total Fertility Rate slide and the GRR slide.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 46, "batch": "B24 Q18", "file": "B24", "paperNo": 18, "topic": "Adult male examined by MOH", "type": "SBA", "theme": 2, "stem": "Of the following scenarios, an adult male is clinically examined by the Medical Officer of Health only during…", "options": {"A": "Antenatal clinic for the couple", "B": "Antenatal clinic booking visit", "C": "Field family planning clinic", "D": "Newly married couple’s clinic visit", "E": "School medical inspection"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Pre-conception care for newly married couples assesses the health and risk factors of both partners. At the antenatal booking visit (B) the pregnant woman is the one examined. The FP lecture lists \"counselling males\" as an issue, which implies males are counselled rather than examined at FP clinics (C). School medical inspection (E) is for students, and the antenatal couple clinic (A) is for education.", "source": "Nutrition in Pregnancy Batch 35, \"Pre-conception care (PCC)\" slide (assessment of the couple). 02-ANC and PNC revised, booking visit slides (mother examined). Family Planning Services in Sri Lanka_Batch 34, \"Issues in FP service delivery\" (counselling males). That an adult male is clinically examined is partly standard knowledge.", "confidence": "CHECK on C. No lecture states outright who is physically examined by the MOH. Examination of a man at the FP clinic (for example before male sterilisation) is possible. Best answer is D.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 47, "batch": "B24 Q19", "file": "B24", "paperNo": 19, "topic": "Quarry worker diagnosis", "type": "SBA", "theme": 6, "stem": "59 years old male presented with chronic cough, SOB. Chest Xray showed diffuse lung opacities. He is working in a quarry for 40 years. Diagnosis is…", "options": {"A": "Byssinosis", "B": "Fibrosis", "C": "Tuberculosis", "D": "Siderosis", "E": "Silicosis"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lecture links silica dust to silicosis, and quarry work for 40 years means long exposure to silica dust (standard knowledge), with diffuse opacities on X-ray. D is wrong because siderosis is caused by iron dust, and A is wrong because byssinosis comes from cotton dust (standard knowledge). B names a non-specific end result, not the occupational disease.", "source": "Occupational Diseases lecture, \"Diseases due to exposure to chemicals\" slide (inorganic dust: silica – silicosis, iron – siderosis).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 48, "batch": "B24 Q20", "file": "B24", "paperNo": 20, "topic": "Situation analysis", "type": "SBA", "theme": 9, "stem": "Newly appointed Medical Officer of Health has been informed that the rate of teenage pregnancy is above average in a cluster of villages in his area. He decided to plan a programme to advise this issue. He requested all the PHMs to submit the relevant records maintained by them for review of information. This activity can be best described as…", "options": {"A": "Evaluation", "B": "Implementation", "C": "Monitoring", "D": "Prioritisation", "E": "Situation analysis"}, "answer": "E", "prov": null, "cannot": false, "explanation": "Collecting and reviewing existing records to understand the size and nature of a problem before planning is situation analysis, the first step of the planning cycle (standard knowledge). Evaluation and monitoring both need an ongoing programme, which does not exist yet. Prioritisation comes after the problem has been described.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on E. No lecture in project, but the scenario fits the standard definition clearly. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 49, "batch": "B24 Q21", "file": "B24", "paperNo": 21, "topic": "Road traffic accident prevention", "type": "SBA", "theme": 7, "stem": "Road traffic accidents are major cause of hospitalisation in Sri Lanka. Best prevention method is…", "options": {"A": "Improving the helmet wearing", "B": "Improve the quality of roads and highways", "C": "Improving the training and licensing of drivers", "D": "Prohibiting the use of outdated vehicles", "E": "Start implementation of seat belt law"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture groups RTA prevention into safer roads, safer vehicles and safe road use (laws mandating helmets, seat belts and child restraints, speed and alcohol limits). It also says two- and three-wheelers have the highest RTI prevalence and that motorcyclists are vulnerable road users, which makes helmet use the best-supported option here. Seat belts (E) mainly protect car occupants, and the lecture does not mention driver training or licensing (C) at all, only training for enforcement staff. The lecture does not rank the measures, so A is a best-fit choice.", "source": "Prevention of Accidents lecture, Road Traffic Accidents slides (Factors causing accidents; Measures to take 1 to 3). The road traffic charts are image-only and could not be read.", "confidence": "CHECK on A. The lecture does not rank the measures, and C (driver behaviour is the main cause) could be the intended answer. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "Accid", "atName": "Prevention of accidents", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 50, "batch": "B24 Q22", "file": "B24", "paperNo": 22, "topic": "Start of the early childhood period", "type": "SBA", "theme": 4, "stem": "Early childhood period begins at…", "options": {"A": "Birth", "B": "Conception", "C": "Infancy", "D": "Neonatal period", "E": "Six months of age"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The ECD lecture defines early childhood as 0 to 5 years, made up of the neonate (first 28 days), infant (first year), toddler and preschooler. So it begins at birth. The lecture mentions conception only in the \"first 1000 days\" slide (270 + 365 + 365), which is a separate critical window. C and D are phases inside the period, and E has no basis. Some national policy documents (standard knowledge) may define early childhood from conception, but the lecture does not.", "source": "13 Early Childhood Development Batch 34 (slides \"Child\" and \"Early Childhood 0 to 5 years\"; \"First 1000 days\").", "confidence": "CHECK on B. The lecture says 0 to 5 years, but a policy-style definition from conception could be what the examiners intended. Best answer is A.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "ECD", "atName": "Early childhood development", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 51, "batch": "B24 Q23", "file": "B24", "paperNo": 23, "topic": "Immunisation programme responsibility", "type": "SBA", "theme": 9, "stem": "In issues regarding immunisation, the Director of Ministry of Health to be consulted is…", "options": {"A": "Epidemiology Unit", "B": "Family Health Bureau", "C": "Educational Health Bureau", "D": "Management and Planning Unit", "E": "Medical Data Unit"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The National Immunisation Programme is run by the Epidemiology Unit of the Ministry of Health (standard knowledge). The Family Health Bureau handles maternal, child and family planning programmes, not vaccines. Option C is probably a typo for the Health Education Bureau, and it is wrong either way.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on A. No lecture in project and the stem wording (\"Director of Ministry of Health\") is loose. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 52, "batch": "B24 Q24", "file": "B24", "paperNo": 24, "topic": "Least coverage in Sri Lanka", "type": "SBA", "theme": 1, "stem": "Of the following, which has the least coverage in Sri Lanka?", "options": {"A": "Institutional deliveries", "B": "Issues of the CHDR", "C": "Post-partum visits by PHM", "D": "Pregnant mothers register by PHM", "E": "Tetanus toxoid coverage in children"}, "answer": "C", "prov": null, "cannot": false, "explanation": "Institutional delivery is almost universal, and pregnancy registration, CHDR issue and childhood immunisation are all high, as standard knowledge. Postnatal home visits by the PHM are the field service with the lowest reach among these options. The lecture says only that coverage depends on access and social factors. In E, \"Tetanus toxoid in children\" is odd wording, since TT is normally a pregnancy vaccine.", "source": "No lecture in project gives national coverage figures. 02 Antenatal and Postnatal Care (Prof Anuradhini), Summary slide, mentions coverage problems only in general terms. Answer is standard knowledge.", "confidence": "CHECK on C. No lecture gives coverage percentages to rank the options. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 53, "batch": "B24 Q25", "file": "B24", "paperNo": 25, "topic": "Human milk vs cow's milk composition", "type": "SBA", "theme": 4, "stem": "Which of the following has a high content in human milk than cow's milk?", "options": {"A": "Proteins", "B": "Calcium", "C": "Fat", "D": "Sodium", "E": "Phosphate"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The project lectures give no composition table, so this rests on standard knowledge. Human milk is lower than cow's milk in protein (mainly whey, while cow's milk is casein-dominant), calcium, sodium and phosphate. This gives cow's milk a higher renal solute load. Fat is the only option that is not clearly lower in human milk, and human milk is richer in the essential fatty acids needed for brain growth. The stem is also worded loosely (\"a high content ... than\"), so fat is the best fit rather than a clear-cut answer.", "source": "No lecture in project. The Breast Feeding lecture has only a title slide, \"Are all mammal milk same?\", with no content. The answer is standard knowledge.", "confidence": "CHECK on C. No lecture gives milk composition, and fat content is similar in the two milks rather than clearly higher in human milk. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "InfFeed", "atName": "Infant feeding practice", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 54, "batch": "B26 Q1", "file": "B26", "paperNo": 1, "topic": "Healthcare worker occupational risks", "type": "MTF", "theme": 6, "stem": "Healthcare worker during the course of their work, are at risk of acquiring…", "options": {"A": "Communicable diseases", "B": "Bowel carcinoma", "C": "HIV", "D": "Stress related diseases", "E": "Noise induced hearing loss"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture lists biological agents such as tuberculosis, hepatitis B and HIV, and psychological hazards such as work-related stress and burnout, so A, C and D are True (the stem's \"Healthcare worker\" should be \"Healthcare workers\"). B is False because bowel carcinoma has no specific work exposure in healthcare, and E is False because noise is not a typical hazard of healthcare work (standard knowledge for B and E).", "source": "Occupational Diseases lecture, \"Causes of occupational diseases\" slide (biological and psychological hazards).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 55, "batch": "B26 Q2", "file": "B26", "paperNo": 2, "topic": "Gender based violence", "type": "MTF", "theme": 5, "stem": "Which of the following is true / false regarding the following?", "options": {"A": "All actions against women are taken as gender based violence", "B": "Gender based violence can be psychological", "C": "Intimate partner violence is a form of gender based violence", "D": "Only women are the victims of gender based violence", "E": "Threatening behaviour without actual physical violence is not considered as gender based violence"}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture defines GBV as violence directed against a person because of their gender, so not every action against a woman counts (A). It lists physical, sexual, psychological and economic harm, including threats and coercion, so B is true and E is false. Intimate partner violence is presented as a major form of GBV, with prevalence data (C). Both women and men experience GBV although most victims are women and girls, so D is false.", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne), Overview, \"What is GBV?\" and Prevalence slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 56, "batch": "B26 Q3", "file": "B26", "paperNo": 3, "topic": "Adolescent health", "type": "MTF", "theme": 5, "stem": "Which of the following is / are true regarding the following?", "options": {"A": "Age period of adolescence is defined between 10 to 24 years", "B": "Sexual and reproductive health programs are not included in adolescent health programs", "C": "Nutrition monitoring is not indicated in adolescent health", "D": "Smoking and alcohol are important health issues in adolescents", "E": "Minimal age for marriage under General Law of Sri Lanka is 18 years of age"}, "answer": {"A": false, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lectures define adolescence as 10 to 19 years (early 10 to 14, mid 15 to 17, late 17 to 19), while 10 to 24 is \"young persons\" (A false). Risky sexual behaviour, pregnancy and STDs are listed as adolescent risks and SRH education is compulsory in school health (B false). SMI includes nutritional assessment, WIFS is given to grades 1 to 13, and obesity and NCD risk are listed as adolescent risks (C false). Drug, alcohol and tobacco use are named adolescent risks (D true). The lectures do not give the legal marriage age, so E is standard knowledge.", "source": "05-Adolescent health narrated, \"Who are adolescents?\" and \"Risk Faced by adolescents\" slides; 13 Early Childhood Development Batch 34, slide 2 (definitions); 10 School Health Program Sri Lanka, SMI, WIFS and awareness programme slides. Option E: standard knowledge.", "confidence": "CHECK on E. The marriage age is not in any lecture and special laws, such as Muslim law, differ from the General Law. Best answer is True.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 57, "batch": "B26 Q4", "file": "B26", "paperNo": 4, "topic": "Lymphatic filariasis elimination", "type": "MTF", "theme": 8, "stem": "True or False regarding elimination of lymphatic filariasis…", "options": {"A": "Two components of elimination strategy are interrupting transmission and controlling morbidity", "B": "Ampara district has high microfilaria incidence", "C": "Filaria cases have not been reported in Sri Lanka recently", "D": "Sri Lanka was one of the first countries in the WHO South East Asia region to eliminate lymphatic filariasis in 2016"}, "answer": {"A": true, "B": false, "C": false, "D": true}, "prov": null, "cannot": false, "explanation": "The global elimination strategy has two pillars, interrupting transmission through mass drug administration and managing morbidity, so A is true (standard knowledge). B is false because the historically high-microfilaria belt lies along the western and southern coastal areas, not Ampara. C is false because sporadic cases are still reported even after elimination was validated. D is true because WHO validated Sri Lanka as having eliminated LF as a public health problem in 2016.", "source": "No lecture in project covers this; the Emerging and Re-emerging lecture only lists filariasis among the re-emerging diseases relevant to Sri Lanka. Rest is standard knowledge.", "confidence": "CHECK on B. No lecture covers the options, so all four rest on standard knowledge, and the district claim in B is the least certain. Best answer is A True, B False, C False, D True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 58, "batch": "B26 Q5", "file": "B26", "paperNo": 5, "topic": "Leptospirosis prevention", "type": "MTF", "theme": 8, "stem": "Which of the following is / are true / False regarding the prevention of leptospirosis?", "options": {"A": "National Leptospirosis program focuses on reduction of incidence and case fatality rate as well as outbreak prevention", "B": "Penicillin is given as a prophylaxis to the farmers during the cultivation season", "C": "First leptospirosis case was reported in 1950 in Sri Lanka", "D": "Annually around 7000 deaths occur due to leptospirosis in Sri Lanka", "E": "Secondary prevention measures are also important as primary measures due to complications and case fatality of the disease"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "A and E are true by standard knowledge: the national programme targets incidence, case fatality and outbreaks, and early diagnosis and treatment (secondary prevention) reduces complications and deaths. B is false because chemoprophylaxis for high-risk farmers is doxycycline, not penicillin. D is false because annual deaths are far fewer than 7000. C is the weakest item: no lecture gives the first-case year and I could not confirm 1950, so I keep it False.", "source": "No lecture in project (the Occupational Diseases lecture only lists leptospirosis as an occupational biological disease). Standard knowledge.", "confidence": "CHECK on C. The date of the first case is in no lecture and I cannot confirm 1950 from standard knowledge. Best answer is A True, B False, C False, D False, E True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 59, "batch": "B26 Q6", "file": "B26", "paperNo": 6, "topic": "Monitoring and evaluation", "type": "MTF", "theme": 9, "stem": "Which of the following is true / false regarding the monitoring and evaluation of health care system?", "options": {"A": "Monitoring can be done annually", "B": "Surveys are not suitable as a monitoring method", "C": "Facilities available for delivery of services cannot be monitored", "D": "Aim of evaluation is to improve and redesign the program", "E": "Monitoring is different from evaluation because indicators are only used in evaluation"}, "answer": {"A": false, "B": false, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Monitoring is a continuous, frequent follow-up during implementation, whereas evaluation is periodic and aims to improve, redesign and re-plan the programme (standard knowledge). Surveys, supervision visits and routine data are all used for monitoring, and service facilities and logistics are part of what is monitored. Indicators are used in both monitoring and evaluation, so E is false.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on A. \"Annually\" could be read as a periodic review, but monitoring is meant to be frequent and continuous. Best answer is False.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 60, "batch": "B26 Q7", "file": "B26", "paperNo": 7, "topic": "Quality of health care", "type": "MTF", "theme": 9, "stem": "Which of the following is / are true / false regarding the quality of health care services?", "options": {"A": "Health care providers are mainly accountable to the patients and the population", "B": "Process of delivering care is more important than the outcome of care", "C": "Patient safety is synonymous with quality", "D": "One of the domains of quality is acceptability of services"}, "answer": {"A": true, "B": false, "C": false, "D": true}, "prov": null, "cannot": false, "explanation": "Providers are accountable to the patients and the community they serve (standard knowledge). Structure, process and outcome are all assessed in Donabedian's framework, and none is \"more important\", so B is false. Safety is only one domain of quality, so it is not synonymous with quality. Acceptability appears as a quality domain in several frameworks, but it is not in the commonest six-domain list.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on D. No lecture in project, and whether acceptability counts as a domain depends on which framework the lecturer used. Best answer is True.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 61, "batch": "B26 Q8", "file": "B26", "paperNo": 8, "topic": "Right to health", "type": "MTF", "theme": 9, "stem": "Concept of Right to Health does NOT include", "options": {"A": "Health education", "B": "Satisfaction to health care", "C": "Job satisfaction of health care worker", "D": "Medical assistance in a case of sickness", "E": "Protect environmental health"}, "answer": {"A": false, "B": false, "C": true, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The stem is a \"does NOT include\" question, so I read True as \"not part of the right to health\" and False as \"part of it\". Health education, medical care and a healthy environment are recognised elements of the right to health, and this fits Q10 (standard knowledge). Job satisfaction of health workers is not an element, so C is the best single answer if the paper intended an SBA. Satisfaction with care (B) is loosely covered through quality standards and patient rights.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on B. No lecture in project, and the item is printed as a \"does NOT include\" stem, so the True/False reading is a convention. Best answer is False, and the best single option is C.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "note": "This item is printed as a “does NOT include” question. The best single option is C.", "scored": true}, {"id": 62, "batch": "B26 Q9", "file": "B26", "paperNo": 9, "topic": "Evidence based medicine", "type": "MTF", "theme": 7, "stem": "Regarding Evidence Based medicine…", "options": {"A": "Meta analysis is highly important", "B": "Evidence from Randomised controlled trials are used in therapeutic interventions", "C": "Guidelines play an important part", "D": "Provides new areas of research regarding clinical cases for evidence based practising"}, "answer": {"A": true, "B": true, "C": true, "D": true}, "prov": null, "cannot": false, "explanation": "The review ranks meta-analysis of many RCTs at level Ia and calls systematic reviews the strongest evidence (A True), and RCTs are the gold standard for testing interventions (B True). The lecture lists clinical guidelines as an EBM resource and the review says they should be viewed critically (C True). EBM identifies knowledge gaps and is a stimulus for further trials (D True).", "source": "EBM powerpoint (Prof Kasturiratne), Introduction, Core principles, Steps of practice and Challenges slides; EBM for medical students (Diao et al., UBCMJ 2009), EBM in Practice and Challenges Facing EBM sections.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "EBM", "atName": "Evidence based medicine", "atCat": "EBM", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 63, "batch": "B26 Q10", "file": "B26", "paperNo": 10, "topic": "PHM reproductive health services", "type": "MTF", "theme": 1, "stem": "Which of the following is / are true regarding the reproductive healthcare services provided by the Public Health Midwife (PHM)?", "options": {"A": "Field level reproductive health care services start with conception", "B": "Family planning services are not as important as antenatal care", "C": "Postnatal services are not included in the reproductive health care services", "D": "Family health services are provided at household levels", "E": "PHM is the only field level healthcare worker involved with services relating to reproductive health promotion in Sri Lanka"}, "answer": {"A": false, "B": false, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Field care starts before conception: the PHM registers eligible couples and gives pre-pregnancy care, so A is false. Family planning is one of the integrated package components alongside antenatal and postnatal care, and the lectures do not rank it lower, so B is false. Postnatal home visits are part of the package, so C is false. The PHM's home-based domiciliary care makes D true. E is false because the MOH, PHNS, SPHM and PHI are also field staff.", "source": "Reproductive Health Concepts_Batch33 (National Family Health Programme; Care for eligible couples; organizational structure slide). 02-ANC and PNC revised (pre pregnancy care, domiciliary care, post partum care at field).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "RHC", "atName": "Reproductive health concepts", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 64, "batch": "B26 Q11", "file": "B26", "paperNo": 11, "topic": "Protecting insecticide sprayers", "type": "SBA", "theme": 6, "stem": "A method of preventing agricultural workers being exposed to spraying of insecticides while spraying…", "options": {"A": "Store in protective places", "B": "Restrict selling of insecticides to adults", "C": "Encourage the farmers to use personal protective equipment", "D": "Used insecticide bottles should not be allowed to dispose to nearby water sources", "E": "Advising agricultural workers to wash thoroughly with themselves after a spraying session"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The question asks about protecting the worker during spraying, and the lecture lists gloves, goggles, overalls and boots as the protection worn by the worker. A, B and D are about storage, sale and disposal and do not protect the sprayer, and E is decontamination after spraying, not protection during it (E's \"with themselves\" is a wording slip for \"themselves\"). PPE is the last line of defence in the hierarchy, but it is the only option here that applies while spraying.", "source": "Occupational Diseases lecture, \"Personal protective equipment\" and \"Administrative control\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 65, "batch": "B26 Q12", "file": "B26", "paperNo": 12, "topic": "Last-resort occupational control", "type": "SBA", "theme": 6, "stem": "Last strategy of promoting occupational health when other methods cannot be implemented…", "options": {"A": "Substitute and Redesign", "B": "Use of personal protective devices", "C": "Enclosure of process", "D": "Removal of contaminant at source", "E": "Ventilation"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture calls PPE the \"last line of defence\", used when the hazard cannot be fully removed and the worker remains at some risk. A, C, D and E (substitution, redesign, isolation or enclosure, source removal, ventilation) all act on the hazard or the environment and sit higher in the hierarchy of control.", "source": "Occupational Diseases lecture, \"Controlling hazards; hierarchy of control\" and \"Personal protective equipment\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 66, "batch": "B26 Q13", "file": "B26", "paperNo": 13, "topic": "Maternity benefits", "type": "SBA", "theme": 6, "stem": "Regarding the maternity benefits in postnatal period…", "options": {"A": "Half-pay leave for 168 days from delivery excluding public holidays, Saturdays, and Sundays", "B": "No-pay leave for 252 days from delivery excluding public holidays, Saturdays, and Sundays", "C": "Half-pay leave for 252 days from delivery excluding public holidays, Saturdays, and Sundays", "D": "Full-pay leave for 84 days from delivery excluding public holidays, Saturdays, and Sundays", "E": "1.5 hours leave during working hours (either in the morning or afternoon) until the baby is 12 months of age"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The infant feeding lecture gives 84 working days of full-pay maternity leave, followed by a further 84 days at half pay and 84 days at no pay in the public sector, so D is correct. A, B and C give wrong lengths or pay levels for the second and third blocks. E is wrong because the lecture gives 1 hour for six months for breastfeeding mothers, not 1.5 hours until 12 months.", "source": "09-infant feeding lecture, \"Workplace and Employment Maternity Benefits\" slide (slide 30). This is not one of the four listed occupational files, and the legislation lectures could not be read.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccLaw", "atName": "Occupational safety and health legislation", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 67, "batch": "B26 Q14", "file": "B26", "paperNo": 14, "topic": "Staff linked to school health", "type": "SBA", "theme": 5, "stem": "Among the following staff, who is the most attached to the office of MOH who contributes more to the school health programme?", "options": {"A": "Medical Officer of Health", "B": "Public Health Inspector", "C": "Public Health Midwife", "D": "Public Health Nursing Sister", "E": "Supervising Public Health Midwife"}, "answer": "B", "prov": null, "cannot": false, "explanation": "Both lectures state that the PHI is the person responsible at grass root level for the school health programme (appointed in 1985). The PHI does the school sanitary survey, pre-SMI screening, follow-up visits at 1 and 3 months and canteen supervision. The MOH leads and conducts the inspection but is the head of the office, not the staff member doing most of the work. The PHM and PHNS only help, for example with vaccination.", "source": "10 School Health Program Sri Lanka (Dr Gunathilake), History slide and SMI slides; 10 School Health Programme final (Dr Pannala), History and Evaluation slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "SchHlth", "atName": "School health programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 68, "batch": "B26 Q15", "file": "B26", "paperNo": 15, "topic": "National breastfeeding recommendation", "type": "SBA", "theme": 4, "stem": "What is the best statement of breastfeeding recommended in Sri Lanka?", "options": {"A": "Start breastfeeding within 1 hour of delivery, Exclusive breastfeeding for 4 months, Continue for 2 years", "B": "Start breastfeeding within 1 hour of delivery, Exclusive breastfeeding for 4 months, Continue breastfeeding for 2 years", "C": "Start breastfeeding within 1 hour of delivery, Exclusive breastfeeding for 6 months, Continue breastfeeding for 2 years", "D": "Start breastfeeding within 2 hours of delivery, Exclusive breastfeeding for 6 months, Continue for 1 year", "E": "Start breastfeeding within 2 hours of delivery, Exclusive breastfeeding for 6 months, Continue for 2 years"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The National Policy is to start breastfeeding within one hour of birth. Babies are then exclusively breastfed for the complete 6 months (180 days), and breastfeeding continues with adequate complementary feeding up to 2 years or beyond. A and B fail on 4 months, D and E on 2 hours, and D also on 1 year. A and B differ only by the word \"breastfeeding\" in the last phrase, so they are effectively the same wrong option.", "source": "Breast Feeding lecture batch 35 (National Policy slide); 09-infant feeding (National Policy on Breastfeeding slide); infant feeding - commed (National Policy).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "InfFeed", "atName": "Infant feeding practice", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 69, "batch": "B26 Q16", "file": "B26", "paperNo": 16, "topic": "Least effective activity for 4-year-old's mental health", "type": "SBA", "theme": 5, "stem": "In a 4 years old child who lives in, out of the following activities, what is the least effective in improving mental health?", "options": {"A": "Chanting prayers / Gatha with family at evening religious observances", "B": "Going birdwatching with grandfather", "C": "Engaging in simulative play in a child play house with grandmother", "D": "Engaging in home gardening activities with mother every evening", "E": "Father watching cartoons in TV with him and father explains the contents of it"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The ECD lecture promotes time with a responsive, stimulating adult, play, and everyday routines turned into playful learning, which fits C and D. Nature (B) fits aesthetic appreciation in the mental health lecture. In E the father explains the content, which is the interactive use of screens the ECD lecture says matters more than screen time itself. A is a passive, repetitive ritual with no play, exploration or responsive exchange, so it matches the lecture's elements least. \"Simulative\" in C is a typo for \"stimulative\".", "source": "13 Early Childhood Development Batch 34, slides 11 to 18 and 24 to 26; 11-Mental Health Promotion batch32, Elements of mental well-being and Parenting slides.", "confidence": "CHECK on A. Family religious practice is not discussed in the lectures, and the lecture's warning about screen time could make E the intended answer. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "MHChild", "atName": "Mental health promotion in childhood", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 70, "batch": "B26 Q17", "file": "B26", "paperNo": 17, "topic": "Field antenatal service components", "type": "SBA", "theme": 1, "stem": "Which of the following services is not a component of field antenatal health services?", "options": {"A": "Assessing risk level of pregnancy", "B": "Provide nutritional advices", "C": "පෝෂණ මල්ල", "D": "Family planning", "E": "Fetal growth monitoring"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The antenatal lectures list home risk assessment (A), nutrition education and supplementation (B), family planning counselling (D) and fundal height and kick count monitoring (E) as parts of antenatal care. C is Sinhala for \"nutrition bag\" (standard knowledge); it appears in the lectures only as a nutrition package listed among interventions to reduce low birth weight, not as an antenatal clinic or home-visit component. It is therefore the best fit for \"not a component\".", "source": "02-ANC and PNC revised (risk assessment, home visits, supplementation, kick count, counselling on family planning); 02 Antenatal and Postnatal Care (Prof Anuradhini) (risk assessment, supplementation). Nutrition intervention lecture (low birth weight interventions slide) lists \"Nutrition Package for pregnant women\".", "confidence": "CHECK on C. The nutrition lecture names the nutrition package as a maternal intervention, so the ANC lectures and the nutrition lecture could be read differently. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "note": "Option C is printed in Sinhala: “nutrition bag”.", "scored": true}, {"id": 71, "batch": "B26 Q18", "file": "B26", "paperNo": 18, "topic": "\"Delay in seeking\" scenario", "type": "SBA", "theme": 2, "stem": "Which of the following scenario depicts the “delay in seeking” relation pregnancy mother is dead due to cardiac related disease at 39 weeks of period of gestation?", "options": {"A": "Medical Officer of Health missing the heart defect at Antenatal clinic", "B": "Public Health Midwife did not report her heart disease", "C": "Mother not attending to the antenatal clinic monthly as requested because being followed up by the consultant obstetrician at the base hospital", "D": "Pregnant mother not admitting to the hospital at the completion of 37 weeks as requested", "E": "Medical officer in charge of Labour room not attending to birth at the 2nd stage of labour"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The delay in seeking care is a delay on the part of the woman or family in deciding to seek help, which is the first delay in the three-delay model. In D the mother herself did not come in when advised. A, B and E are failures by health staff, which belong to the delay in receiving adequate care. In C she was already under specialist follow-up, so she was not avoiding care. This is consistent with Q28, where the first delay was the decision not to go to hospital.", "source": "08 Maternal Mortality, \"Maternal Death Investigation\" slide (three-delay model: seeking, reaching, treating). The definitions of each delay are standard knowledge.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": true, "scored": true}, {"id": 72, "batch": "B26 Q19", "file": "B26", "paperNo": 19, "topic": "Postnatal care setting and neonatal deaths", "type": "SBA", "theme": 1, "stem": "Which of the following settings provide postnatal care services, which is the most important in relation to preventing neonatal deaths?", "options": {"A": "Office of Medial Officer of Health", "B": "Post natal care centre", "C": "Teaching hospital", "D": "Home of the neonate"}, "answer": "D", "prov": null, "cannot": false, "explanation": "After hospital discharge the PHM's home visits assess the baby for infection, jaundice, feeding and growth, and also reach mothers who do not attend clinics. That early one-to-one contact is the main route to catching neonatal danger signs. The MOH office, clinic and hospital see only those who attend or are admitted. The stem has a typo (\"Medial\") and only four options.", "source": "02-ANC and PNC revised (Domiciliary care; Post partum care at field, assess baby).", "confidence": "CHECK on D. The lectures do not say which setting matters most, and they also stress close monitoring in hospital in the immediate postnatal period. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 73, "batch": "B26 Q20", "file": "B26", "paperNo": 20, "topic": "Contraception, 32-year-old family complete", "type": "SBA", "theme": 2, "stem": "A 32 years old married woman visits field family planning clinic. She is healthy and is currently using a natural family planning method. She has 2 children at home and youngest is 4 years of age. Upon enquiry, she says that she has no intention to have another child. The most appropriate contraception method the MOH can recommend to her is?", "options": {"A": "Continue same natural family planning method", "B": "Permanent sterilisation", "C": "Intrauterine contraceptive device", "D": "Oral contraceptive pills", "E": "Condoms"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture's sterilisation eligibility rule is over 26 years, at least 2 living children, and the younger child over 2 years. She meets all three and wants no more children, so a permanent method is most appropriate. Natural methods (A) have high failure rates and the other temporary methods are less suitable for a woman whose family is complete. The method is chosen after counselling, so the MOH recommends it and does not impose it.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Eligibility for Sterilization\" slide (General Circular No. 1586).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 74, "batch": "B26 Q21", "file": "B26", "paperNo": 21, "topic": "17-year-old married woman, PHM registration", "type": "SBA", "theme": 5, "stem": "A 17 years old married woman visits PHM to get registered in the Eligible couple register. The most appropriate step to be taken by the PHM is…", "options": {"A": "Referring her to the newly married couple clinic", "B": "Requesting to come with an adult", "C": "Provide family planning counselling", "D": "Assessing her nutritional status", "E": "Checking the legal aspect of her marriage"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The ANC and PNC lecture defines an eligible family as a couple in union with a female aged 15 to 49, so she qualifies for registration without conditions. The PHM's role is then to give the services the register exists for, and family planning counselling comes first because it covers spacing and delaying a first pregnancy in a young bride. Asking her to bring an adult (B) or checking the legality of the marriage (E) is not the PHM's task and would delay registration. Nutritional assessment (D) is relevant but is not the first step.", "source": "02-ANC and PNC revised, \"What is an Eligible family?\" slide; 05-Adolescent health narrated, \"Ethics and adolescent health\" slide. Choice of first step: standard knowledge.", "confidence": "CHECK on C. The lectures confirm eligibility for registration but do not say what the first step is. Best answer is C. D is the nearest alternative.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": ["FP"], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 75, "batch": "B26 Q22", "file": "B26", "paperNo": 22, "topic": "Disease not screened in WWC", "type": "SBA", "theme": 1, "stem": "Screening for several diseases takes place in Well Woman Clinics. A disease not screened for in WWCs is…", "options": {"A": "Breast cancer", "B": "Cervical cancer", "C": "Diabetes mellitus", "D": "Endometrial cancer", "E": "Hypertension"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The WWC screens for hypertension, diabetes, breast abnormalities, cervical abnormalities (Pap smear or HPV testing), BMI and thyroid abnormalities. It also covers family planning status, menstrual disorders, reproductive tract infections and menopausal problems. Endometrial cancer is not on this list, so D is the one not screened.", "source": "14 WELL WOMAN CLINIC PROGRAMME Recorded (services provided slides); 14 WWC (WWC Services slide).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "WWC", "atName": "Well Woman Clinic programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 76, "batch": "B26 Q23", "file": "B26", "paperNo": 23, "topic": "AFP surveillance", "type": "SBA", "theme": 8, "stem": "What is true regarding acute flaccid paralysis (AFP) surveillance?", "options": {"A": "AFP patients admitted to the hospital during the week should be reported to the Epidemiology Unit", "B": "Director / Healthcare superintendent in the hospital is responsible for AFP surveillance activities", "C": "Two stool samples should be taken at the 10th day from the onset of AFP", "D": "Infection control Nursing officer should complete the form 1 of AFP surveillance (pink form) and send it to the Epidemiology Unit", "E": "AFP patients are referred to the Regional Epidemiologist using the routine disease notification system"}, "answer": "E", "prov": null, "cannot": false, "explanation": "AFP in a child is a suspected polio case and is reported immediately on suspicion, so A (reported during the week) is wrong. Two stool samples are taken 24 to 48 hours apart within 14 days of onset, so C (10th day) is wrong. D is doubtful because the case form is normally completed by the treating doctor. AFP is a notifiable disease, so reporting through the routine notification system to the Regional Epidemiologist is the best remaining statement (standard knowledge).", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on B. No lecture covers AFP surveillance, and B (who is responsible in the hospital) versus E is a close call. Best answer is E.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 77, "batch": "B26 Q24", "file": "B26", "paperNo": 24, "topic": "Total fertility rate definition (no options printed)", "type": "SBA", "theme": 3, "stem": "Total Fertility rate refers to…", "options": {}, "answer": null, "prov": null, "cannot": true, "explanation": "I need the five printed options (or a clearer scan of that page) to pick a letter. From the lecture, the right option would say the number of children a woman in a hypothetical cohort will bear over her lifetime if she bore children at the age-specific fertility rates and none of the females died in the reproductive years. This is the same idea as Q45, where option B is the matching wording. Working from the lecture: TFR = 5 × the sum of the ASFRs per woman, 2.16 in the 2012 example.", "source": "06-Measures of Fertility, Total Fertility Rate slide.", "confidence": "CHECK on all. The options are missing. Best answer is the option that matches the lecture definition above.", "check": true, "checkLetters": ["A", "B", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": true, "evidence": "lecture", "accepted": false, "note": "The paper prints no options for this question, only a definition line.", "defn": "Total fertility rate is the number of children a woman in a hypothetical cohort would bear during her lifetime if she bore children at the age-specific fertility rates and none of the females died during the reproductive years.", "scored": false}, {"id": 78, "batch": "B26 Q25", "file": "B26", "paperNo": 25, "topic": "Best indicator of community health", "type": "SBA", "theme": 3, "stem": "Which of the following is the best indicator of assessing the quality of health of a community?", "options": {"A": "Infant mortality rate", "B": "Crude death rate", "C": "Proportional mortality rate", "D": "Life expectancy at birth", "E": "Crude birth rate"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lectures do not rank health indicators. They list life expectancy among the uses of mortality data, say the crude death rate depends on age-sex structure, describe proportionate mortality as a measure of the burden of disease, and treat CBR as a fertility measure. Life expectancy at birth summarises mortality across all ages, so it is the best overall indicator (standard knowledge). A is the main alternative: infant mortality is a sensitive marker but reflects only the first year of life.", "source": "07-Measures of Mortality, Uses of mortality data, Crude Death Rate and Proportionate Mortality Rate slides.", "confidence": "CHECK on A. No lecture names the best indicator, and infant mortality is also widely cited. Best answer is D.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 79, "batch": "B27 Q1", "file": "B27", "paperNo": 1, "topic": "Occupational health services", "type": "MTF", "theme": 6, "stem": "Occupational health services include…", "options": {"A": "Surveillance of home environment of the worker", "B": "Control and Prevention of hazards at work", "C": "Surveillance of sanitary, catering, and welfare service in the workplace", "D": "Provision of general health care services to worker", "E": "Environmental control outside the workplace"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture's occupational health services slides list controlling hazards in the work environment, supervision of sanitary and welfare facilities (including suitable meals), treatment services for employees, and prevention of environmental pollution outside the workplace from its waste, so B, C, D and E are True. A is False because the services cover the workplace, and the home appears in the lecture only as \"domestic exposure\" within the occupational history.", "source": "Occupational Health-introduction lecture, \"Occupational Health Services\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 80, "batch": "B27 Q2", "file": "B27", "paperNo": 2, "topic": "Factories Ordinance scope", "type": "MTF", "theme": 6, "stem": "The Factories ordinance deals with…", "options": {"A": "Labour relationship", "B": "Factory registration", "C": "Employee Provident Fund (EPF)", "D": "Welfare of workers", "E": "Foreign employment"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The Factories Ordinance has parts on registration of factories, health, safety and welfare, notification of accidents and industrial diseases, and employment of women and young persons. Labour relations, the EPF and foreign employment are separate chapters of labour law in the lecture, so A, C and E are False.", "source": "Occupational safety & health legislature lectures (both files, read by OCR from the slide images), slide \"Factories Ordinance\" (Parts I to XV) and the chapter list.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccLaw", "atName": "Occupational safety and health legislation", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 81, "batch": "B27 Q3", "file": "B27", "paperNo": 3, "topic": "Substance use and control", "type": "MTF", "theme": 7, "stem": "Which of the following is / are true regarding the substance use and control?", "options": {"A": "Substance use can cause irreversible nerve and psychiatric damage even in single use", "B": "Delaying initiation of use is an evidence based measure of controlling substance use", "C": "Legalising cannabis for recreational use will tend to increase mortality due to its use", "D": "Heroine is the substance that currently causes most harm in Sri Lanka", "E": "Banning substances will reduce its use by reducing the access to the substance"}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Delaying the age of first use lowers the later risk of dependence, so B is True. Legalisation tends to raise use and use-related harm, so C is True. Single-use irreversible damage is not the general rule (A False). Alcohol and tobacco cause the most overall harm in Sri Lanka, not heroin (D False; \"Heroine\" is the paper's typo). Restricting access reduces use as a supply-reduction measure, so E is True.", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on C and E. There is no substance-use lecture, and the evidence on legalisation and on bans is debated. Best answer is True for both.", "check": true, "checkLetters": ["A", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "Subst", "atName": "Substance use", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 82, "batch": "B27 Q4", "file": "B27", "paperNo": 4, "topic": "Evaluation", "type": "MTF", "theme": 9, "stem": "True or False regarding evaluation…", "options": {"A": "It is an important component in programmed management cycle", "B": "Surveys and questionnaires can be used for data gathering", "C": "Qualitative data collection methods can be used", "D": "It is a continuous process as the outcomes of the project", "E": "Aim of evaluation is to improve and redesign the program"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Evaluation is a standard stage of the programme management cycle (\"programmed\" in A is a typo for \"programme\"), and it can use quantitative and qualitative methods (standard knowledge). Its aim is to improve, redesign and re-plan the programme, as in Q59 option D. Continuous follow-up is the feature of monitoring, whereas evaluation is periodic, so D is false.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on D. No lecture in project, and the wording of D is awkward. Best answer is False.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 83, "batch": "B27 Q5", "file": "B27", "paperNo": 5, "topic": "Health planning", "type": "MTF", "theme": 9, "stem": "True or False regarding health planning in management", "options": {"A": "Situation analysis includes both internal and external explorations", "B": "Problem analysis is done after determining the objective", "C": "Strategies are broad activity groups that would achieve the program objectives", "D": "Program objectives should be measured", "E": "Includes implementation and evaluation"}, "answer": {"A": true, "B": false, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Situation analysis looks at the internal and external situation, and problem analysis comes before the objectives are set (standard knowledge). Strategies are broad lines of action to reach the objectives. Objectives should be measurable (SMART), as in Q89, so D is taken as true even though \"measured\" is loosely worded. Planning is the stage before implementation and evaluation, which belong to the wider management cycle, so E is false.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on E. No lecture in project, and some textbooks draw the planning cycle to include implementation and evaluation. Best answer is False. D is also uncertain because of the wording.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 84, "batch": "B27 Q6", "file": "B27", "paperNo": 6, "topic": "Stakeholders of a health promotion programme", "type": "MTF", "theme": 9, "stem": "Stakeholder(s) of a health promotion programme conducted in a faculty of medicine is / are…", "options": {"A": "Dean", "B": "Academic staff", "C": "Students", "D": "Cleaning staff", "E": "Community leaders of the neighbourhood"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Stakeholders are the people who are affected by, involved in or able to influence the programme (standard knowledge). The dean, academic staff, students and cleaning staff all work or study inside the faculty, so they are stakeholders. Neighbourhood community leaders are outside the faculty and are not directly affected by a programme run within it.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on E. No lecture in project, and a broad definition could include the neighbourhood, so D is also arguable. Best answer is False for E and True for D.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 85, "batch": "B27 Q7", "file": "B27", "paperNo": 7, "topic": "Intimate partner violence", "type": "MTF", "theme": 5, "stem": "Which of the following is / are true / false regarding the intimate partner violence?", "options": {"A": "Females are commonly affected by the intimate partner violence", "B": "Alcohol is a determinant", "C": "Marital rape is not common", "D": "Negligence is not considered as a violence legally", "E": "Government legal systems only deals with marital relationships"}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture says most GBV victims are women and girls, and reports lifetime physical and/or sexual intimate partner violence of 20.4% in Sri Lanka, so A is true and sexual violence by partners (C) cannot be called uncommon. It counts economic harm, including failing economic responsibilities such as alimony, as violence, which goes against D. The lecture does not cover alcohol or the scope of the law, so B (alcohol is a recognised determinant) and E (the law is not limited to marriage) are standard knowledge.", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne), Overview, \"What is GBV?\" and Prevalence slides. Options B and E: standard knowledge.", "confidence": "CHECK on B. The lecture does not list alcohol. Best answer is True. CHECK on C. The lecture gives combined physical/sexual prevalence but does not mention marital rape specifically. Best answer is False. CHECK on D. \"Legally\" is not covered in the lecture, which only treats economic neglect as harm. Best answer is False. CHECK on E. The scope of the law is not in the lecture. Best answer is False.", "check": true, "checkLetters": ["B", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 86, "batch": "B27 Q8", "file": "B27", "paperNo": 8, "topic": "Fertility terms matching", "type": "MTF", "theme": 3, "stem": "Which of the following pair(s) is / are correctly matched?", "options": {"A": "Fertility - Number of live births", "B": "Parity - Number of children", "C": "Gravidity - Number of pregnancies that produce a live birth", "D": "Total fertility rate - Number of live births per year", "E": "Fecundity - The ability to produce an abundance of offspring"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "A: the fertility lecture defines fertility as the actual birth performance (the actual output of reproduction) of a group of women, which live births count, so the match is acceptable though loose. B and C are standard knowledge, because no lecture defines parity or gravidity. Gravidity is the total number of pregnancies whatever the outcome, so C is wrong. Parity counts births after viability, not children (twins are one birth), so B is wrong as worded. D: TFR is the children a woman would bear in her lifetime at the age-specific rates (2.16 in the lecture example), while births per year per 1000 women of child-bearing age is the GFR. E: the lecture defines fecundity as the physiological capacity to reproduce (the potential number of children), and \"abundance\" overstates that (the printed \"offspring\" also lost its \"ff\" ligature).", "source": "06-Measures of Fertility, \"What is fertility?\", General Fertility Rate and Total Fertility Rate slides. Parity and gravidity: standard knowledge.", "confidence": "CHECK on A, B and E. A and E: loose wording against the lecture definitions. B: parity is not defined in any lecture. Best answer is A True, B False, E True.", "check": true, "checkLetters": ["A", "B", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 87, "batch": "B27 Q9", "file": "B27", "paperNo": 9, "topic": "Sustainable development goals", "type": "MTF", "theme": 7, "stem": "Which of the following is / are true regarding sustainable developmental goals (SDG)?", "options": {"A": "There are twenty (20) SDGs", "B": "It is to be achieved by 2030", "C": "They were established after Millennium developmental goals (MDGs)", "D": "Sri Lanka has failed achieving SDGs by 2019", "E": "Alleviation of poverty is an SDG"}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture describes 17 goals with 169 targets running through 2030, agreed in September 2015 to build on the 8 MDGs of 2000 to 2015 (A False, B True, C True). Goal 1 is ending poverty (E True). D is False because the target date is 2030, so nothing can have \"failed\" by 2019, and the lecture gives no Sri Lanka SDG status (\"developmental\" is the paper's wording).", "source": "Sustainable Development Goals lecture, \"The SDGs are…\", \"MDGs\", \"Transitioning from MDGs to SDGs\" and the Goal 1 slides.", "confidence": "CHECK on D. The lecture is silent on Sri Lanka's SDG status. Best answer is False.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "SDG", "atName": "Sustainable development goals", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 88, "batch": "B27 Q10", "file": "B27", "paperNo": 10, "topic": "Measures of mortality", "type": "MTF", "theme": 3, "stem": "Regarding measures of mortality…", "options": {"A": "Standardisation allows the comparison of mortality rates between populations", "B": "Crude death rate is an unstandardised measure of mortality", "C": "Developed countries have low crude death rate", "D": "Abortions before 22 weeks are not included in numerator of perinatal mortality rate", "E": "To calculate perinatal mortality ratio, live births and still births are used in the denominator"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The mortality lecture lists crude, specific and adjusted rates, and says the crude death rate (deaths in a year ÷ mid-year population × 1000) depends on age-sex structure and cannot be compared between countries. So B is true, and A is true because adjusted (standardised) rates remove that structure effect. C is false because ageing populations can give developed countries a high crude rate, the same point as Q11 and Q33. D: the lecture says the perinatal period starts at 22 completed weeks, and perinatal deaths are stillbirths plus first-week deaths, so earlier abortions are excluded. E: the lecture gives no perinatal denominator (standard knowledge: WHO uses live births plus stillbirths).", "source": "07-Measures of Mortality, Mortality Rates, Crude Death Rate and Perinatal Deaths slides.", "confidence": "CHECK on A, C and E. A: standardisation is not explained in the lecture. C: the lecture's stage model suggests low death rates with development. E: the denominator is not in the lecture, and some local usage may differ. Best answer is A True, C False, E True.", "check": true, "checkLetters": ["A", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 89, "batch": "B27 Q11", "file": "B27", "paperNo": 11, "topic": "SMART objectives", "type": "SBA", "theme": 9, "stem": "A group of medical students are planning a health promotion program in a school. One of the objectives was “To improve knowledge on healthy food habits among the students by the end of the program”. Which of the qualities of SMART objectives does this objective lack?", "options": {"A": "Specificity", "B": "Measurability", "C": "Achievability", "D": "Realistic", "E": "Time bound"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The objective already has a time frame (\"by the end of the program\"), so E is not the gap. \"Improve knowledge\" gives no measurable target, such as the percentage of students answering correctly. Specificity is also weak, but measurability is the clearest missing quality.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on B. No lecture in project, and A (specificity) is also arguable. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 90, "batch": "B27 Q12", "file": "B27", "paperNo": 12, "topic": "Monitoring", "type": "SBA", "theme": 9, "stem": "A group of medical students started a health promotion club in their village. They read their minute after every meeting to assess their progress. What is the assessment method?", "options": {"A": "Situation analysis", "B": "Implementation", "C": "Supervision", "D": "Monitoring", "E": "Evaluation"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Reviewing progress at regular intervals while the activity is running is monitoring, which is continuous and used to correct deviations (standard knowledge, consistent with Q59). Evaluation is a periodic judgement of whether objectives were met, and situation analysis comes before the programme starts. Supervision means oversight of staff by a senior, not self-review of minutes (\"minute\" is a typo for \"minutes\").", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on D. No lecture in project, but the scenario fits the standard definition of monitoring. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 91, "batch": "B27 Q13", "file": "B27", "paperNo": 13, "topic": "SWOT analysis", "type": "SBA", "theme": 9, "stem": "According to SWOT analysis, which of the following is the strength to conduct the health promotion program in faculty of medicine?", "options": {"A": "Availability of external sponsors", "B": "Medical students", "C": "Dean", "D": "Resourced party of neighbourhood", "E": "Academic staff"}, "answer": "B", "prov": null, "cannot": false, "explanation": "In SWOT, strengths and weaknesses are internal factors, while opportunities and threats are external (standard knowledge). Sponsors (A) and the neighbourhood (D) are external, so they are opportunities. Medical students, the Dean and academic staff are all internal, and the students are the main human resource and implementers, so B is the best choice.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on B. No lecture in project, and C and E are also internal strengths. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 92, "batch": "B27 Q14", "file": "B27", "paperNo": 14, "topic": "Best description of GBV", "type": "SBA", "theme": 5, "stem": "Which of the following is the best description on gender based violence?", "options": {"A": "It is a violent act which forcing against a woman because she is a woman", "B": "It is a violent act where the victim is a woman and the perpetrator is a man", "C": "It is caused by the husband or the partner of the woman", "D": "It causes a grievous injury to the woman", "E": "It is a sexual violent act where the victim is a woman"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture defines GBV as violence directed against a person because of their gender, notes that \"violence against women\" is a similar term, and says most victims are women and girls. Option A captures the gender-based motive, while B, C, D and E each limit GBV to one perpetrator, one relationship, one severity or one type of act. The lecture lists physical, sexual, psychological and economic harm, so none of those narrower options is a general description.", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne)
