ide... first instance she will be advised on family planning methods by PHM?", "options": {"A": "Eligible couple registration", "B": "At the family planning clinic for newly married couples", "C": "At the booking visit", "D": "Antenatal family planning clinic conducted in MOH", "E": "In the postnatal ward"}, "answer": null, "prov": "A", "cannot": true, "explanation": "The lecture says field FP services begin with recruitment of eligible couples, followed by service provision, and the PHM supplies condoms and COCP. The PHM's first contact with a new bride is the home registration, so the first FP advice by the PHM fits there. B is a clinic run by MO-level staff. C, D and E are during pregnancy or after delivery.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Family Planning (FP) Services in Sri Lanka\" slide and \"Eligible Family\" slides.", "confidence": "CHECK on all options. The stem is incomplete. Provisional best answer is A, and B is the main alternative.", "check": true, "checkLetters": ["A", "B", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": true, "evidence": "lecture", "accepted": false, "scored": false}, {"id": 192, "batch": "B32 Q14", "file": "B32", "paperNo": 14, "topic": "Contraceptive choice (stem cut)", "type": "SBA", "theme": 2, "stem": "She was advised not to be pregnant... most suitable contraceptive method?", "options": {"A": "Condoms", "B": "Female sterilization", "C": "Intrauterine contraceptive devices", "D": "Depo Provera", "E": "Combined oral contraceptive pills"}, "answer": null, "prov": "C", "cannot": true, "explanation": "Without the scenario, a highly effective, long-acting, non-hormonal method fits best. Sterilisation (B) would not meet the national eligibility rules for a young woman with few children. The pill (E) and DMPA (D) depend on a medical condition we cannot see, and condoms (A) are less reliable. This is a guess from the answer pattern, not a derived answer.", "source": "No lecture in project covers the missing scenario. Family Planning Services in Sri Lanka_Batch 34, \"Modern Family Planning Methods\" slide and sterilisation eligibility slide were used for the options.", "confidence": "CHECK on all options. Best answer is C (provisional).", "check": true, "checkLetters": ["A", "B", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": true, "evidence": "none", "accepted": false, "scored": false}, {"id": 193, "batch": "B32 Q15", "file": "B32", "paperNo": 15, "topic": "Compensation for injured mason", "type": "SBA", "theme": 6, "stem": "A mason fell from height at the construction and fractured his right lower limb. Who decides the amount of his compensation?", "options": {"A": "District factory inspecting engineer", "B": "Commissioner of workmen's compensation", "C": "Mason", "D": "Construction company", "E": "Medical officer of health"}, "answer": "B", "prov": null, "cannot": false, "explanation": "Under the Workmen's Compensation Ordinance the employer is liable to pay compensation, and the Commissioner for Workmen's Compensation receives claims, holds inquiries and settles them. The amount follows the Ordinance's schedules and is fixed at the Commissioner's inquiry. The factory inspecting engineer (A) handles accident notification and investigation, not compensation.", "source": "Occupational safety & health legislature lectures (both files, read by OCR from the slide images), slides \"Workmen's Compensation Ordinance\", \"Amount of compensation\" and \"Activities carried out by the Commissioner\".", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccLaw", "atName": "Occupational safety and health legislation", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 194, "batch": "B32 Q16", "file": "B32", "paperNo": 16, "topic": "Preventing occupational hearing loss", "type": "SBA", "theme": 6, "stem": "Which of the following is the most effective method to prevent occupational hearing loss among workers?", "options": {"A": "Promote workers on using earplugs and earmuffs", "B": "Regular audiometric measuring of workers for hearing loss", "C": "Engineering controls to reduce the noise of machinery", "D": "Educating the workers on hazards of hearing loss in workplace", "E": "Allowing the workers to work in rotations to mininize exposure to noise."}, "answer": "C", "prov": null, "cannot": false, "explanation": "The lecture says preventive methods built into the process, where the worker does not have to act, are the most effective, and it lists engineering control and shielding against noise. A is PPE, the last line of defence, and E is administrative (limiting exposure time), so both rank lower (E also has the typo \"mininize\"). B is screening, not prevention, and D is education, which the lecture lists only as an additional strategy.", "source": "Occupational Diseases lecture, \"Prevention of occupational diseases & injuries\", \"Isolation\", \"Engineering control\", \"Administrative control\", \"Personal protective equipment\" and \"Additional strategies\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 195, "batch": "B32 Q17", "file": "B32", "paperNo": 17, "topic": "Missed vaccines at one year", "type": "SBA", "theme": 9, "stem": "During regular field visits, a PHM identified a one-year-old child who had not received any vaccinations since the last vaccine at six months of age...", "options": {"A": "Administer MMR and JE during this clinic visit", "B": "Administer MMR in the next visit and JE after eight weeks", "C": "MMR on next clinic", "D": "MMR, then supplementary measles dose after 4 weeks", "E": "JE on next clinic"}, "answer": null, "prov": "A", "cannot": true, "explanation": "If the question is \"what should be done?\", the usual answer is A, because MMR and live attenuated JE are both due at 12 months in Sri Lanka and live vaccines can be given at the same visit at different sites (standard knowledge, consistent with Q144). A delay would only be right if the missing text shows the child is unwell or has a contraindication.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on A. The stem is cut off and no lecture covers it. Best answer is A (provisional).", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": true, "evidence": "none", "accepted": false, "scored": false}, {"id": 196, "batch": "B32 Q18", "file": "B32", "paperNo": 18, "topic": "Kite festival, leptospirosis", "type": "SBA", "theme": 8, "stem": "Kite Festival in a paddy field... What is the best advice to prevent a leptospirosis outbreak?", "options": {"A": "Ask the participants to avoid drinking water from the nearby stream", "B": "Ask participants to monitor urine output for the week after the event", "C": "Prescribe chloroquine from 1 week before the event for the participants", "D": "Prescribe doxycycline from 1 week before the event for the participants", "E": "Ask the participants to wear long sleeve clothes"}, "answer": "D", "prov": null, "cannot": false, "explanation": "For a short, defined high-risk exposure in water or mud, doxycycline chemoprophylaxis started about a week beforehand is the recommended prevention (standard knowledge). Chloroquine (C) is an antimalarial with no role in leptospirosis. Avoiding stream drinking water (A) or wearing long sleeves (E) does not address skin contact with contaminated paddy water, and monitoring urine output (B) detects illness rather than preventing it. The stem is cut off after \"paddy field...\", but the options make the question answerable.", "source": "No lecture in project. Answer is standard knowledge.", "confidence": "CHECK on E. Protective clothing helps somewhat but is weaker than chemoprophylaxis, and the missing part of the stem might change the setting. Best answer is D.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": true, "evidence": "none", "accepted": false, "scored": true}, {"id": 197, "batch": "B32 Q19", "file": "B32", "paperNo": 19, "topic": "Genital lesion in student", "type": "SBA", "theme": 9, "stem": "A state university student visits the University Medical Officer due to a genital lesion...", "options": {"A": "Inform the MOH", "B": "Grant one-month leave", "C": "Refer to STI clinic", "D": "Advise to inform sexual partners", "E": "Isolate in hostel room"}, "answer": null, "prov": "C", "cannot": true, "explanation": "If the question is \"what is the most appropriate action?\", the best answer is C, because a genital lesion needs diagnosis and treatment at an STD clinic (standard knowledge). STIs are not notified to the area MOH (A, as in Q32 option C), and leave or isolation (B, E) is not required. Advising partners (D) is done after diagnosis, with counselling from the STD clinic.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on C. The stem is cut off and no lecture covers it, and D is a possible alternative. Best answer is C (provisional).", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": true, "evidence": "none", "accepted": false, "scored": false}, {"id": 198, "batch": "B32 Q20", "file": "B32", "paperNo": 20, "topic": "Average number of daughters per woman", "type": "SBA", "theme": 3, "stem": "The average number of daughters a woman will have...", "options": {"A": "Total fertility rate", "B": "General fertility rate", "C": "Net reproductive rate", "D": "Gross reproductive rate", "E": "Replacement rate"}, "answer": null, "prov": "D", "cannot": true, "explanation": "The lecture defines GRR as the number of female children a woman will bear in her lifetime at the age-specific rates if none of the females die in the reproductive years (2.16 × 0.49 = 1.056 in the example). NRR is the GRR adjusted for the mortality of females who do not complete the reproductive years. The visible stem mentions no mortality adjustment, so D fits, and A and B are not about daughters only. If the full stem includes a mortality allowance, the answer would be C. E: the lecture term is replacement level fertility, not \"replacement rate\".", "source": "06-Measures of Fertility, Gross Reproduction Rate, Net Reproduction Rate and Replacement level fertility slides.", "confidence": "CHECK on C and D. The stem is truncated. Best answer is D.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": true, "evidence": "lecture", "accepted": false, "scored": false}, {"id": 199, "batch": "B32 Q21", "file": "B32", "paperNo": 21, "topic": "Snakebite fatality term", "type": "SBA", "theme": 3, "stem": "In 2023 280 deaths reported due to snakebite in Sri Lanka... correct term for this\nfatality rate?", "options": {"A": "Case fatality rate", "B": "Case specific fatality rate", "C": "Crude mortality rate", "D": "General mortality rate", "E": "Proportionate mortality rate"}, "answer": null, "prov": "A", "cannot": true, "explanation": "The mortality lecture defines case fatality rate as deaths due to a specific cause ÷ total persons who contracted the disease in the same interval × 100. Proportionate mortality is deaths from a cause ÷ deaths from all causes × 100, and the crude death rate is deaths ÷ mid-year population × 1000. The stem asks for a \"fatality rate\" for one cause, which matches A if the missing part gives the number of snakebite cases. B and D are not lecture terms. If the missing denominator is all deaths, the answer would be E.", "source": "07-Measures of Mortality, Case Fatality Rate, Proportionate Mortality Rate and Crude Death Rate slides.", "confidence": "CHECK on A. The stem is truncated. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": [], "incomplete": true, "evidence": "lecture", "accepted": false, "scored": false}, {"id": 200, "batch": "B32 Q22", "file": "B32", "paperNo": 22, "topic": "Prophylactic mastectomy, key factor", "type": "SBA", "theme": 7, "stem": "40-year-old woman... Oncosurgeon suggested prophylactic mastectomy. What is the most important factor?", "options": {"A": "Technology availability", "B": "Oncosurgical expertise", "C": "Effectiveness of chemotherapy", "D": "Patient preference", "E": "Facilities for investigations"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The stem is cut after \"40-year-old woman...\", but the question and options are intact. A prophylactic mastectomy is an elective, irreversible operation, and the EBM lecture puts patient values and preferences alongside the best evidence and clinical expertise, with patient-centred decision making as step 4. Technology, surgeon expertise and investigation facilities are enabling factors, and chemotherapy effectiveness is not relevant to a prophylactic operation.", "source": "EBM powerpoint (Core principles slide); EBM for medical students (Table 1, step 4 patient-centred decision making; EBM in Practice).", "confidence": "CHECK on D. The scenario details in the stem are missing from the paper. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "Cancer", "atName": "National cancer control programme", "atCat": "Special topics", "at2": ["EBM"], "incomplete": true, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 201, "batch": "B32 Q23", "file": "B32", "paperNo": 23, "topic": "Transition phase from birth and death rates", "type": "SBA", "theme": 3, "stem": "In a given population birth rate 6.7% and mortality rate 7.1%... epidemiological\ntransition phase?", "options": {"A": "High expanding", "B": "Low expanding", "C": "High stationary", "D": "Low stationary", "E": "Declining"}, "answer": "E", "prov": null, "cannot": false, "explanation": "Natural increase = birth rate − death rate = 6.7 − 7.1 = −0.4, so deaths exceed births and the population is shrinking. The lecture's Stage 5 (decline) is the stage with falling birth rates, low death rates and population shrinkage, and Stage 4 (low stationary) needs a steady population. \"Epidemiological\" in the stem should read \"demographic\". Read literally, 6.7% and 7.1% would be 67 and 71 per 1000, which is unrealistic, so I took the rates as per 1000. Same idea as Q18 and Q43, with different figures.", "source": "Demographic transition (Dr Nazneen Nazeer), Stage 4 and Stage 5 slides.", "confidence": "CHECK on E. The stem is truncated, the units are unclear, and the 0.4 gap is small enough that D (steady population) could be argued. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": true, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 202, "batch": "B32 Q24", "file": "B32", "paperNo": 24, "topic": "Notifying suspected dengue", "type": "SBA", "theme": 7, "stem": "A 34-year-old male presents to the outpatient department with fever, rash, and muscle aches. The attending doctor suspects dengue based on clinical findings and recent rise in local case numbers. The patient is admitted and managed accordingly, but the consultant delays notifying the case to the relevant authorities until laboratory confirmation is received. Which of the following statements regarding notifiable diseases is correct?", "options": {"A": "Suspected cases should be notified immediately without waiting for laboratory confirmation", "B": "Notification can be done by any registered medical practitioner, not just the consultant", "C": "There is no difference whether it is notified or not", "D": "Legal actions can be taken against the consultant for not notifying", "E": "Notification should be done after confirming the disease"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture describes notification as a Notification Card followed by PHI field investigation, with only confirmed cases entered in the infectious disease register, so notification comes first and confirmation after. By standard knowledge, notifiable diseases are notified on suspicion, so A is correct and E is wrong (consistent with Q139). B and D are also true in practice, but A addresses the actual fault in the scenario. C is plainly wrong.", "source": "HIS lecture, E-Surveillance slide (Notification Card, field investigation, infectious disease register). The \"notify on suspicion\" rule is standard knowledge.", "confidence": "CHECK on A. B and D are also defensible statements, and the lecture does not state the timing rule. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NHIS", "atName": "National health information system", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 203, "batch": "B32 Q25", "file": "B32", "paperNo": 25, "topic": "AFP, hospital prevention", "type": "SBA", "theme": 8, "stem": "3-year-old boy presented with vomiting and fever...suspected AFP. prevention inside hospital?", "options": {"A": "Adhere to universal health precautions by all ward staff", "B": "Ask all children and mothers to wear face masks in ward", "C": "Should isolate the patient immediately", "D": "Advise the mother about proper hand washing techniques", "E": "Notify the regional epidemiologist"}, "answer": "A", "prov": null, "cannot": false, "explanation": "Polio spreads by the faeco-oral route, so preventing spread inside the ward depends on standard (universal) precautions followed by all staff. Notifying the regional epidemiologist (E) is the surveillance step, as in Q165, not a prevention measure inside the hospital. Masks (B) address respiratory spread, and the full stem is missing, so isolation (C) and handwashing advice (D) cannot be ruled out.", "source": "No lecture in project. Answer is standard knowledge.", "confidence": "CHECK on C and D. The stem is cut off, and a full stem could favour isolation or handwashing advice. Best answer is A.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": true, "evidence": "none", "accepted": false, "scored": true}, {"id": 204, "batch": "B33 Q1", "file": "B33", "paperNo": 1, "topic": "SDG in health", "type": "MTF", "theme": 7, "stem": "Ture false regarding SDG in health improvement.", "options": {"A": "SDG -3 mainly focused on curative care and hospital based care.", "B": "SDG planned to achived by 2050.", "C": "SGD 3 requires addressing of social determinants of health.", "D": "SGD acy as a directive for the low income countries and high income countries to work together", "E": "Each SGD is assigned to a ministry in each country"}, "answer": {"A": false, "B": false, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture describes Goal 3 as a broad agenda (healthy lives and well-being at all ages, universal health coverage) that is influenced by many other goals (poverty, inequality, climate), so A is False and C is True. The target year is 2030, not 2050 (B False, consistent with Q87). The SDGs apply to every nation, with an all-country focus and integration (D True). The lecture never assigns each goal to one ministry, and says the goals are interconnected (E False). The paper's typos are \"Ture\", \"achived\", \"SGD\" and \"acy\".", "source": "Sustainable Development Goals lecture, \"What is new and different\", \"MDGs vs SDGs\", \"Health in SDGs\" slides.", "confidence": "CHECK on E. The lecture does not explicitly deny ministry-level assignment. Best answer is False.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "SDG", "atName": "Sustainable development goals", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 205, "batch": "B33 Q2", "file": "B33", "paperNo": 2, "topic": "International health regulations (IHR)", "type": "MTF", "theme": 8, "stem": "Regarding international health regulations (IHR)", "options": {"A": "It is a legally bound global health treaty", "B": "One of the main objectives is preventing global trade disruptions", "C": "Three diseasess with potential to cause pandemics are coverd", "D": "W.H.O is in charge of IHR", "E": "Non diseases that are threat to health are health are included"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The IHR (2005) are legally binding on states, and their aim is to limit international spread of disease with minimal interference with travel and trade, which is consistent with Q189 option B. They cover any event that could be a public health emergency of international concern (an all-hazards approach, including non-infectious threats), not just three diseases, so 3 is false and 5 is true. WHO administers the regulations and supports national focal points, so 4 is true. The options are numbered 1 to 5 in the paper, and statements 3 and 5 contain typos (\"diseasess\", \"coverd\", \"Non diseases ... are health are\").", "source": "No lecture in project. The lecture only defines PHEIC (slide \"History of COVID-19\"), so the rest is standard knowledge.", "confidence": "CHECK on 4 and 5. \"In charge of IHR\" is loosely worded (WHO administers, states implement), and statement 5 is garbled. Best answer is True for both.", "check": true, "checkLetters": ["A", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": ["DevPH"], "incomplete": false, "evidence": "none", "accepted": false, "note": "The paper numbers its options 1 to 5. They are shown here as A to E.", "scored": true}, {"id": 206, "batch": "B33 Q7", "file": "B33", "paperNo": 7, "topic": "Fertility indicators and population growth", "type": "MTF", "theme": 3, "stem": "Regarding fertility indicators and population growth, which of the following\nstatements are correct?", "options": {"A": "Crude birth rate is strongly influenced by the age–sex structure of the", "B": "A Net Reproduction Rate (NRR) of 1 indicates that each generation of women is", "C": "If a country has a Total Fertility Rate (TFR) below the replacement level of 2.1,", "D": "The Net Reproduction Rate (NRR) accurately estimates the long-term growth", "E": "The Total Fertility Rate (TFR) represents the fertility of a population"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "A: the fertility lecture says CBR uses the whole population and cannot compare populations because age-sex structures differ. B: NRR = 1 is replacement level, where women replace themselves with daughters, the precondition for stabilisation. C is wrong because a TFR under 2.1 does not make the population fall at once, since a young age structure keeps births above deaths for a while (standard knowledge). D: NRR is the GRR adjusted for female mortality, so it shows whether a generation grows or shrinks if rates stay constant, though \"accurately\" overstates it. E: TFR is built from age-specific rates for a hypothetical cohort, so unlike CBR it does not depend on the age structure.", "source": "06-Measures of Fertility, Crude Birth Rate, Total Fertility Rate, Net Reproduction Rate and Replacement level fertility slides. C: standard knowledge.", "confidence": "CHECK on C and D. C: the lectures do not discuss population momentum. D: \"accurately\" is an overstatement, and the lecture only links NRR = 1 to stabilisation. Best answer is C False, D True.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 207, "batch": "B33 Q8", "file": "B33", "paperNo": 8, "topic": "CBR, CDR and age-specific rates", "type": "MTF", "theme": 3, "stem": "T/F regarding following statements?", "options": {"A": "Crude birth rate is a good indicator for comparing health between 2 countries.", "B": "In sri lanka crude death rate will increase in future.", "C": "Health status in different countries can be compared using age specific crude", "D": "CDR in developed countries is generally lower than CDR in developing countries", "E": "Age specific death rate increase with increasing aged"}, "answer": {"A": false, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "This repeats Q11 and Q33 with small wording changes and a new option B, so I answered it separately and kept A, C, D and E the same. B: the Dr Nazeer slide describes a falling birth rate with annual deaths rising, and the Prof Kasturiratne lecture shows the elderly share rising, so the crude death rate is expected to rise as the population ages. That is consistent with Q11 option B (CBR will not rise). A is false because CBR cannot compare countries (age-sex structure), and D is false because ageing developed populations often have a higher CDR. C and E are the same as before (C with the \"age specific crude death rate\" wording problem).", "source": "06-Measures of Fertility, Crude Birth Rate slide; 07-Measures of Mortality, Crude Death Rate slide; Demographic transition (Dr Nazeer), \"Where is Sri Lanka today?\"; Demographic transition (Prof Kasturiratne), Sri Lanka slides.", "confidence": "CHECK on B, C, D and E. B: the slide gives rising deaths, not the rate itself. C, D and E: same reasons as Q11. Best answer is B True, C True, D False, E True.", "check": true, "checkLetters": ["A", "B", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": ["Fert"], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 208, "batch": "B33 Q13", "file": "B33", "paperNo": 13, "topic": "Weight-for-age falling in a 9-month-old", "type": "SBA", "theme": 4, "stem": "9 month old boy was presented to the polyclinic .\nHis weight for age chart was droping from green area to light green area for 6 months duration. He did not have any acute illness and all the immunizations were upto date. What is the best next step to be taken by the MOH ?", "options": {"A": "Reassuring the mother", "B": "Refer the child for a paediatrician", "C": "Assess the feeding", "D": "Diagnosed with chronic malnutrition and start treatments", "E": "Refer the mother to the next child welfare clinic"}, "answer": "C", "prov": null, "cannot": false, "explanation": "A fall in the weight-for-age curve, with inadequate or no weight gain between measurements, is growth faltering. The growth lecture says faltering within the light green zone carries a high risk of dropping into the orange zone, so it needs attention and should not be reassured away (A, E). With no acute illness, the usual cause is feeding, so the MOH should assess feeding, for example by 24-hour dietary recall, and counsel on IYCF. The guideline adds an extra meal and energy-dense foods. A paediatric referral (B) is not yet indicated, since the child is not underweight (below -2SD) or in the red zone. D is wrong because chronic malnutrition is judged on the height-for-age chart (stunting), not by a fall within the normal weight-for-age zones. The lecture also says to check the weight-for-height chart when there is no weight gain over 3 consecutive measurements.", "source": "Growth and Growth Charts lecture (growth faltering, interpreting weight-for-age, \"When to check weight for height chart\"); infant feeding - commed (interventions: 24-hour dietary recall); Guidelines on Infant and Young Child Feeding (sections 4 and 9).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "GMP", "atName": "Growth monitoring and promotion", "atCat": "Nutrition", "at2": ["FTT"], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 209, "batch": "B33 Q14", "file": "B33", "paperNo": 14, "topic": "16-year-old, school absenteeism", "type": "SBA", "theme": 5, "stem": "16 yr old yehan is brought by his mother to general practitioner because of having frequent arguments. Teachers complain his school absentisim despite leaving the home to arrive at school. He stays out and comes home late. What is the most correct regarding his development factors?", "options": {"A": "Immature prefrontal cortex", "B": "Personality disorder", "C": "ADHD", "D": "Lack of perantal supervision", "E": "Underlying dipressive disorder"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The question asks about developmental factors, and the adolescent lecture lists brain maturation (the frontal lobe/prefrontal cortex, which governs reasoning, decision making and self-discipline) as a main developmental process. The limbic system matures early while the frontal lobe matures later, so adolescents are naturally prone to risk taking such as skipping school and staying out late. B, C and E are diagnoses that the history does not support, and D is a contextual factor with no evidence in the stem. \"absentisim\", \"perantal\" and \"dipressive\" are typos in the printed options.", "source": "05-Adolescent health narrated, \"Adolescent Development\", \"Normal structure and function\" and \"Why do adolescents behave the way they do?\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 210, "batch": "B33 Q15", "file": "B33", "paperNo": 15, "topic": "Maternal death, MOH next step", "type": "SBA", "theme": 2, "stem": "A 25-year-old female in her first pregnancy presented with per vaginal bleeding at a period of amenorrhoea of 38 weeks. The woman died soon after delivery. The Medical Officer of Health (MOH) was informed. What is the next immediate step that the MOH should take?", "options": {"A": "Notify the MO MCH immediately and initiate maternal death notification", "B": "Arrange for a maternal death review and field investigation within the stipulated time", "C": "Ensure completion and submission of the maternal death notification form (H 677a) within 24 hours", "D": "Visit the hospital and conduct a preliminary inquiry into the circumstances of death", "E": "Inform the Family Health Bureau (FHB) through the established maternal death surveillance system"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture says notification of a maternal death is a legal obligation, and the review and field investigation follow it. So the first step on hearing of the death is to notify upward (the MO-MCH and the others in the chain). B is the next stage, after notification. D is not a defined step, and E and C describe parts of the reporting chain. The form number in C could not be checked.", "source": "08 Maternal Mortality, \"Maternal Death Investigation\" slides (notification, field and institutional review, process steps). The immediate-step order and the reporting chain are standard knowledge.", "confidence": "CHECK on E. The lecture does not set out the order of steps or the form numbers. E and A both describe notification. Best answer is A.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 211, "batch": "B33 Q16", "file": "B33", "paperNo": 16, "topic": "Falls in an elders' home", "type": "SBA", "theme": 7, "stem": "Mrs. Dayawathi, a 79 yr old lady living in an elders home, recently fell in the toilet and suffered a fracture of the femur. What is the most effective measurement the elders home can take to prevent such incidents from happening in the future.", "options": {"A": "Educate the elders about the possibility of falling", "B": "Increase lighting in the toilet", "C": "Annual eye examination for the elders", "D": "Provide calcium supplementation", "E": "Ensure the elders have a toilet chaperone"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture's slips-and-falls slide lists environmental measures such as clear walkways, dry floors, railings or bars, non-slip surfaces and proper lighting. Lighting is the only listed measure among the options, and it prevents falls for every resident without relying on their behaviour. Education (A) and yearly eye checks (C) act weakly or only indirectly, and calcium (D) reduces fracture risk but not falls. A chaperone (E) is not a lecture measure and is hard to sustain.", "source": "Prevention of Accidents lecture, Common household accidents: Slips and falls slide. The slide is written for children, but its measures apply generally.", "confidence": "CHECK on B. The slide is framed around children, and E could be argued as an effective option. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "Accid", "atName": "Prevention of accidents", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 212, "batch": "B33 Q17", "file": "B33", "paperNo": 17, "topic": "Request for bilateral tubal ligation", "type": "SBA", "theme": 2, "stem": "A 28-year-old married woman who has a 2-year-old child attends the family planning clinic with her husband. She states that she has completed her family and requests bilateral LRT. As the MOH, what is the most appropriate action?", "options": {"A": "Advise her husband to undergo vasectomy", "B": "Advise her to have another chid", "C": "Advise to use a long-term Contraceptive method such as IUCD", "D": "Advise her to use DMPA injection until 35 years and come back", "E": "Refer her to nearest hospital with gynecological facility"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The lecture's sterilisation rule for a woman over 26 needs at least 2 living children, with the younger over 2 years, or 3 or more children. She has one child, so she does not qualify for tubal ligation, and a vasectomy (A) falls under the same rule. Telling her to have another child (B) is wrong because family size is her choice. She still needs effective protection, so a long-term reversible method such as the IUCD is appropriate. DMPA (D) is limited to clinics with a doctor and resuscitation facilities, and E is a referral for a procedure she is not eligible for. The stem says \"LRT\" and \"chid\", and the options use \"C-\" style labels. This fits Q73, Q121 and Q168.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Eligibilit <script>
"use strict";

function save(){ try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){} }

/* ---- helpers ---- */
function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})) {
    const v = attrs[k]; if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}
const isRep = q => !!q.printedAlso;
const lcol = q => lc(q.theme);

/* ---- state ---- */
const S = { tab:'home', at:'all', lec:'all', type:'all', show:'all', q:'', i:0, picks:{}, revealed:{}, quiz:null };
const TABS = [['home','Home'],['practice','Practice'],['hot','Repeated'],['accepted','Accepted answers'],['verify','To verify'],['pdf','PDFs'],['notes','Notes']];
const tabsEl = document.getElementById('tabs');
function drawTabs(){ tabsEl.replaceChildren(...TABS.map(([k,l]) => el('button',{class:S.tab===k?'on':'',onclick:()=>go(k)}, l))); }
function go(t, keep){ S.tab = t; if(!keep){S.i = 0;} drawTabs(); render(); document.querySelector('nav').scrollIntoView({block:'start'}); }

/* ---- feedback bits ---- */
function confetti(){
  const box = el('div',{class:'confetti'});
  const cols = ['#f4d27a','#14b8a6','#e11d74','#6366f1','#f59e0b','#fff'];
  for (let i=0;i<46;i++){
    const p = el('i',{style:`left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-delay:${Math.random()*.5}s;animation-duration:${1.4+Math.random()*1.2}s`});
    box.append(p);
  }
  document.body.append(box); setTimeout(()=>box.remove(), 3200);
}
function toast(msg){ const t = el('div',{class:'toast'}, msg); document.body.append(t); setTimeout(()=>t.remove(), 2200); }
function countUp(node, to){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) { node.textContent = to; return; }
  const t0 = performance.now(), d = 900;
  (function f(t){ const k = Math.min(1,(t-t0)/d); node.textContent = Math.round(to*(1-Math.pow(1-k,3))); if(k<1) requestAnimationFrame(f); })(t0);
}

/* ---- scoring ---- */
const OL = q => Object.keys(q.options);
const live = q => !q.cannot && q.answer != null && OL(q).length > 0;
function score(q, p){
  if (q.type === 'SBA') return {got: p === q.answer ? 1 : 0, of: 1};
  let got = 0; for (const L of OL(q)) if (p && p[L] === q.answer[L]) got++;
  return {got, of: OL(q).length};
}
function complete(q){
  const p = S.picks[q.id]; if (!p || !live(q)) return false;
  return q.type === 'SBA' ? !!p : OL(q).every(L => p[L] !== undefined);
}
function reveal(q){
  S.revealed[q.id] = true;
  if (complete(q) && q.scored !== false) {
    const s = score(q, S.picks[q.id]);
    mem.done[q.id] = {got:s.got, of:s.of, ok:s.got===s.of}; save();

  render(true);
}
const ansText = q => !live(q) ? (q.prov ? 'Best guess '+q.prov+' (paper incomplete)' : 'Cannot be answered from the paper') : (q.type==='SBA' ? q.answer : OL(q).map(L => L+' '+(q.answer[L]?'True':'False')).join(' · '));

/* ---- question card ---- */
function questionCard(q){

    el('span',{class:'b lec'}, LEC[q.theme]),

    q.accepted ? el('span',{class:'b ok'},'✓ Accepted answer') : el('span',{class:'b chk'},'⚠ Check this one'),
    q.incomplete ? el('span',{class:'b tb'},'✂ Paper incomplete') : null,
    q.evidence==='none' ? el('span',{class:'b tb'},'No lecture · verify with senior') : (q.evidence==='part' ? el('span',{class:'b tb'},'Partly standard knowledge') : null),
    isRep(q) ? el('span',{class:'b rep'},'↻ Printed '+(1+q.printedAlso.length)+' times') : null);
  card.append(badges, el('div',{class:'topic'}, q.topic + ' · ' + q.atName), el('div',{class:'stem'}, q.stem));
  if (q.note) card.append(el('div',{class:'warnbox'}, el('b',{},'Note: '), q.note));
  if (!OL(q).length) card.append(el('div',{class:'hint'},'The paper prints no options for this question.'));
  for (const L of OL(q)) {
    const flagged = q.checkLetters.includes(L);
    if (q.type==='SBA') {
      let c = 'opt sba' + (p===L?' pick':'');
      if (rev) c = 'opt' + (L===(q.answer||q.prov) ? (live(q)?' good':' unans') : (p===L ? ' bad' : ''));
      card.append(el('div',{class:c,onclick:()=>{ if(!rev && live(q)){S.picks[q.id]=L;render(true);} }},
        el('div',{class:'l'},L),
        el('div',{class:'tx'}, q.options[L], rev&&flagged ? el('div',{},el('span',{class:'chkmark'},'⚠ check this option')) : null)));
    } else {
      const mine = p[L]; let c = 'opt';
      if (rev && live(q)) c += mine===undefined ? ' unans' : (mine===q.answer[L] ? ' good' : ' bad');
      const tf = el('div',{class:'tf'},
        ['True','False'].map(v => el('button',{class:mine===(v==='True')?'sel':'',disabled:rev,
          onclick:()=>{ S.picks[q.id]=Object.assign({},p,{[L]:v==='True'}); render(true); }}, v)));
      if (rev && live(q)) { tf.append(el('span',{class:'key',style:`color:${q.answer[L]?'var(--ok)':'var(--bad)'}`}, 'Answer: '+(q.answer[L]?'True':'False')));
        if (flagged) tf.append(el('span',{class:'chkmark'},'⚠ check')); }
      card.append(el('div',{class:c}, el('div',{class:'l'},L), el('div',{class:'tx'}, q.options[L], tf)));
    }
  }
  const row = el('div',{class:'btnrow'});
  if (!rev) row.append(el('button',{class:'btn pri',onclick:()=>reveal(q)}, complete(q) ? 'Check my answer' : 'Show answer'));
  else row.append(el('button',{class:'btn',onclick:()=>{delete S.picks[q.id];delete S.revealed[q.id];render(true);}}, '↺ Try again'));
  row.append(el('button',{class:'btn',onclick:()=>{ mem.flag[q.id]?delete mem.flag[q.id]:mem.flag[q.id]=1; save(); render(true);}}, mem.flag[q.id]?'⚑ Flagged':'⚐ Flag'));
  card.append(row);
  if (rev) {
    const fin = el('div',{class:'final'});
    if (complete(q) && q.scored!==false) { const s = score(q,S.picks[q.id]);
      fin.append(el('div',{class:'verdict',style:`color:var(${s.got===s.of?'--ok':'--bad'})`}, q.type==='SBA'?(s.got?'✓ Correct':'✗ Not quite'):`Your score: ${s.got} / ${s.of}`)); }
    fin.append(el('div',{class:'verdict'}, 'Answer: '+ansText(q)));
    if (q.defn) fin.append(el('div',{class:'warnbox'}, el('b',{},'Definition: '), q.defn));
    if (q.incomplete) fin.append(el('div',{class:'warnbox'}, 'The paper printed this question incomplete (cut-off stem, missing option, figure or table). The answer above is our best reading of what is visible, not a firm key.'));
    const x = el('div',{class:'exp'}, el('h4',{},'Why'), el('p',{}, q.explanation),
      el('h4',{},'Source'), el('p',{}, q.source), el('h4',{},'How sure are we?'), el('p',{}, q.confidence));
    fin.append(x);
    if (q.otherDiffers) fin.append(el('div',{class:'warnbox'}, el('b',{},'Other source differs: '), q.otherDiffers));
    if (q.printedAlso) fin.append(el('div',{class:'hint',style:'margin-top:10px'}, '↻ This question was also printed as: '+q.printedAlso.join(', ')+' (options may be in a different order, same answers).'));
    card.append(fin);
  }
  return card;
}

/* ---- viewer ---- */
function viewer(list, emptyMsg){
  const root = el('div');
  if (!list.length) { root.append(el('div',{class:'empty'}, emptyMsg||'No questions match.')); return root; }
  if (S.i >= list.length) S.i = 0;
  const q = list[S.i];
  const doneN = list.filter(x => mem.done[x.id]).length;
  const dots = el('div',{class:'grid'}, list.map((x,k) => { const d = mem.done[x.id];
    return el('button',{class:'dot'+(k===S.i?' cur':'')+(d?(d.ok?' ok':' no'):'')+(mem.flag[x.id]?' fl':''),onclick:()=>{S.i=k;render();window.scrollTo({top:document.querySelector('nav').offsetTop,behavior:'smooth'});}}, ''+x.id); }));
  root.append(el('div',{class:'topbar'}, el('b',{},`Question ${S.i+1} of ${list.length}`), el('span',{class:'hint'},`${doneN} attempted`)),
    el('div',{class:'bar'}, el('i',{style:`width:${(S.i+1)/list.length*100}%`})),
    el('details',{class:'card'}, el('summary',{},'Jump to a question'), el('div',{class:'hint'},'Green = right · red = needs work · ⚑ = flagged'), dots));
  root.append(questionCard(q));
  root.append(el('div',{class:'btnrow',style:'justify-content:space-between'},
    el('button',{class:'btn',disabled:S.i===0,onclick:()=>step(-1)}, '← Previous'),
    el('button',{class:'btn pri',disabled:S.i===list.length-1,onclick:()=>step(1)}, 'Next →')));
  root._len = list.length; return root;
}
let curLen = 0;
function step(d){ S.i = Math.max(0, Math.min(curLen-1, S.i + d)); render(); document.querySelector('nav').scrollIntoView({behavior:'smooth'}); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (['practice','accepted','verify','hot'].includes(S.tab)) { if (e.key==='ArrowRight') step(1); if (e.key==='ArrowLeft') step(-1); }
});

/* ---- filters ---- */
function chipRow(label, opts, cur, set, colorFor){
  return el('div',{}, el('div',{class:'hint'},label),
    el('div',{class:'chips'}, opts.map(([k,l]) => el('span',{class:'chip'+(cur===k?' on':''),style:colorFor&&k!=='all'?`--c:${colorFor(k)}`:'',onclick:()=>set(k)}, l))));
}
function baseList(){
  let l = S.quiz ? S.quiz.map(i => byId[i]) : Q.slice();
  if (S.lec !== 'all') l = l.filter(q => q.theme == S.lec);
  if (S.at !== 'all') l = l.filter(q => q.at === S.at);
  if (S.type !== 'all') l = l.filter(q => q.type === S.type);
  if (S.q) { const t = S.q.toLowerCase(); l = l.filter(q => ('q'+q.id+' '+q.topic+' '+q.stem+' '+Object.values(q.options).join(' ')).toLowerCase().includes(t)); }
  return l;
}
function filterCard(withShow){
  const c = el('div',{class:'card'},
    el('input',{type:'search',placeholder:'🔍 Search topic or words…',value:S.q,oninput:e=>{S.q=e.target.value;S.i=0;render(true);}}),
    chipRow('Theme',[['all','All'],...LORDER.filter(k=>Q.some(q=>q.theme==k)).map(k=>[k,LEC[k]])],S.lec,v=>{S.lec=v;S.i=0;render();},lc),
    el('div',{}, el('div',{class:'hint'},'Assessed topic'), el('select',{class:'sel',onchange:e=>{S.at=e.target.value;S.i=0;render();}},
      el('option',{value:'all'},'All topics'),
      D.cats.map(cat => el('optgroup',{label:cat}, Object.entries(TOP).filter(([c,t])=>t.cat===cat&&t.n).map(([c,t]) => el('option',{value:c,selected:S.at===c},`${t.name} (${t.n})`)))))),
    chipRow('Type',[['all','All'],['MTF','MTF'],['SBA','SBA']],S.type,v=>{S.type=v;S.i=0;render();}));
  if (withShow) c.append(chipRow('Show',[['all','All'],['todo','Not tried'],['wrong','Wrong ones'],['flag','Flagged']],S.show,v=>{S.show=v;S.i=0;render();}));
  if (S.quiz) c.append(el('div',{class:'btnrow',style:'margin-top:0'}, el('span',{class:'b lec',style:'--lc:var(--rose)'},'Random 10 quiz'), el('button',{class:'btn',onclick:()=>{S.quiz=null;S.i=0;render();}},'✕ Back to all questions')));
  return c;
}

/* ---- pages ---- */
function home(){
  const done = Object.keys(mem.done).length, right = Object.values(mem.done).filter(d=>d.ok).length, wrong = done-right;
  const chk = Q.filter(q=>!q.accepted).length;
  const r = el('div',{class:'page'});
  const nums = [[Q.length,'questions','s1'],[done,'attempted','s2'],[chk,'answers to double-check','s3'],[Object.keys(LEC).length,'themes','s4']];
  const stats = el('div',{class:'stats'}, nums.map(([n,l,c]) => { const b = el('b',{},'0'); setTimeout(()=>countUp(b,n),150); return el('div',{class:'stat '+c}, b, l); }));
  r.append(stats);
  const pct = done ? Math.round(right/done*100) : 0, C = 2*Math.PI*44;
  const ring = el('div',{class:'card ring'});
  ring.innerHTML = `<svg width="110" height="110" viewBox="0 0 110 110"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#c8962e"/></linearGradient></defs>
    <circle class="bg" cx="55" cy="55" r="44" fill="none" stroke-width="11"/>
    <circle class="fg" cx="55" cy="55" r="44" fill="none" stroke-width="11" stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 55 55)"/>
    <text x="55" y="61" text-anchor="middle" font-size="22" font-weight="800" fill="#064e46">${pct}%</text></svg>`;
  setTimeout(()=>{ const f = ring.querySelector('.fg'); if(f) f.style.strokeDashoffset = C*(1-pct/100); }, 200);
  const side = el('div',{style:'flex:1;min-width:200px'}, el('h3',{},'Your progress'),
    el('div',{class:'hint'}, done ? `${right} right · ${wrong} to revisit · ${Q.length-done} not tried yet` : 'Nothing attempted yet. Bismillah, start with any question.'),
    el('div',{class:'btnrow'},
      el('button',{class:'btn pri',onclick:()=>{S.quiz=null;S.lec='all';S.at='all';S.type='all';S.show='all';S.q='';S.at='all';
        const li = mem.last ? Q.findIndex(x=>x.id===mem.last) : 0; S.i = Math.max(0,li); go('practice',true);}}, done ? 'Continue where I stopped' : 'Start practising'),
      el('button',{class:'btn gold',onclick:()=>{ const pool = Q.filter(q=>!mem.done[q.id]); const src = (pool.length>=10?pool:Q).slice().sort(()=>Math.random()-.5).slice(0,10).map(q=>q.id);
        S.quiz = src; S.lec='all';S.at='all';S.type='all';S.show='all';S.q=''; go('practice'); }}, '🎲 Random 10'),
      wrong ? el('button',{class:'btn',onclick:()=>{S.quiz=null;S.show='wrong';S.lec='all';S.at='all';S.type='all';S.q='';go('practice');}}, `Redo ${wrong} wrong`) : null));
  ring.append(side); r.append(ring);

  r.append(el('div',{class:'card'}, el('h3',{},'How to use this site'),
    el('p',{},'Open ', el('b',{},'Practice'), ', answer each question (for MTF mark every statement True or False), then tap ', el('b',{},'Check my answer'), '. You will see the correct answer, why, where it comes from, and how sure we are.'),
    el('p',{}, el('span',{class:'b ok'},'✓ Accepted answer'), ' a lecture slide supports it. ', el('span',{class:'b chk'},'⚠ Check this one'), ' we are not fully sure, no lecture covers it, or the paper is incomplete. Our best answer is shown. Confirm these with a senior or lecturer.'),
    el('p',{class:'hint'},'Repeated shows ideas the examiners ask again. Your progress is saved on this device.')));
  r.append(el('div',{class:'card'}, el('h3',{},'Pick a theme'),
    el('div',{class:'chips'}, LORDER.map(k => el('span',{class:'chip',style:`--c:${lc(k)}`,onclick:()=>{S.quiz=null;S.lec=k;S.at='all';S.type='all';S.show='all';S.q='';go('practice');}}, `${LEC[k]} · ${Q.filter(q=>q.theme==k).length}`)))));
  return r;
}
function practice(){
  const r = el('div',{class:'page'}); r.append(filterCard(true));
  let l = baseList();
  if (S.show==='wrong') l = l.filter(q => mem.done[q.id] && !mem.done[q.id].ok);
  if (S.show==='flag') l = l.filter(q => mem.flag[q.id]);
  if (S.show==='todo') l = l.filter(q => !mem.done[q.id]);
  curLen = l.length; r.append(viewer(l, S.show==='wrong'?'Nothing wrong yet. Mashaa Allah!':'No questions match these filters.')); return r;
}
function listPage(title, blurb, list, empty){
  const r = el('div',{class:'page'});
  r.append(el('div',{class:'card'}, el('h2',{},title), el('p',{class:'hint',style:'margin:0'},blurb)), filterCard(false));
  const base = new Set(baseList().map(q=>q.id)); const l = list.filter(q=>base.has(q.id));
  curLen = l.length; r.append(viewer(l, empty)); return r;
}
function jump(id){ S.quiz=null; S.lec='all'; S.at='all'; S.type='all'; S.show='all'; S.q=''; S.i = Q.findIndex(x=>x.id===id); go('practice',true); }
function hot(){
  const r = el('div',{class:'page'});
  r.append(el('div',{class:'card'}, el('h2',{},'🔁 Repeated questions'), el('p',{class:'hint',style:'margin:0'},'Ideas the examiners ask again and again, in different words. The number is how many questions we found on the idea across the ten past papers. Tap a question to practise it.')));
  const box = el('div',{class:'hot'});
  for (const g of D.groups) box.append(el('div',{class:'card hotitem'}, el('div',{class:'times'}, g.times+'×'),
    el('div',{}, el('b',{}, g.name), g.tip ? el('small',{}, g.tip) : null, el('div',{}, g.ids.map(i => el('a',{class:'q',onclick:()=>jump(i)}, 'Q'+i))))));
  r.append(box);
  const rep = Q.filter(isRep);
  if (rep.length) r.append(el('div',{class:'card'}, el('h3',{},'Printed more than once, word for word'),
    el('p',{class:'hint'},'The same question appeared in more than one batch (options sometimes shuffled). The answer is identical each time.'),
    rep.map(q => el('div',{style:'margin:6px 0'}, el('a',{class:'q',onclick:()=>jump(q.id)},'Q'+q.id), q.topic, el('span',{class:'hint'},' · '+[q.batch].concat(q.printedAlso).join(' + '))))));
  return r;
}
function pdfs(){
  const r = el('div',{class:'page'});
  r.append(el('div',{class:'card'}, el('h2',{},'📄 PDFs'), el('p',{class:'hint',style:'margin:0'},'One PDF per theme, plus everything in one file. They sit in the pdf folder next to this page, so they work when you open the site from the same folder or from the hosted link.')));
  r.append(el('div',{class:'lecgrid'}, [...LORDER.map(k => el('div',{class:'lec',style:`--lc:${lc(k)}`}, el('b',{}, LEC[k]), el('div',{class:'hint'}, Q.filter(q=>q.theme==k).length+' questions'), el('div',{class:'btnrow'}, el('a',{class:'btn',href:`pdf/CHS_${k}_${SLUG[k]}.pdf`,target:'_blank'}, 'Open PDF')))),
    el('div',{class:'lec',style:'--lc:var(--gold)'}, el('b',{},'Everything'), el('div',{class:'hint'}, Q.length+' questions, grouped by theme'), el('div',{class:'btnrow'}, el('a',{class:'btn gold',href:'pdf/CHS_All_questions.pdf',target:'_blank'}, 'Open PDF'))),
    el('div',{class:'lec',style:'--lc:var(--rose)'}, el('b',{},'Repeated questions'), el('div',{class:'hint'}, 'Questions grouped by idea'), el('div',{class:'btnrow'}, el('a',{class:'btn',href:'pdf/CHS_Repeated.pdf',target:'_blank'}, 'Open PDF'))),
    el('div',{class:'lec',style:'--lc:var(--ok)'}, el('b',{},'Accepted answers'), el('div',{class:'hint'}, Q.filter(q=>q.accepted).length+' safest answers'), el('div',{class:'btnrow'}, el('a',{class:'btn',href:'pdf/CHS_Accepted.pdf',target:'_blank'}, 'Open PDF')))]));
  return r;
}
function notes(){
  const r = el('div',{class:'page'}); const keys = Object.keys(D.notes);
  r.append(el('div',{class:'card'}, el('h2',{},'📚 Notes'), el('p',{class:'hint',style:'margin:0'}, keys.length ? 'Exam-oriented notes from the lecture slides.' : 'Exam-oriented notes for each lecture are on the way, in shaa Allah. Meanwhile, practise each lecture below.')));
  if (keys.length) {
    const cur = S.note && D.notes[S.note] ? S.note : keys[0];
    r.append(el('div',{class:'chips'}, keys.map(k => el('span',{class:'chip'+(k===cur?' on':''),onclick:()=>{S.note=k;render();}}, k.replace(/_/g,' ')))), el('div',{class:'card notes'}, md(D.notes[cur])));
  } else {
    r.append(el('div',{class:'lecgrid'}, LORDER.map(k => el('div',{class:'lec',style:`--lc:${lc(k)}`}, el('b',{}, LEC[k]), el('div',{class:'hint'}, Q.filter(q=>q.theme==k).length+' past-paper questions'),
      el('span',{class:'notesoon'},'Notes coming soon'), el('div',{class:'btnrow'}, el('button',{class:'btn',onclick:()=>{S.quiz=null;S.lec=k;S.at='all';S.type='all';S.show='all';S.q='';go('practice');}}, 'Practise →'))))));
  }
  return r;
}
function md(t){
  const box = el('div'); let ul = null;
  const inl = s => { const f = document.createDocumentFragment(); s.split(/(\*\*[^*]+\*\*)/).forEach(p => f.append(/^\*\*/.test(p) ? el('b',{},p.slice(2,-2)) : p)); return f; };
  for (const ln of t.split('\n')) { let m;
    if ((m = ln.match(/^(#{1,3})\s+(.*)/))) { ul=null; box.append(el('h'+(m[1].length+1),{}, m[2])); }
    else if ((m = ln.match(/^\s*[-*]\s+(.*)/))) { if(!ul){ul=el('ul');box.append(ul);} ul.append(el('li',{}, inl(m[1]))); }
    else if (ln.trim()) { ul=null; box.append(el('p',{}, inl(ln))); } }
  return box;
}

/* ---- render ---- */
function render(keep){
  const app = document.getElementById('app');
  const f = keep && document.activeElement && document.activeElement.type==='search' ? document.activeElement : null; const pos = f ? f.selectionStart : 0;
  let v;
  switch (S.tab) {
    case 'home': v = home(); break;
    case 'practice': v = practice(); break;
    case 'hot': v = hot(); break;
    case 'accepted': v = listPage('✅ Accepted answers','Questions where a lecture slide supports our answer and we have no doubt. These are the safest to learn first.', Q.filter(q=>q.accepted), 'No accepted questions match.'); break;
    case 'verify': v = listPage('⚠ Answers to double-check','Not fully sure, no lecture available, or the paper is incomplete. We show our best answer and mark the doubtful options. Confirm these with a senior or lecturer.', Q.filter(q=>!q.accepted), 'Nothing to double-check here.'); break;
    case 'pdf': v = pdfs(); break;
    case 'notes': v = notes(); break;
  }
  if (keep) v.style.animation = 'none';
  app.replaceChildren(v);
  if (f) { const n = app.querySelector('input[type=search]'); if (n) { n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } }
}
drawTabs(); render();
</script>
