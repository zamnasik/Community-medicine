<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Community Health Sciences · For Musliha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Great+Vibes&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8ee; --card:#ffffff; --ink:#17302c; --mute:#5d7872; --line:#eadfc7;
  --teal:#0f766e; --teal2:#14b8a6; --deep:#064e46; --gold:#c8962e; --gold2:#f4d27a;
  --rose:#e11d74; --ok:#15803d; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  --warn:#a16207; --warnbg:#fef3c7; --shadow:0 10px 30px rgba(15,118,110,.12);
  --r:20px;
  --l1:#e11d48; --l2:#0ea5e9; --l3:#f59e0b; --l4:#8b5cf6; --l5:#ef4444;
  --l6:#ec4899; --l7:#14b8a6; --l8:#0f766e; --l9:#6366f1; --lT:#b45309;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(circle at 10% 0%,#fff6dc 0,transparent 40%),radial-gradient(circle at 100% 30%,#e3f7f2 0,transparent 35%);background-attachment:fixed}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;padding:34px 0 64px;
  background:linear-gradient(135deg,#053f39 0%,#0f766e 55%,#27b7a3 100%)}
.hero::before{content:"";position:absolute;inset:0;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><g fill='none' stroke='white' stroke-opacity='.13' stroke-width='1.2'><rect x='18' y='18' width='36' height='36'/><rect x='18' y='18' width='36' height='36' transform='rotate(45 36 36)'/><circle cx='36' cy='36' r='5'/></g></svg>")}
.orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;animation:float 9s ease-in-out infinite}
.orb.a{width:150px;height:150px;right:-30px;top:-30px;background:radial-gradient(circle,var(--gold2),transparent 70%)}
.orb.b{width:110px;height:110px;left:8%;bottom:-20px;background:radial-gradient(circle,#fff,transparent 70%);animation-delay:-3s}
.orb.c{width:70px;height:70px;right:20%;bottom:30px;background:radial-gradient(circle,var(--gold2),transparent 70%);animation-delay:-6s}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16px) scale(1.06)}}
.hero .wrap{position:relative;text-align:center}
.pill{display:inline-block;padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);font-size:.78rem;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;animation:fadeUp .8s both}
.ayah{font-family:"Amiri","Scheherazade New","Traditional Arabic",serif;font-size:clamp(1.9rem,6.4vw,2.9rem);line-height:1.6;margin:16px 0 2px;color:var(--gold2);text-shadow:0 2px 14px rgba(0,0,0,.25);animation:fadeUp .9s .15s both}
.trans{font-size:clamp(1.05rem,3.6vw,1.3rem);font-weight:700;margin:0;animation:fadeUp .9s .3s both}
.cite{opacity:.85;font-size:.85rem;margin:2px 0 14px;animation:fadeUp .9s .4s both}
.sub{max-width:520px;margin:0 auto;opacity:.95;animation:fadeUp .9s .5s both}
.for{font-family:"Great Vibes","Brush Script MT",cursive;font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.15;margin:16px 0 0;animation:fadeUp .9s .65s both}
.for .nm{background:linear-gradient(90deg,#fff 0%,var(--gold2) 40%,#fff 60%,var(--gold2) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 5s 1.6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.heart{display:inline-block;font-family:system-ui,sans-serif;font-size:.6em;vertical-align:middle;color:#ffb4cf;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.25)}40%{transform:scale(1)}}
.wave{position:absolute;left:0;right:0;bottom:-1px;height:40px;background:var(--bg);clip-path:ellipse(60% 100% at 50% 100%)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* nav */
nav{position:sticky;top:0;z-index:20;background:rgba(253,248,238,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding:9px 16px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:0;background:transparent;color:var(--mute);padding:8px 14px;border-radius:999px;font:700 .92rem "Nunito",sans-serif;cursor:pointer;white-space:nowrap;transition:all .25s}
nav button:hover{background:#f3ead5;color:var(--deep)}
nav button.on{background:linear-gradient(120deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 4px 12px rgba(15,118,110,.3)}
main{padding:20px 0 90px;margin-top:-8px}
.page{animation:fadeUp .45s both}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 16px;box-shadow:var(--shadow)}
h2{margin:.2em 0 .1em;font-size:1.4rem;color:var(--deep)}
h3{margin:0 0 6px;color:var(--deep)}
.hint{color:var(--mute);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 16px}
.stat{position:relative;overflow:hidden;border-radius:18px;padding:16px;color:#fff;box-shadow:var(--shadow);animation:fadeUp .6s both}
.stat:nth-child(2){animation-delay:.08s}.stat:nth-child(3){animation-delay:.16s}.stat:nth-child(4){animation-delay:.24s}
.stat b{display:block;font-size:2rem;line-height:1.1}
.stat::after{content:"";position:absolute;right:-20px;bottom:-24px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.18)}
.s1{background:linear-gradient(135deg,#0f766e,#14b8a6)}.s2{background:linear-gradient(135deg,#c8962e,#f0c35c)}
.s3{background:linear-gradient(135deg,#be185d,#f472b6)}.s4{background:linear-gradient(135deg,#4f46e5,#818cf8)}
.ring{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ring svg{flex:0 0 auto}
.ring circle.bg{stroke:#efe6cf}.ring circle.fg{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;border-radius:14px;padding:11px 18px;font:800 .95rem "Nunito",sans-serif;cursor:pointer;background:#f3ead5;color:var(--deep);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.1)}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(120deg,var(--teal),var(--teal2));color:#fff;box-shadow:0 6px 16px rgba(15,118,110,.3)}
.btn.gold{background:linear-gradient(120deg,#c8962e,#f0c35c);color:#3a2a05}
.btn:disabled{opacity:.4;pointer-events:none}

/* chips & filters */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0 12px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:5px 12px;border-radius:999px;font-size:.84rem;font-weight:700;cursor:pointer;transition:all .2s;--c:var(--teal)}
.chip:hover{border-color:var(--c)}
.chip.on{background:var(--c);border-color:var(--c);color:#fff;animation:pop .3s}
input[type=search]{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:600 1rem "Nunito",sans-serif;outline:none}
input[type=search]:focus{border-color:var(--teal2);box-shadow:0 0 0 4px rgba(20,184,166,.15)}

/* viewer */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.bar{height:8px;background:#efe6cf;border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold));border-radius:99px;transition:width .5s}
details summary{cursor:pointer;font-weight:700;color:var(--teal);margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin:10px 0 2px}
.dot{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:7px 0;font:700 .82rem "Nunito",sans-serif;cursor:pointer;position:relative;transition:transform .15s}
.dot:hover{transform:scale(1.08)}
.dot.cur{outline:2px solid var(--teal);outline-offset:1px}
.dot.ok{background:var(--okbg);border-color:var(--ok)}.dot.no{background:var(--badbg);border-color:var(--bad)}
.dot.fl::after{content:"⚑";position:absolute;top:-6px;right:1px;font-size:.72rem;color:var(--rose)}
.qcard{position:relative;border-top:5px solid var(--lc,var(--teal))}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.b{font-size:.72rem;font-weight:800;padding:3px 10px;border-radius:999px;background:#f3ead5;color:var(--mute)}
.b.lec{background:var(--lc);color:#fff}
.b.ok{background:var(--okbg);color:var(--ok)}.b.chk{background:var(--warnbg);color:var(--warn)}
.b.tb{background:#ffedd5;color:#9a3412}.b.rep{background:#fce7f3;color:#be185d}
.topic{color:var(--mute);font-weight:700;font-size:.9rem}
.stem{font-size:1.08rem;font-weight:800;margin:4px 0 14px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:16px;padding:11px 13px;margin:9px 0;background:#fff;transition:border-color .2s,background .2s,transform .15s}
.opt .l{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:.88rem}
.opt .tx{flex:1;min-width:0}
.sba{cursor:pointer}.sba:hover{border-color:var(--teal2);transform:translateX(3px)}
.opt.pick{border-color:var(--teal);background:#e8f8f5}
.opt.good{border-color:var(--ok);background:var(--okbg);animation:pop .4s}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.opt.unans{border-color:var(--gold);background:#fff8e6}
.tf{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.tf button{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:6px 20px;font:800 .9rem "Nunito",sans-serif;cursor:pointer;transition:all .2s}
.tf button:hover{border-color:var(--teal2)}
.tf button.sel{background:var(--teal);border-color:var(--teal);color:#fff;animation:pop .25s}
.tf button:disabled{cursor:default;opacity:.85}
.key{font-size:.85rem;font-weight:800;padding:2px 10px;border-radius:99px;background:#fff;border:1.5px solid currentColor}
.chkmark{font-size:.78rem;font-weight:800;color:var(--warn);background:var(--warnbg);padding:2px 9px;border-radius:99px}
.verdict{font-weight:800;margin-top:14px;font-size:1.05rem}
.exp{margin-top:12px;border-left:5px solid var(--gold);background:#fffaf0;padding:8px 14px;border-radius:0 14px 14px 0;animation:fadeUp .4s both}
.exp h4{margin:10px 0 2px;font-size:.74rem;text-transform:uppercase;letter-spacing:.8px;color:var(--gold)}
.exp p{margin:0}
.warnbox{background:var(--warnbg);color:#7c4a03;border-radius:14px;padding:9px 13px;margin-top:10px;font-size:.93rem}
.final{margin-top:14px}

/* tables / lists */
.hot{display:grid;gap:12px}
.hotitem{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.times{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1.3rem;background:linear-gradient(135deg,var(--rose),#fb7185)}
.hotitem small{display:block;color:var(--mute)}
a.btn{text-decoration:none;display:inline-block}
select.sel{width:100%;padding:10px 12px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:700 .95rem Nunito,sans-serif;margin:6px 0 12px}
a.q{display:inline-block;margin:3px 4px 0 0;padding:2px 10px;border-radius:99px;background:#e8f8f5;color:var(--teal);font-weight:800;font-size:.85rem;cursor:pointer;text-decoration:none}
a.q:hover{background:var(--teal);color:#fff}
.lecgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lec{border-radius:18px;padding:16px;background:#fff;border:1px solid var(--line);border-left:6px solid var(--lc);box-shadow:var(--shadow);animation:fadeUp .5s both}
.lec b{font-size:1.05rem}
.notesoon{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;background:#fff3d1;color:#8a6410;font-size:.78rem;font-weight:800}
.notes h2,.notes h3{color:var(--teal)}.notes li{margin:3px 0}
.empty{text-align:center;color:var(--mute);padding:34px 12px}
footer{text-align:center;color:var(--mute);padding:10px 16px 40px;font-size:.92rem}
footer .fr{font-family:"Great Vibes",cursive;font-size:1.8rem;color:var(--gold)}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:100;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 20px;border-radius:99px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:101;animation:fadeUp .3s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{.hero,nav,.btn,.btnrow,footer{display:none}}
</style>
</head>

: "Weighing of infants under 6 months can be done at CWC", "C": "Recording of weight of children on CHDR is done by PHNS", "D": "In immunisation programme of preschool children, a medical officer should be there", "E": "Field weighing centres are equipped with digital weighing scales"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture says a beam balance is used for children under 6 months at the clinic and a spring balance for 6 months to 5 years at the field. The IYCF guideline says children up to 6 months are weighed at clinics and older children at field weighing posts. So B is true and E is false, because field centres use spring balances, not digital scales. For A, the lecture only gives the 4-6 week postnatal clinic visit, where mother and baby are assessed by a medical officer. For C, no lecture says the PHNS alone records weights. For D, no lecture covers preschool immunisation. The lecture does say a medical officer is present for emergencies at school immunisation, and I applied the same principle (standard knowledge).", "source": "Growth and Growth Charts lecture (\"How to measure weight\" slide); Guidelines on Infant and Young Child Feeding, section 10; 02-ANC and PNC revised (postnatal clinic at 4-6 weeks); 10 School Health Program Sri Lanka (MO present for emergency during immunisation).", "confidence": "CHECK on A, C and D. No lecture states the timing of the first CWC visit, who records weights on the CHDR, or whether a medical officer attends preschool immunisation. Best answer is A True, C False, D True.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "GMP", "atName": "Growth monitoring and promotion", "atCat": "Nutrition", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 4, "batch": "B22 Q7", "file": "B22", "paperNo": 7, "topic": "PHM responsibilities", "type": "MTF", "theme": 1, "stem": "Responsibilities of a PHM include…", "options": {"A": "Organising child weighing post", "B": "Referring high risk pregnancies for special centres", "C": "Organising school medical inspection", "D": "Promoting early childhood care and development", "E": "Insertion of IUCD"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lectures show the PHM doing home-based pre-pregnancy, antenatal and postnatal care, including risk screening and referral (B), and early childhood care and development is a topic she covers (D). School medical inspection is done by the MOH, with screening by the PHI, so C is false. IUCD is provided at the FP clinic, and the PHM supplies only condoms and COCP, so E is false. A (weighing post) is not stated in the slides; it is standard knowledge that the PHM runs field weighing posts.", "source": "02-ANC and PNC revised (maternal care providers, domiciliary care, antenatal class topics); Family Planning Services in Sri Lanka_Batch 34 (FP services slide); 10 School Health Programme (SMI slides). A is standard knowledge.", "confidence": "CHECK on A, B and D. The slides do not state \"organises weighing post\", \"refers to special centres\" or \"promotes ECCD\" as PHM duties in those words. Best answer is A True, B True, D True.", "check": true, "checkLetters": ["A", "B", "D"], "otherDiffers": "", "dupOf": null, "at": "RHC", "atName": "Reproductive health concepts", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 5, "batch": "B22 Q8", "file": "B22", "paperNo": 8, "topic": "Demographic characteristics of Sri Lanka", "type": "MTF", "theme": 3, "stem": "Current demographic characteristics of Sri Lanka", "options": {"A": "More population is female", "B": "Economically productive population is reducing", "C": "Current adult population is less than 5%", "D": "Highest population density is present in Western province", "E": "Children under 5 years of age have increased"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "A: summing the 2012 age rows in the fertility lecture gives about 10.5 million females out of 20.4 million people (10,502,805 / 20,359,439 = 51.6%), so females are the majority. B: the demographic transition lecture says the working-age population is decreasing while dependent elderly people are increasing. C is false because 12.5% of the population is already over 60, and the working-age group is far larger than 5%. D is standard knowledge, not in the lectures. E is false because the lecture reports a significant drop in the annual birth rate, so the under-5 group is not growing (in the 2012 table the 0-4 group is not larger than the 5-9 group).", "source": "Demographic transition (Dr Nazneen Nazeer), \"Where is Sri Lanka today?\" slide; Demographic transition (Prof Kasturiratne), Sri Lanka slide; 06-Measures of Fertility, 2012 population table.", "confidence": "CHECK on B, D and E. B: the two demographic transition lectures give different pictures of the working-age group. D: not in any lecture (standard knowledge). E: the lecture states the fall in births but not the under-5 trend directly, and \"current\" in an older paper may mean older data. Best answer is B True, D True, E False.", "check": true, "checkLetters": ["A", "B", "D", "E"], "otherDiffers": "The Prof Kasturiratne lecture says Sri Lanka is in a demographic bonus with a larger working-age population than children and elderly, while the Dr Nazeer lecture says the working-age population is decreasing. I kept the Dr Nazeer wording because it is the one about the current trend. CHECK.", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 6, "batch": "B22 Q9", "file": "B22", "paperNo": 9, "topic": "MDGs achievable by Sri Lanka", "type": "MTF", "theme": 7, "stem": "Which of the following Millennium development goals (MDGs) are achievable by Sri Lanka by 2015 according to the current level of progress?", "options": {"A": "Achieve universal primary education", "B": "Ensure environmental sustainability", "C": "Reduce child mortality", "D": "Eradicate extreme poverty and hunger", "E": "Improve maternal health"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The SDG lecture lists the eight MDGs (including poverty and hunger, universal education, child deaths, maternal health and environmental sustainability), but it gives no Sri Lanka progress figures. By standard knowledge, Sri Lanka was on track or ahead for primary education, child mortality, maternal health and halving poverty, so A, C and E are True. B is the least certain because environmental targets were more mixed. D is uncertain because \"hunger\" (undernutrition) lagged behind the poverty target.", "source": "Sustainable Development Goals lecture, MDG slides (goal list and global outcomes only). Sri Lanka progress is standard knowledge.", "confidence": "CHECK on B and D. The lecture gives no Sri Lanka progress data, and the environment and hunger parts were less clearly on track. Best answer is True for both.", "check": true, "checkLetters": ["A", "B", "D"], "otherDiffers": "", "dupOf": null, "at": "SDG", "atName": "Sustainable development goals", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 7, "batch": "B22 Q11", "file": "B22", "paperNo": 11, "topic": "Postnatal home visit frequency", "type": "SBA", "theme": 1, "stem": "Which of the following is the recommended number of frequency of postnatal home visits to be paid by the PHM to a mother and baby delivered in hospital", "options": {"A": "3 visits in 1st 10 days and 2 visits within 11 - 42 days", "B": "3 visits in 1st 10 days and 3 visits within 11 - 42 days", "C": "2 visits in 1st 10 days and 2 visits within 11 - 42 days", "D": "2 visits in 1st 5 days and 3 visits within 6 - 42 days", "E": "2 visits in 1st 5 days and 2 visits within 6 - 42 days"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The lectures give two visits in the first 10 days, one at 14-21 days and one around 42 days. That is 2 visits in the first 10 days and 2 within 11-42 days. E is wrong because only the first visit has to fall within 5 days; the second can be any time up to day 10.", "source": "02 Antenatal and Postnatal Care (Prof Anuradhini), Postpartum care slides (visits 1 and 2 in the first 10 days, 14-21 days, around 42 days; the last two slides are both headed \"visits 3\", a typo). Breast Feeding lecture batch 35, slide 60 (same schedule, first visit within 5 days).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 8, "batch": "B23 Q1", "file": "B23", "paperNo": 1, "topic": "Evidence based medicine concepts", "type": "MTF", "theme": 7, "stem": "Which of the following is / are true regarding evidence based medicine?", "options": {"A": "It is useless when there is no good evidence", "B": "It ignores clinical judgement and expertise", "C": "The evidence must be individualised to each patient", "D": "It is the integration of best research evidence with patient values", "E": "It emphasises appraising evidences"}, "answer": {"A": false, "B": false, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The EBM powerpoint defines EBM as integrating the best research evidence with clinical expertise and patient preferences, so it does not ignore clinical judgement (B False) and the three elements ensure individualised care (C True, D True). The review says a lack of evidence does not prove an intervention is ineffective and that EBM uses the best available evidence, so EBM is not useless without good evidence (A False). Critical appraisal is the basis of EBM and step 3 of practice (E True; \"evidences\" is the paper's typo).", "source": "EBM powerpoint (Prof Kasturiratne), Introduction, Core principles, Steps of practice and Challenges slides; EBM for medical students (Diao et al., UBCMJ 2009), EBM in Practice and Challenges Facing EBM sections.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "EBM", "atName": "Evidence based medicine", "atCat": "EBM", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 9, "batch": "B23 Q2", "file": "B23", "paperNo": 2, "topic": "Gender based violence", "type": "MTF", "theme": 5, "stem": "What is true / false regarding gender based violence?", "options": {"A": "It is negligible in developed countries", "B": "Gender inequity is considered as a cause", "C": "Alcohol consumption is a main risk factor", "D": "Befriending is an important method of providing care", "E": "(Sinhala name unreadable in the paper copy) is established in MOH office for providing care"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture says GBV affects about 1 in 3 women globally and is rooted in gender inequality and abuse of power, so A is false and B is true. The lecture does not cover risk factors or care services, so C and D are standard knowledge (alcohol is a recognised contributing factor, and befriending/psychosocial support is a core part of care). The printed Sinhala in E is corrupted, but it seems to name a GBV care centre. Such centres are set up in hospitals (standard knowledge), not MOH offices, so E is false.", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne), Overview and Prevalence slides. Options C, D and E: standard knowledge.", "confidence": "CHECK on C. The lecture does not list alcohol, and \"main\" risk factor is a strong word. Best answer is True. CHECK on D. The lecture has no slide on care or befriending. Best answer is True. CHECK on E. The Sinhala text is unreadable, so the centre cannot be identified exactly. Best answer is False.", "check": true, "checkLetters": ["C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "note": "Option E is printed in Sinhala and the text is unreadable in the paper copy.", "scored": true}, {"id": 10, "batch": "B23 Q3", "file": "B23", "paperNo": 3, "topic": "Right to health", "type": "MTF", "theme": 9, "stem": "“Right to Health” approach", "options": {"A": "Means that people have a right to be healthy", "B": "Include that individuals may legitimately protest in the denial of the right", "C": "Can be used for primary prevention and health promotion", "D": "Can be used improving curative care", "E": "Useful for developed countries than developing countries"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The right to health is a right to a system of health protection and to the highest attainable standard of health, not a right to be healthy (standard knowledge). It is a rights-based approach, so people can claim it and complain when it is denied. It applies to prevention, promotion and curative care, and it applies to every country, so A and E are false.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on B. No lecture in project, so every option rests on standard knowledge, and B is the least certain. Best answer is True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 11, "batch": "B23 Q4", "file": "B23", "paperNo": 4, "topic": "CBR, CDR and age-specific death rates", "type": "MTF", "theme": 3, "stem": "True / False regarding the following statements…", "options": {"A": "Crude birth rate is a good indicator for comparing health between two countries", "B": "In Sri Lanka, crude birth rate will increase in the future", "C": "Health statute in different countries can be compared using age specific crude death rate", "D": "CDR in developed countries is generally lower than CDR in developing countries", "E": "Age specific death rate increases with increasing age"}, "answer": {"A": false, "B": false, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "A: the fertility lecture says CBR cannot compare two populations because their age-sex structures differ, and it is not a true measure of fertility, let alone health. B: births are falling and the population is ageing, so CBR is not expected to rise. C: the mortality lecture says the crude death rate depends on age-sex structure and cannot be compared between countries; age-specific or age-adjusted rates are the fix. In C, \"statute\" should read \"status\" and \"age specific crude death rate\" mixes two terms. D and E are standard knowledge: ageing developed populations often have a higher CDR, and age-specific death rates rise with age after childhood.", "source": "06-Measures of Fertility, Crude Birth Rate slide (advantages and disadvantages); 07-Measures of Mortality, Crude Death Rate and Mortality Rates slides; Demographic transition (Dr Nazeer), Sri Lanka slide.", "confidence": "CHECK on C, D and E. C: the lecture does not say outright that age-specific rates allow comparison, and the option wording is muddled. D: the lecture's stage model implies lower death rates with development. E: not in the lectures, and infants have higher rates than children. Best answer is C True, D False, E True.", "check": true, "checkLetters": ["A", "C", "D", "E"], "otherDiffers": "The Dr Nazeer demographic transition lecture describes low death rates in stage 3 and 4 (developed) countries, which reads as support for D being True. The mortality lecture says crude death rates cannot be compared across countries because of age structure, and I followed that. CHECK.", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": ["Fert"], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 12, "batch": "B23 Q5", "file": "B23", "paperNo": 5, "topic": "Family planning in Sri Lanka", "type": "MTF", "theme": 2, "stem": "Family planning in Sri Lanka…", "options": {"A": "Number of children is limited to 2", "B": "Treats for subfertility", "C": "Services are provided using cafeteria approach", "D": "Services in the state sector involves small nominal fee"}, "answer": {"A": false, "B": true, "C": true, "D": false}, "prov": null, "cannot": false, "explanation": "The programme goal is that couples have their desired number of children with optimal spacing, so there is no limit of 2. A stated objective is to help subfertile couples to conceive. The lecture lists several methods offered together and stresses voluntary informed choice, which fits the cafeteria approach. The lecture does not mention a fee. Standard knowledge is that state-sector methods are free, so D is false. The paper prints only options A to D.", "source": "Family Planning Services in Sri Lanka_Batch 34, Goal and Objectives slides, Modern Methods slide and Counselling slide. The term \"cafeteria approach\" and the no-fee point are standard knowledge.", "confidence": "CHECK on C and D. Neither the term \"cafeteria approach\" nor fees appear in the lecture. Best answer is C True, D False.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 13, "batch": "B23 Q6", "file": "B23", "paperNo": 6, "topic": "Adolescent fertility rate figure", "type": "MTF", "theme": 3, "stem": "Which of the following is / are true regarding Figure 1?\nFigure 1 - Adolescent fertility rate (15 - 19 of age) per 1000 females", "options": {"A": "There were 22.5 pregnancies per 100 females in 15 - 19 age group in January 2010", "B": "There were 28 live births per 1000 in 15 - 19 age group females in January 1998", "C": "The greatest descent of the fertility rate was between 2007 to 2010", "D": "There was no change in fertility rate between 1998 to 2002", "E": "Increased female education is unlikely to have a relationship for the decline of the fertility rate"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The figure is in the PDF as a scanned image on page 4 (my earlier inventory called it missing). It is a line near 28 from 1998 to about 2002, then a steady fall to about 23 by 2008-09. A: the lecture defines ASFR as live births per 1000 women in the age group, so about 22.5 is per 1000 (not per 100) and is births (not pregnancies). B and D match the flat start of the line. C: the steepest fall is about 2002-2005, and the line flattens by 2006-08. E: the lecture lists female literacy as a factor affecting fertility.", "source": "06-Measures of Fertility, Age Specific Fertility Rate slide and Factors affecting fertility slide; Figure 1 from B23 page 4.", "confidence": "CHECK on B and D. The figure is a rough scan, the line starts just after the Jan-98 tick, and it dips slightly near 2002. Best answer is B True, D True.", "check": true, "checkLetters": ["A", "B", "D"], "otherDiffers": "", "dupOf": null, "at": "Fert", "atName": "Measures of fertility", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "note": "Figure 1 (line graph of the adolescent fertility rate) is printed in the paper and is not shown here.", "scored": true}, {"id": 14, "batch": "B23 Q7", "file": "B23", "paperNo": 7, "topic": "Child mental health development", "type": "MTF", "theme": 5, "stem": "Regarding child mental health development…", "options": {"A": "Stimulated by response", "B": "Enhanced by spending quality time with the child", "C": "Can get health message from CHDR"}, "answer": {"A": true, "B": true, "C": true}, "prov": null, "cannot": false, "explanation": "The ECD lecture tells carers to spend time with children and be responsive, stimulating and caring adults, which supports A and B. The lectures describe the CHDR as a comprehensive health record but do not say what messages it carries on mental or psychosocial development. Standard knowledge is that the CHDR gives parents health and development messages, so C is taken as true. Only options A to C are printed.", "source": "13 Early Childhood Development Batch 34, slide 11 (\"Spend time with children! Be a responsive, stimulating, caring adult\"); growth and growth charts nutrition module, CHDR slide. Option C: standard knowledge.", "confidence": "CHECK on C. No lecture states that the CHDR carries mental health messages. Best answer is True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "MHChild", "atName": "Mental health promotion in childhood", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 15, "batch": "B23 Q8", "file": "B23", "paperNo": 8, "topic": "Noise", "type": "MTF", "theme": 6, "stem": "Noise…", "options": {"A": "Is an unwanted sound", "B": "Occurs due to the amplitude of the sound", "C": "Introduced hearing loss typically affects frequencies within 1000 - 4000 Hz", "D": "Is measured in Decibels", "E": "Cannot be controlled at the point of origin"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Noise is unwanted sound and is measured in decibels, so A and D are True (standard knowledge). Loudness depends on the amplitude of the sound, so B is accepted as True, though its wording is loose (standard knowledge). Noise-induced hearing loss typically starts as a notch at the higher frequencies, around 3000 to 6000 Hz and centred near 4000 Hz, so C is False, and \"Introduced\" in C is a typo for \"Induced\" (standard knowledge). E is False because the lecture lists isolation (shielding against noise) and engineering control as ways to reduce noise at source.", "source": "Occupational Diseases lecture, \"Diseases due to physical agents\" (noise: noise-induced hearing loss), \"Isolation\" and \"Engineering control\" slides. A to D are standard knowledge.", "confidence": "CHECK on B and C. The lectures do not define noise or give the frequency range of hearing loss, and B is loosely worded. Best answer is B True, C False.", "check": true, "checkLetters": ["A", "B", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 16, "batch": "B23 Q9", "file": "B23", "paperNo": 9, "topic": "Reportable factory accidents", "type": "MTF", "theme": 6, "stem": "Reportable accidents include…", "options": {"A": "All accidents in mines", "B": "Any accident involving in the construction areas", "C": "Death occurred in the workplace", "D": "Any accident causing harm for more than 3 days", "E": "Sudden unconsciousness due to poison inhalation"}, "answer": {"A": false, "B": false, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Section 61 of the Factories Ordinance (legislation lecture) requires notice of accidents that cause loss of life, disable a person for more than three days from earning full wages, or cause unconsciousness from heat, exhaustion, electric shock or poisonous fumes. So C, D and E are True. Not every accident in mines (A) or construction (B) is reportable, and dangerous occurrences such as explosions and building collapse are listed separately.", "source": "Occupational safety & health legislature lectures (both files, read by OCR from the slide images), Part VI Notification and investigation of accidents; slide \"Notification to District Factory Inspecting Engineer\".", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccLaw", "atName": "Occupational safety and health legislation", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 17, "batch": "B23 Q10", "file": "B23", "paperNo": 10, "topic": "Pillars of safe motherhood", "type": "MTF", "theme": 1, "stem": "What is / are the pillars to measure the safety motherhood?", "options": {"A": "Antenatal care", "B": "Primary health care", "C": "Safe / clean delivery", "D": "Equity for women", "E": "Family planning"}, "answer": {"A": true, "B": false, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The Safe motherhood slide and the Maternal Mortality prevention slide list family planning, antenatal care, obstetric (safe delivery) care, postnatal care and essential/emergency obstetric care as the components. Primary health care and equity for women are not among these components. In the standard model they are the foundation, not pillars, so B and D are false. The stem has typos (\"measure\", \"safety\").", "source": "02-ANC and PNC revised (Safe motherhood slides); 08 Maternal Mortality (Prevention slides). The foundation role of PHC and equity is standard knowledge.", "confidence": "CHECK on B and D. The slide text does not say which items are foundation and which are pillars, and the slide diagram was not readable as text. Best answer is B False, D False.", "check": true, "checkLetters": ["A", "B", "D"], "otherDiffers": "", "dupOf": null, "at": "RHC", "atName": "Reproductive health concepts", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 18, "batch": "B23 Q11", "file": "B23", "paperNo": 11, "topic": "Demographic transition phase, 2005 rates", "type": "SBA", "theme": 3, "stem": "In 2005, crude birth rate of Sri Lanka was 18.1 per 1000 births and CDR was 6.5 per 1000. Based on 2005 data, which phase of demographic transition best describes in Sri Lanka?", "options": {"A": "High stationary phase", "B": "Early expanding phase", "C": "Low stationary phase", "D": "Late expanding phase", "E": "Declining phase"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Natural increase is CBR minus CDR, which is 18.1 − 6.5 = 11.6 per 1000 (standard knowledge). Births are still nearly three times deaths, so the population is growing, but the birth rate has already fallen. That matches the lecture's Stage 3 (late expanding): birth rate falling, death rate low and falling slowly, population rising at a slower pace. C is wrong because Stage 4 (low stationary) needs both rates low with a steady population, and here births far outstrip deaths.", "source": "Demographic transition (Dr Nazneen Nazeer), Stage 2 to Stage 5 slides; 07-Measures of Mortality, Crude Death Rate slide.", "confidence": "CHECK on D. The lecture gives no numeric cut-offs for the stages, so the placement rests on the pattern of the two rates. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 19, "batch": "B23 Q12", "file": "B23", "paperNo": 12, "topic": "IMR target from MDG calculation", "type": "SBA", "theme": 3, "stem": "A millennium development goal was to reduce the under 5 mortality by 2/3 from the 1990 in figures of 2015. One indicator considered was the infant mortality rate. The infant mortality rate in 1990 was 18 deaths under 1 year per 1000 live births. What is the infant mortality rate target we want to achieve by 2015?", "options": {"A": "3 deaths per 1000 live births", "B": "6 deaths per 1000 live births", "C": "9 deaths per 1000 live births", "D": "12 deaths per 1000 live births", "E": "15 deaths per 1000 live births"}, "answer": "B", "prov": null, "cannot": false, "explanation": "A two-thirds reduction leaves one third: target = 18 × (1 − 2/3) = 6 deaths per 1000 live births. D (12) is the size of the reduction (18 × 2/3), not the level to be reached.", "source": "No lecture in project states the MDG 4 target; the SDG lecture mentions MDGs only in general. The answer uses only the figures in the stem.", "confidence": "CHECK on B. The arithmetic is straightforward, but no lecture covers the target. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": ["SDG"], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 20, "batch": "B23 Q13", "file": "B23", "paperNo": 13, "topic": "Contraception for a sex worker", "type": "SBA", "theme": 2, "stem": "A 25 year old unmarried female sex worker came to the clinic to get an opinion for contraceptives. She is not planning to have a child. What is the best advice you give to her?", "options": {"A": "Give up the job and find a reasonable job", "B": "Use condoms when encountering a partner", "C": "Use DMPA injections", "D": "Use morning after pills after an encounter with a client", "E": "Use DMPA injections and Use condoms when encountering a partner"}, "answer": "E", "prov": null, "cannot": false, "explanation": "She needs protection against pregnancy and against STI/HIV. Condoms protect against infection but are less reliable alone for pregnancy, and DMPA gives high pregnancy protection but no STI protection. Dual protection (a highly effective method plus condoms) is therefore best. A is judgemental and not clinical advice. D, emergency contraception, is not a regular method.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Modern Family Planning Methods\" slide (condoms and DMPA are listed). The dual-protection advice is standard knowledge.", "confidence": "CHECK on B. The lecture does not discuss dual protection. B alone can be defended for STI prevention. Best answer is E.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 21, "batch": "B23 Q14", "file": "B23", "paperNo": 14, "topic": "Commonest cause of maternal death", "type": "SBA", "theme": 2, "stem": "Most common cause for maternal mortality in Sri Lanka…", "options": {"A": "Septic abortion", "B": "Post partum haemorrhage", "C": "Pregnancy induced hypertension", "D": "Heart disease complicating pregnancy", "E": "Pulmonary amniotic fluid embolism"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Standard knowledge is that indirect causes, mainly heart disease aggravated by pregnancy, are the largest single group of maternal deaths in Sri Lanka in recent decades, ahead of haemorrhage. The lecture text gives only the definitions of direct and indirect deaths and the 2022 counts (174 probable and 91 true maternal deaths). It gives no cause breakdown. Option B, PPH, is the main alternative and was historically more prominent.", "source": "08 Maternal Mortality, Definitions slides (indirect deaths, e.g. cardiac disease) and Epidemiology section. The cause ranking is standard knowledge.", "confidence": "CHECK on D. The extractable lecture text has no cause chart, and the Epidemiology slides may hold a chart that did not extract. Please check that slide. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 22, "batch": "B23 Q17", "file": "B23", "paperNo": 17, "topic": "Missed DMPA injection", "type": "SBA", "theme": 2, "stem": "32 years old married lady who was on DMPA as contraceptive method forgot to come to the clinic on due date, which was 20th March 2013. She comes to you who is a GP on 27th March 2013 asking for the missed DMPA injection. What is the most appropriate management of the lady?", "options": {"A": "Give DMPA injection and Advise to use a barrier method until the next menstruation", "B": "Give DMPA injection on next menstruation", "C": "Give DMPA injection on 27th March 2013", "D": "Give DMPA injection on 27th March 2013 after confirming urine hCG as negative", "E": "Introduce another contraceptive method other than DMPA"}, "answer": "C", "prov": null, "cannot": false, "explanation": "She is 7 days late. Standard knowledge is that DMPA re-injection can be given within a grace period of about 2 weeks after the due date without a pregnancy test or extra contraception. So the injection can be given on the day she attends. A and D add precautions that are not needed inside the grace period. B and E delay or change protection unnecessarily.", "source": "No lecture in project. The Family Planning lecture only lists DMPA as a method and defers details to PBL sessions. The grace-period rule is standard knowledge.", "confidence": "CHECK on C. The grace period depends on the guideline version (2 weeks in older guidance, up to 4 weeks in newer WHO guidance). Both cover a 7-day delay. If the local guideline requires excluding pregnancy first, the answer would be D. Best answer is C.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 23, "batch": "B23 Q18", "file": "B23", "paperNo": 18, "topic": "Maternal death notification criteria", "type": "SBA", "theme": 2, "stem": "Which of the following best describes the notification criteria for maternal deaths in Sri Lanka? Death of a women while pregnant or within", "options": {"A": "42 days of termination of pregnancy not due to accidental causes", "B": "42 days of termination of pregnancy not due to obstetric causes", "C": "42 days of termination of pregnancy irrespective of cause of death", "D": "1 year of termination of pregnancy irrespective of cause of death", "E": "1 year of termination of pregnancy not due to accidental causes"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lecture says all deaths of women aged 15-49 years during pregnancy and up to one year after termination should be notified to the FHB, irrespective of cause. C is the \"pregnancy related death\" definition, which is not the notification rule. A, B and E restrict by cause, which is wrong for notification. The stem has the typo \"a women\".", "source": "08 Maternal Mortality, \"Maternal Death Investigation\" slide (notification), with the Pregnancy related Death and Maternal Death definition slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true, "printedAlso": ["B24 Q16"]}, {"id": 24, "batch": "B23 Q19", "file": "B23", "paperNo": 19, "topic": "Family planning advice, previous caesareans", "type": "SBA", "theme": 2, "stem": "A 35 years old female who lost her husband 5 years ago in a RTA and has 3 children aged 10, 9, and 6 years has just married for the second time. The second and third children of her previous marriage were delivered by Caesarean section. The couple is considering delaying another pregnancy by 2 years. The couple has consulted you on advise regarding family planning. What advise would you give to the couple?", "options": {"A": "Discuss the advantages and disadvantages of delaying a pregnancy and advising the couple not to have another child", "B": "Discuss the advantages and disadvantages of delaying a pregnancy and advising the couple to use a temporary barrier method", "C": "Discuss the advantages and disadvantages of having another child and dissuading / discouraging the couple from having another child", "D": "Discuss the advantages and disadvantages of having another child and advising on having another child as earlier as possible", "E": "Discuss the advantages and disadvantages of having another child and allow the couple to decide on the best possible alternative"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lecture describes FP counselling as an interactive process that helps clients make informed decisions and choose voluntarily, involving the partner. The goal is a desired number of children with optimal spacing. E is the only non-directive option. A, B, C and D each steer the couple, and D (conceive early after two caesareans) also ignores the risk of a short interval. The stem has the typos \"advise\" (noun) and \"as earlier as possible\".", "source": "Family Planning Services in Sri Lanka_Batch 34, Goal slide and \"Counselling in FP services\" slides (informed, voluntary choice; involve spouse).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 25, "batch": "B23 Q20", "file": "B23", "paperNo": 20, "topic": "Hazard definition", "type": "SBA", "theme": 6, "stem": "How best could the term “hazard” be described in relation to a pesticide producing factory?", "options": {"A": "It is the potential of any substance / agent / situation in the factory to cause harm, injury, or death", "B": "It is the likelihood that a toxic substance in the factory may cause harm, injury, or death", "C": "It is the likelihood that physical agent in the factory may cause harm, injury, or death", "D": "It is the potential of the pesticide produced to cause harm, injury, or death", "E": "It is the risk of getting exposed to the pesticide that is produced"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture defines a hazard as anything with the potential to cause harm or adverse health effects, including injury or death, so A is correct. B and C are wrong because \"likelihood\" describes risk, not hazard. D is too narrow because it limits the hazard to the pesticide, while the hazard covers any agent or situation in the factory.", "source": "Occupational Health-introduction lecture, \"Hazard Vs Risk\" slide.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 26, "batch": "B23 Q21", "file": "B23", "paperNo": 21, "topic": "Healthy worker effect", "type": "SBA", "theme": 6, "stem": "“Healthy worker effect” may best be described as…", "options": {"A": "Overall effect of those workers who are healthier among a given job category", "B": "Working people are overall more healthier than the general population", "C": "Healthy workers have a better access to health care services", "D": "Healthy workers have a better impact on their work capacity", "E": "Healthy workers are at less risk of injury"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture explains that healthy people are recruited and keep working, so the working population is healthier than the general population, which is B (the paper prints these options without letters, so A to E are assigned by position). A is wrong because the effect compares workers with the general population, not workers within one job category.", "source": "Occupational Health-introduction lecture, \"Healthy worker effect\" slide.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 27, "batch": "B23 Q23", "file": "B23", "paperNo": 23, "topic": "Working mother, complementary feeding at 4 months", "type": "SBA", "theme": 4, "stem": "A 4 months old infant with normal growth curve has been brought to the CWC in Ragama for routine immunisation. The mother is planning to report back to work in Colombo in one week and seeks advice on complementary feeding. The best plan of management of this infant is to…", "options": {"A": "Continue breast feeding with expressed breast milk and initiate complementary feeding at the completion of 4 and 1/2 months", "B": "Start formula feeding with the advice of a paediatrician and start complementary feeding at the completion of 6 months", "C": "Continue breast feeding with expressed breast milk and review growth at 5 months to add formula feeds until initiating complementary feeding at the completion of 6 months", "D": "Continue breast feeding with expressed breast milk and review growth at 5 months to decide on the time of initiating complementary feeding", "E": "Continue breast feeding with expressed breast milk and review growth at 6 months before initiating complementary feeding"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The guideline recommends exclusive breastfeeding to 6 months (180 days) and says employed mothers should be supported to express milk. Expressed milk keeps for 8 hours at room temperature, 24 hours in the fridge and 3 months in the freezer, and is fed by cup. Complementary feeding must never start before 4 months (120 days). After 120 days it is allowed only if growth falters despite correct breastfeeding with no illness, or if the mother is away for long periods and cannot express or store milk. This infant has normal growth, so A is wrong. B and C bring in formula, whereas the guideline discourages feeding bottles. D keeps expressed breast milk and uses a growth review at 5 months to decide, which fits the 120-day exception better than E.", "source": "Guidelines on Infant and Young Child Feeding, sections 1 and 2; infant feeding - commed (national recommendations, \"introducing CF earlier than 6 months\" slide); 09-infant feeding (reasons for stopping EBF, need to return to work).", "confidence": "CHECK on E. E is the default \"wait until 6 months\" plan and could be argued as the best answer. D is preferred because it builds in the guideline's early-start conditions. Best answer is D.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "InfFeed", "atName": "Infant feeding practice", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 28, "batch": "B23 Q25", "file": "B23", "paperNo": 25, "topic": "Delays in a maternal death", "type": "SBA", "theme": 2, "stem": "Pregnant woman in her second pregnancy presented with pains arising at night. But she decided not to get to hospital which is 5 km away due to lack of caregiver to her 3 years old child. Then she delivered at home and had fever. She went to the hospital on the 5th day after post partum. She died immediately after admitted to the hospital. According to the case, what is / are the delay(s) involving in this maternal death?", "options": {"A": "1st delay", "B": "2nd delay", "C": "3rd delay", "D": "1st and 2nd delays", "E": "1st and 3rd delays"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture says maternal deaths are reviewed with the three-delay model (seeking, reaching, treating). The woman decided not to go because nobody could look after her child, then waited until day 5 despite fever. That is the first delay, in deciding to seek care. Nothing shows a transport or distance barrier stopped her once she decided, so the second delay is not shown. Nothing about the quality of care on arrival is given, so the third delay is not shown either.", "source": "08 Maternal Mortality, \"Maternal Death Investigation\" slide (three-delay model). The detailed definition of each delay is standard knowledge.", "confidence": "CHECK on D. The \"5 km away\" detail could be read as a distance (2nd) delay. Best answer is A.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 29, "batch": "B24 Q1", "file": "B24", "paperNo": 1, "topic": "Practice of evidence based medicine", "type": "MTF", "theme": 7, "stem": "Which of the following is are true / false regarding the practice of evidence based medicine?", "options": {"A": "Patient management depends on the availability of researches", "B": "Patient management depends on the clinical expertise", "C": "Systematic reviews are helpful", "D": "Uses current best evidence in making clinical decisions", "E": "Uses patient's values in making clinical decisions"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture's core principles are best research evidence, clinical expertise and patient values, so B, D and E are True. Systematic reviews and meta-analyses are the strongest evidence and the review calls them important for practising clinicians (C True). EBM uses the best available evidence, which may not be the best form of evidence, so management does not depend on research being available (A False; the paper's typos are \"is are\" and \"researches\").", "source": "EBM powerpoint (Prof Kasturiratne), Introduction, Core principles, Steps of practice and Challenges slides; EBM for medical students (Diao et al., UBCMJ 2009), EBM in Practice and Challenges Facing EBM sections.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "EBM", "atName": "Evidence based medicine", "atCat": "EBM", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 30, "batch": "B24 Q2", "file": "B24", "paperNo": 2, "topic": "Factory under Factories Ordinance", "type": "MTF", "theme": 6, "stem": "Which of the following can be considered as a “factory” under the Factories ordinance?", "options": {"A": "Bakery", "B": "Construction site", "C": "Laundry", "D": "Retail shop", "E": "Warehouse"}, "answer": {"A": true, "B": false, "C": true, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The legislation lecture defines a factory as premises where persons are employed in manual labour for trade or gain in making, repairing, ornamenting, finishing, washing, cleaning or adapting for sale of any article. A bakery (making) and a laundry (washing) fit that wording. A retail shop, a warehouse (storage only) and a construction site do not, although Part VIII of the Ordinance extends some provisions to other premises (the slide gives only the heading).", "source": "Occupational safety & health legislature lectures (both files, read by OCR from the slide images), slide \"What is a factory?\" and the Part VIII heading.", "confidence": "CHECK on B and E. The lecture gives only the definition and the heading of Part VIII, so construction sites and warehouses may be covered by the extensions. Best answer is B False, E False.", "check": true, "checkLetters": ["A", "B", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "OccLaw", "atName": "Occupational safety and health legislation", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 31, "batch": "B24 Q3", "file": "B24", "paperNo": 3, "topic": "Notifiable industrial diseases", "type": "MTF", "theme": 6, "stem": "Which of the following should be notified as industrial disease?", "options": {"A": "Anaemia in a worker in a battery manufacturing industry", "B": "Asbestosis in an asbestos manufacturing plant worker", "C": "Backache in a manual labourer in a cement factory", "D": "Chronic bronchitis in a mushroom farmer", "E": "Contact dermatitis by Textile in a cutter in a garment factory"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture's Schedule III lists anthrax, compressed air illness, lead tetra-ethyl and nitrous fumes poisoning, arsenical poisoning, chrome ulceration and lead poisoning, including manufacture and repair of electric accumulators (batteries). Anaemia in a battery worker is a sequela of lead poisoning, so A is True. Asbestosis, backache, chronic bronchitis in a mushroom farmer and contact dermatitis are not in the lecture's schedule, so B, C, D and E are False on the lecture.", "source": "Occupational safety & health legislature lectures (both files, read by OCR from the slide images), Schedule III Occupational diseases (Parts A and B) and section 63 (doctor's notice of lead, phosphorus, arsenical, mercurial poisoning and anthrax).", "confidence": "CHECK on B and E. Asbestosis and occupational dermatitis may appear in a fuller national schedule, but the lecture's list does not include them. Best answer is B False, E False.", "check": true, "checkLetters": ["A", "B", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 32, "batch": "B24 Q4", "file": "B24", "paperNo": 4, "topic": "STI", "type": "MTF", "theme": 9, "stem": "True / False regarding Sexually transmitted infections (STI)…", "options": {"A": "Herpes simplex infection is the most common STI in Sri Lanka", "B": "STI enhances the risk of HIV", "C": "They should be notified to the MOH in the area", "D": "Syndromic management depends on the clinical diagnosis", "E": "All pregnant mothers should undergo VDRL test"}, "answer": {"A": false, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "STIs that cause genital ulcers or discharge increase the risk of acquiring and transmitting HIV (standard knowledge). Syndromic management is based on the clinical syndrome without waiting for laboratory results. Syphilis screening (VDRL) is a routine part of antenatal care. STIs are managed confidentially in STD clinics and are not notified to the area MOH, and I am not sure herpes is the commonest STI here.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on A. The commonest STI in Sri Lanka is not in any lecture, and I could not confirm it from the project files. Best answer is False.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 33, "batch": "B24 Q5", "file": "B24", "paperNo": 5, "topic": "CBR, CDR and age-specific death rates", "type": "MTF", "theme": 3, "stem": "Which of the following is / are true?", "options": {"A": "Crude birth rate is a good measure to compare the health status of two countries", "B": "Crude birth rate of Sri Lanka is expected to increase in the near future", "C": "Crude death rate in developed countries is generally lower than the crude death rate in developing countries", "D": "Health status in different countries can be compared using age specific crude death rates", "E": "Age specific death rates increase with increasing age"}, "answer": {"A": false, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "This is the same idea as Q11 with reworded options, so I answered it separately and kept the answers consistent. A: the fertility lecture says CBR cannot compare populations because age-sex structures differ, and it is not a true measure of fertility. B: births are falling and the population is ageing. C: the mortality lecture says the crude death rate depends on age-sex structure, so crude comparisons between countries mislead. D: age-specific rates remove that structure effect, though \"age specific crude death rates\" mixes two terms (the printed text also drops the \"fi\" ligature in \"specific\"). E is standard knowledge: death rates rise with age after childhood, but infants have higher rates than children.", "source": "06-Measures of Fertility, Crude Birth Rate slide; 07-Measures of Mortality, Crude Death Rate and Mortality Rates slides; Demographic transition (Dr Nazeer), Sri Lanka slide.", "confidence": "CHECK on C, D and E. C: the transition lecture implies lower death rates with development, the mortality lecture says crude rates cannot be compared. D: the lecture does not say outright that age-specific rates allow comparison. E: not in the lectures (standard knowledge). Best answer is C False, D True, E True.", "check": true, "checkLetters": ["A", "C", "D", "E"], "otherDiffers": "The Dr Nazeer demographic transition lecture describes low death rates in stage 3 and 4 (developed) countries, which could be read as C True. I followed the mortality lecture's point about age structure. CHECK.", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": ["Fert"], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 34, "batch": "B24 Q6", "file": "B24", "paperNo": 6, "topic": "PHM and 15-year-old living with boyfriend", "type": "MTF", "theme": 5, "stem": "A PHM encounters a 15 years old girl living together with her boyfriend. What should be her next step?", "options": {"A": "Inform women and children desk at the police station", "B": "Locate her parents / guardian and inform them", "C": "Make a complaint to the national protection authority", "D": "Arrange suitable family planning methods", "E": "Register her in Eligible family register"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The ANC and PNC lecture defines an eligible family as a couple in union (including living together) with a female aged 15 to 49, and also counts a couple in union even if the female is under 15, so E is true. The adolescent lecture stresses confidentiality and legal frameworks that protect adolescents. Sexual activity with a girl under 16 is a child protection matter in Sri Lanka, so safeguarding steps (informing the guardian, reporting to the police women and children's desk and the National Child Protection Authority) are standard knowledge. Family planning provision to the registered couple is also appropriate, though it is not the first priority.", "source": "02-ANC and PNC revised, \"What is an Eligible family?\" slide; 05-Adolescent health narrated, \"Ethics and adolescent health\" slide. Options A to D: standard knowledge.", "confidence": "CHECK on A, B, C and D. The lectures do not give the reporting steps for a 15-year-old, and the legal age and reporting route should be confirmed. Best answer is True for each.", "check": true, "checkLetters": ["A", "B", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 35, "batch": "B24 Q7", "file": "B24", "paperNo": 7, "topic": "Family planning table", "type": "MTF", "theme": 2, "stem": "28 years old female with three living children comes to the field family planning clinic seeking family planning advice. Her youngest child is 18 months of age. Which family planning method would be suitable options to be obtained from the field clinic?", "options": {"A": "DMPA injection", "B": "Emergency contraceptive pills", "C": "Female condoms", "D": "IUCD", "E": "Male condoms"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Table 1 (supplied from the paper) lists the point of service delivery. Condoms are at community level and above, and emergency contraceptive pills are at community level and above, so B and E are true. IUD and implants are at field clinics (PMCU) and above, so D is true. DMPA is given at a clinic with a trained MO and an emergency tray, which a field clinic run by the MOH can provide, so A is true. Female condoms are not listed in the table or the lecture, so C is false.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Family Planning (FP) Services in Sri Lanka\" slide. Table 1, National Family Planning Programme Review 2016, as printed in B24 Q7.", "confidence": "CHECK on A and C. A depends on the field clinic having an MO and an emergency tray. C is false only because female condoms are absent from the table. Best answer is A True, C False.", "check": true, "checkLetters": ["A", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "note": "Table 1 (National Family Planning Programme Review 2016) is printed in the paper and is not shown here.", "scored": true}, {"id": 36, "batch": "B24 Q8", "file": "B24", "paperNo": 8, "topic": "Working mother continuing breastfeeding after maternity leave", "type": "MTF", "theme": 4, "stem": "Of the following, what is / are the most suitable options for a working mother to continue breast feeding at the completion of her maternity leave in 4 months?", "options": {"A": "Breast feed whenever possible and start complementary feeding at 4 months", "B": "Breast feed whenever possible and use expressed milk in her absence", "C": "Breast feed whenever possible and formula feed in her absence", "D": "Gradually change to formula feed aiming changing to complementary feeding after 6 months", "E": "Obtain additional leave and continue exclusive breast feeding for 6 months"}, "answer": {"A": false, "B": true, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture and guideline say employed mothers should be encouraged to express breast milk, so B is true. Formula (C, D) and feeding bottles are discouraged. Complementary feeding before 6 months is allowed only after 120 days and only if growth falters or the mother cannot express or store milk, so A is not a general option. E fits the national policy of exclusive breastfeeding for 6 months. The public-sector maternity leave slide gives 84 working days on full pay, then 84 on half pay and 84 unpaid. This is consistent with Q27, where complementary feeding at 4 to 4.5 months was rejected for an infant with normal growth.", "source": "infant feeding - commed (\"Maintenance of breastfeeding with complementary feeding\"); Guidelines on Infant and Young Child Feeding, sections 1 and 2; 09-infant feeding (workplace and employment maternity benefits slide).", "confidence": "CHECK on A and E. A is true only under the guideline's conditions, which the stem does not state. E depends on leave being available, and the lecture slide gives extra leave only for the public sector. Best answer is A False, E True.", "check": true, "checkLetters": ["A", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "InfFeed", "atName": "Infant feeding practice", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 37, "batch": "B24 Q9", "file": "B24", "paperNo": 9, "topic": "Mental health promotion in children", "type": "MTF", "theme": 5, "stem": "Regarding the promotion of mental health in children…", "options": {"A": "Advice child on avoiding conflicts with peers", "B": "Encourage the child to enjoy nature", "C": "Engaging the child in the day to day activities", "D": "Responsive interactions with pre-school child", "E": "Teaching a child to obey elders"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture lists the elements of mental well-being as enthusiasm, variety of interest, ability to handle stress, self esteem, creativity, decision making and aesthetic appreciation. Enjoying nature (appreciating beauty in the physical world), day to day activities (variety of interest, everyday routines as playful learning) and responsive interactions (the ECD lecture's \"responsive, stimulating, caring adult\") fit these. Advising a child to avoid conflict or to obey elders is telling the child what to do, which goes against building coping, decision making and independence. The lecture says mentoring is not telling what to do and that parenting prepares a child for independence.", "source": "11-Mental Health Promotion batch32, slides on Elements of mental well-being, Parenting and Mentoring; 13 Early Childhood Development Batch 34, slides 11 and 18.", "confidence": "CHECK on A. The lecture does not mention peer conflict, so this is inferred from the emphasis on coping skills. Best answer is False. CHECK on E. The lecture does not mention obedience. Best answer is False.", "check": true, "checkLetters": ["A", "E"], "otherDiffers": "", "dupOf": null, "at": "MHChild", "atName": "Mental health promotion in childhood", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 38, "batch": "B24 Q10", "file": "B24", "paperNo": 10, "topic": "Household interventions against child undernutrition", "type": "MTF", "theme": 4, "stem": "Effective interventions to prevent child under nutrition at household level are…", "options": {"A": "Hand washing practices", "B": "Helping pregnant mothers in daily household chores", "C": "Prevention of indoor air pollution", "D": "Regular growth monitoring and weight measuring", "E": "Supplementing under-weight children with \"Thriposha\""}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The growth lecture lists hygiene and indoor air pollution among the factors that affect growth. The IYCF guideline requires hand washing before preparing food and before feeding, so A and C are true. The nutrition interventions lecture lists growth monitoring and promotion as an intervention against under-5 malnutrition, so D is true. Thriposha is given to children aged 6-59 months who are underweight (weight-for-age below -2SD) or have lost weight for 3 consecutive months, so E is true. For B, the lectures list optimal nutrition and special care for pregnant women to reduce low birth weight but not household chores. I took B as true because it reduces maternal workload (standard knowledge).", "source": "Growth and Growth Charts lecture (factors influencing growth, indoor air pollution); Nutrition intervention lecture (interventions for under-5 malnutrition, GMP, Thriposha criteria); Guidelines on Infant and Young Child Feeding, section 6.", "confidence": "CHECK on B. No lecture mentions helping pregnant mothers with chores, so this rests on standard knowledge. Best answer is B True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NutInterv", "atName": "Nutrition related interventions", "atCat": "Nutrition", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 39, "batch": "B24 Q11", "file": "B24", "paperNo": 11, "topic": "Best candidate for OCP", "type": "SBA", "theme": 2, "stem": "Of the following sexually active females, best candidate for OCP is…", "options": {"A": "A 17 years old school going child", "B": "A 23 years old female with 2 month old child", "C": "A 25 years old female with BMI of 31 kg/m2", "D": "A 35 years old female with migraine", "E": "A 46 years old female with 5 children"}, "answer": "A", "prov": null, "cannot": false, "explanation": "Under WHO eligibility criteria, a healthy woman from menarche to age 40 has no restriction on combined pills, so A has no medical contraindication. B is unclear because the answer depends on whether she is breastfeeding. C (BMI 31) is a relative caution. D could be contraindicated if the migraine has aura. E is over 40 and has completed her family, so a permanent method is the better option.", "source": "No lecture in project covers the content. The Family Planning lecture only names the WHO Medical Eligibility Criteria (5th Ed. 2015) and defers details to PBL sessions. The category details are standard knowledge.", "confidence": "CHECK on A. The eligibility details are not in the lecture, and the programme enrols women in union, so a 17-year-old school child may not fit the national eligibility rule. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 40, "batch": "B24 Q12", "file": "B24", "paperNo": 12, "topic": "Contraception in hypertension", "type": "SBA", "theme": 2, "stem": "A 35 years old married female was diagnosed to be of moderate hypertension (150 / 100 mmHg) by her GP. Most appropriate contraceptive method is…", "options": {"A": "COCP"
