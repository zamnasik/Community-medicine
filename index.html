, Overview and \"What is GBV?\" slides.", "confidence": "CHECK on A. The lecture's first definition is gender-neutral (\"a person\"), while option A names women only. Best answer is A. It is still the closest of the five options.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 93, "batch": "B27 Q15", "file": "B27", "paperNo": 15, "topic": "Siderosis", "type": "SBA", "theme": 6, "stem": "Siderosis is caused by the exposure to dust of…", "options": {"A": "Silica", "B": "Asbestos", "C": "Bauxite", "D": "Iron", "E": "Cotton"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lecture pairs inorganic dusts with their diseases, and iron dust causes siderosis. A, B and E are wrong because silica causes silicosis, asbestos causes asbestosis, and cotton causes byssinosis (standard knowledge for cotton, as the lecture lists only cane fibre and hay or grain fibre).", "source": "Occupational Diseases lecture, \"Diseases due to exposure to chemicals\" slide (inorganic dust: iron – siderosis; silica – silicosis; asbestos – asbestosis).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 94, "batch": "B27 Q16", "file": "B27", "paperNo": 16, "topic": "Occupational history", "type": "SBA", "theme": 6, "stem": "Which of the following is not a component of the occupational history?", "options": {"A": "Presence of symptoms when he is away from working place", "B": "Family members having similar illness / symptoms", "C": "Hours of work", "D": "Domestic exposure", "E": "Using of protective methods"}, "answer": "B", "prov": null, "cannot": false, "explanation": "The lecture's occupational history includes hours of work or shift work, domestic exposure, the relationship of illness to time away from work, and use of personal protective equipment (E's \"Using of protective methods\" is a wording slip for \"Use of protective methods\"). It asks about similar illness in other workers, not in family members, so B is the one that is not a component.", "source": "Occupational Diseases lecture, \"Occupational history\" and \"Additional information\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 95, "batch": "B27 Q17", "file": "B27", "paperNo": 17, "topic": "Blue gum lines", "type": "SBA", "theme": 6, "stem": "Blue lines in gums are seen in…", "options": {"A": "Arsenic poisoning", "B": "Chronic organophosphate pesticide poisoning", "C": "Lead poisoning", "D": "Mercury poisoning", "E": "Coal worker’s pneumoconiosis"}, "answer": "C", "prov": null, "cannot": false, "explanation": "Blue lines on the gums (Burton's line) are a classic sign of chronic lead poisoning (standard knowledge; the lecture lists lead poisoning under metals but does not describe this sign). A and D are wrong because arsenic and mercury poisoning cause other features, and E is a dust disease of the lungs.", "source": "Occupational Diseases lecture, \"Diseases due to exposure to chemicals\" slide (metals: lead, mercury, arsenic, cadmium). The gum sign itself is standard knowledge.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "part", "accepted": true, "scored": true}, {"id": 96, "batch": "B27 Q18", "file": "B27", "paperNo": 18, "topic": "Sri Lanka demographic transition, past five decades", "type": "SBA", "theme": 3, "stem": "During the past five decades of demographic transition of Sri Lanka…", "options": {"A": "Crude birth rate has increased", "B": "Maternal mortality rate has increased", "C": "The population growth rate has increased", "D": "The infant mortality rate has increased", "E": "Crude death rate has decreased"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lecture shows birth rates falling sharply, so A and C are wrong. Mortality fell, with higher survival and life expectancy, and the lecture's natural-increase chart shows the death rate falling to about 6 per 1000 and staying low, so E is right. B and D describe maternal and infant mortality, which fell as health care improved (the infant mortality chart in the mortality lecture covers 1995-2017). One caveat: the Dr Nazeer slide notes annual deaths are rising as the population ages, so recent crude rates have crept up from the low point.", "source": "Demographic transition (Dr Nazeer), \"Where is Sri Lanka today?\"; Demographic transition (Prof Kasturiratne), change in mortality and fertility slides; 07-Measures of Mortality, Natural increase chart (1936-2001) and Infant Mortality Rate slides.", "confidence": "CHECK on E. Over five decades the crude death rate fell overall, but the lecture's rising annual deaths could make a reader doubt it. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 97, "batch": "B27 Q19", "file": "B27", "paperNo": 19, "topic": "Mortality indices and denominators", "type": "MTF", "theme": 3, "stem": "Which of the following indices are correctly matched with the denominator?", "options": {"A": "Infant mortality rate - Number of live births per year", "B": "Maternal mortality rate - Number of deaths of mothers in 15 - 49 years of age", "C": "Perinatal mortality rate - Abortion within 22 weeks of gestational age is also considered", "D": "Total mortality rate - Number of live births per year"}, "answer": {"A": true, "B": false, "C": false, "D": false}, "prov": null, "cannot": false, "explanation": "Lecture formula: IMR = deaths of children under 1 year in a year ÷ live births in the same year × 1000, so A is right. The crude death rate is deaths in a year ÷ mid-year population × 1000, so a death rate with live births as denominator (D) is wrong, and \"total mortality rate\" is not a lecture term. B: the maternal mortality lecture is not extractable here, and standard knowledge puts women of reproductive age in the denominator, but the option describes a count of deaths, not a denominator. C describes numerator scope, not a denominator, and the lecture says the perinatal period starts at 22 completed weeks, so earlier abortions are excluded.", "source": "07-Measures of Mortality, Crude Death Rate, Mortality Rates in children <1 year and Perinatal Deaths slides. B: standard knowledge.", "confidence": "CHECK on B and D. B: no lecture text covers the maternal mortality denominator. D: \"total mortality rate\" is not defined in the lectures. Best answer is B False, D False.", "check": true, "checkLetters": ["A", "B", "D"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 98, "batch": "B27 Q20", "file": "B27", "paperNo": 20, "topic": "Incorrect statement on GBV", "type": "SBA", "theme": 5, "stem": "Which is incorrect regarding gender based violence (GBV)?", "options": {"A": "GBV is a public health concern in Sri Lanka", "B": "Multi-stakeholder approach is needed", "C": "Alcohol is a main determinant", "D": "Health impact is more important than socio-economic impact", "E": "Legal services are provided free of charge by the government"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lecture reports that 1 in 4 women in Sri Lanka are affected and lists health consequences (A). Its prevention measures (social norms, gender inequality, sexuality education, policy and legislation) need several sectors working together (B). It lists short-term health impacts and long-term educational, economic and development impacts side by side without ranking them, so the claim in D is unsupported and is the incorrect statement. The lecture says nothing on alcohol or free legal services, so C and E are taken as standard knowledge.", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne), Prevalence, \"Impact of GBV\" and Prevention slides. Options C and E: standard knowledge.", "confidence": "CHECK on D. The lecture never ranks health against socio-economic impact, and \"main determinant\" in C could also be the intended incorrect statement. Best answer is D. This is consistent with Q9, where alcohol was kept as a contributing factor.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 99, "batch": "B27 Q21", "file": "B27", "paperNo": 21, "topic": "Best indicator of country health status", "type": "SBA", "theme": 3, "stem": "Which of the following is the best indicator of health status of a country?", "options": {"A": "Birth rate", "B": "Infant mortality rate", "C": "Crude birth rate", "D": "Proportional mortality rate", "E": "Life expectancy at birth"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lectures do not rank indicators, but the mortality lecture lists life expectancy among the uses of mortality data. Life expectancy at birth summarises mortality at all ages. A and C are fertility measures, and D shows the cause pattern (burden of disease), not the level of health. B is the strongest alternative, but it covers only the first year of life. Same idea as Q78, where the best answer is also life expectancy at birth.", "source": "07-Measures of Mortality, Uses of mortality data and Proportionate Mortality Rate slides; ranking is standard knowledge.", "confidence": "CHECK on B. No lecture names the best indicator, and infant mortality is also widely cited. Best answer is E.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "MortMeas", "atName": "Measures of mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 100, "batch": "B27 Q22", "file": "B27", "paperNo": 22, "topic": "Stage 4 demographic transition", "type": "MTF", "theme": 3, "stem": "Which of the following is true / false regarding stage 4 demographic transition?", "options": {"A": "Decrease in crude birth rate", "B": "Decrease in child dependancy ratio", "C": "Increase in elderly dependancy ratio", "D": "Increase in median age of the population", "E": "Decrease in population growth rate"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture describes Stage 4 (low stationary) as birth and death rates both low, a steady population, fewer children, a much smaller base of young people and many more elderly. That gives a lower birth rate (A), a lower child dependency ratio (B), a higher elderly dependency ratio (C) and slower growth (E). Dependency ratio = (0-14 years + >64 years) ÷ 15-64 years, so a smaller young share and a larger elderly share move its two parts in opposite directions. The implications slide says an ageing population in Stage 4 brings labour shortages and more pressure on social security. D follows from the ageing described, but median age is not named in the lectures. The printed \"dependancy\" is a typo for \"dependency\".", "source": "Demographic transition (Dr Nazneen Nazeer), Stage 3 and Stage 4 slides, Implications slide and Demographic Dividend slide (dependency ratio formula).", "confidence": "CHECK on D. Median age is not in the lectures (standard knowledge), and A and E are \"decrease\" relative to Stage 3. Best answer is all True.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 101, "batch": "B27 Q23", "file": "B27", "paperNo": 23, "topic": "Poisoning prevention in preschoolers", "type": "SBA", "theme": 7, "stem": "What is the method with best impact to prevent accidental poisoning in pre-school children?", "options": {"A": "Replacing agrochemicals in use with less toxic alternatives", "B": "Restrict the sale of use of agrochemicals", "C": "Safe / better storage of drugs / chemicals at home", "D": "Teach mothers of pre-school children about first-aid in poisoning", "E": "Teach pre-school children about the dangers of chemicals and pesticides"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The lecture's household poisoning slide gives safe storage of chemicals and drugs, proper labelling and educating family members as the preventive measures. Storing them out of reach is a passive measure that works without relying on a young child's behaviour, so E is weaker. First aid (D) helps only after poisoning has happened. A and B are policy options that the lecture does not cover.", "source": "Prevention of Accidents lecture, \"Common household accidents in children: Poisoning\" slide.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "Accid", "atName": "Prevention of accidents", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 102, "batch": "B27 Q24", "file": "B27", "paperNo": 24, "topic": "Commonest gateway substance", "type": "SBA", "theme": 7, "stem": "Out of the following, what is the most common gate-way for substances around the globe?", "options": {"A": "Alcohol", "B": "Tobacco", "C": "Cannabis", "D": "Heroin", "E": "Cocaine"}, "answer": "A", "prov": null, "cannot": false, "explanation": "Alcohol is the most widely used psychoactive substance and is commonly the first one tried, which is why it is the usual \"gateway\" answer. Tobacco (B) is the main competing option. Cannabis, heroin and cocaine usually come later in the progression.", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on B. There is no substance-use lecture, and tobacco is also described as a gateway substance. Best answer is A.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "Subst", "atName": "Substance use", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 103, "batch": "B27 Q25", "file": "B27", "paperNo": 25, "topic": "Cannabis adverse effects and control", "type": "SBA", "theme": 7, "stem": "What statement is NOT true about the adverse effects and control of cannabis?", "options": {"A": "Industries are largely funded by Tobacco companies", "B": "Causes psychosis and mental problems", "C": "Causes sudden death in young users", "D": "At least 10 countries have legalised its use", "E": "Legalised countries have reported higher rates of cannabis related accidents"}, "answer": "A", "prov": null, "cannot": false, "explanation": "Cannabis use is linked to psychosis and mental health problems (B), to cardiovascular events including sudden death in young users (C), and to more cannabis-related accidents where it has been legalised (E). Tobacco companies have invested in cannabis, but \"largely funded by\" overstates this, so A is the best \"NOT true\" statement. D depends on whether medicinal legalisation is counted, since more than 10 countries allow medicinal use.", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on A and D. There is no lecture, and D is true or false depending on whether medicinal or recreational legalisation is meant. Best answer is A.", "check": true, "checkLetters": ["A", "D"], "otherDiffers": "", "dupOf": null, "at": "Subst", "atName": "Substance use", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 104, "batch": "B29 Q1", "file": "B29", "paperNo": 1, "topic": "Work-related diseases", "type": "MTF", "theme": 6, "stem": "Work related diseases,", "options": {"A": "Found mainly in the community", "B": "Cause specific", "C": "Exposure to work is necessary", "D": "May be notifiable", "E": "May be compensable"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture defines work-related diseases as diseases wholly or partly caused, or aggravated, by working conditions, with multiple causes where work is only one risk factor. So B (cause specific) and C (work exposure necessary) are False, since a specific agent and a necessary exposure define occupational diseases. Because work is only one of several causes, these diseases also occur widely in the general community, so A is True (standard knowledge). D and E are taken as False because notification and compensation attach to scheduled occupational diseases, though \"may\" makes them debatable (standard knowledge; legislation lectures unreadable).", "source": "Occupational Diseases lecture, \"Occupational or work-related?\" and \"Occupational diseases\" slides. The point on notification and compensation is standard knowledge.", "confidence": "CHECK on A, D and E. The lecture does not say where work-related diseases are found or whether they can be notifiable or compensable, and the \"may\" wording in D and E is ambiguous. Best answer is A True, D False, E False.", "check": true, "checkLetters": ["A", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "OccDis", "atName": "Occupational diseases", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 105, "batch": "B29 Q2", "file": "B29", "paperNo": 2, "topic": "COVID-19 outbreaks in workplace", "type": "MTF", "theme": 6, "stem": "Which of the following were the reasons for CoVID-19 outbreaks in a workplace?", "options": {"A": "Providing common transport to workers", "B": "Good ventilation in factories", "C": "Strictly enforcing CoVID-19 prevention precautions", "D": "Not having staggered lunch breaks for workers", "E": "Encouraging workers to report for work when they are sick"}, "answer": {"A": true, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Shared transport, unstaggered lunch breaks and pressure on sick workers to attend all increase close contact and spread, so A, D and E are True (standard knowledge). Good ventilation and strictly enforced precautions reduce spread, so B and C are False.", "source": "No lecture in project covers workplace COVID-19 outbreaks. The Emerging and Re-emerging Infectious Diseases lecture has only the history of COVID-19 in Sri Lanka, and the four occupational lectures do not mention it. Answer is from standard knowledge.", "confidence": "CHECK on A to E. No lecture covers this, so every option rests on standard knowledge. Best answer is A True, B False, C False, D True, E True.", "check": true, "checkLetters": ["A", "B", "C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 106, "batch": "B29 Q3", "file": "B29", "paperNo": 3, "topic": "Imported malaria risk groups", "type": "MTF", "theme": 8, "stem": "Risk groups for imported malaria in Sri Lanka include…", "options": {"A": "Indian labourers working in Sri lanka", "B": "Persons residing in previously Malaria endemic areas", "C": "Pregnant females", "D": "Tourists", "E": "Security force engaged in peace keeping activities in other countries"}, "answer": {"A": true, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Imported malaria arises in people infected abroad, so the risk groups are those who come from or travel to endemic countries: foreign labourers (A), tourists (D) and troops on overseas peacekeeping duty (E) (standard knowledge). B is false because residents of previously endemic areas matter for local re-establishment, not importation. C is false because pregnancy makes malaria more severe but is not a route of importation. The lecture only lists malaria among the re-emerging diseases relevant to Sri Lanka and among diseases with epidemic potential.", "source": "No lecture in project covers the risk groups (Emerging and Re-emerging lecture, \"Re-emerging diseases\" slide, names malaria only). Standard knowledge.", "confidence": "CHECK on B. All options rest on standard knowledge, and B depends on reading \"imported\" strictly. Best answer is A True, B False, C False, D True, E True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 107, "batch": "B29 Q4", "file": "B29", "paperNo": 4, "topic": "Enteric fever", "type": "MTF", "theme": 8, "stem": "Which of the following is/are true/false regarding Enteric fever?", "options": {"A": "Caused by a group of organisms of Salmonella", "B": "Those who get the disease are always symptomatic", "C": "Monitoring and vaccination of food-handlers is an important preventive measure", "D": "It is a water-borne vector disease", "E": "Vaccination is recommended to the travellers to endemic areas"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Enteric fever is caused by Salmonella Typhi and Paratyphi, so A is true, and infection can be subclinical or carried without symptoms, so B is false. It is a water- and food-borne disease, not vector-borne, so D is false, and typhoid vaccine is recommended for travellers to endemic areas, so E is true. C is false as written because food-handler screening is used but vaccination of food handlers is not a routine Sri Lankan measure (standard knowledge, uncertain).", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on C. The option joins monitoring with vaccination of food handlers, and no lecture settles it. Best answer is A True, B False, C False, D False, E True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 108, "batch": "B29 Q5", "file": "B29", "paperNo": 5, "topic": "Measles", "type": "MTF", "theme": 8, "stem": "True or False regarding Measles…", "options": {"A": "It spreads via direct contact", "B": "Can cause death or permanent disability", "C": "Is eliminated in Sri Lanka", "D": "Its efficacy around 70%", "E": "The first vaccine is given at one year of age"}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Measles spreads by respiratory droplets and direct contact with secretions, and it can cause death or permanent disability through pneumonia, encephalitis and SSPE, so A and B are true (standard knowledge). C is false because the lecture lists measles among the diseases re-emerging in Sri Lanka, which means it is back at a level that counts as a public health problem. D is false because the vaccine is far more effective than 70% (standard knowledge, roughly 85 to 95% after one dose and higher after two). E is true because the first MMR dose is given at 12 months (standard knowledge).", "source": "Emerging and Re-emerging Infectious Diseases lecture, \"Re-emerging diseases\" slide (measles listed) and the re-emerging disease definition. A, B, D and E are standard knowledge.", "confidence": "CHECK on C. The lecture only lists measles as re-emerging and does not state the current elimination status, so the best answer rests on that listing. Best answer is A True, B True, C False, D False, E True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 109, "batch": "B29 Q6", "file": "B29", "paperNo": 6, "topic": "Filariasis", "type": "MTF", "theme": 8, "stem": "Which of the following is/are true/false regarding Filariasis?", "options": {"A": "Entomological surveillance is considered as a control measure", "B": "It is notified via routine disease notification system", "C": "It is endemic throughout Sri Lanka", "D": "One of the targets under Sustainable Development Goal 3 is the elimination of deaths caused by filariasis by 2030", "E": "In the past five years, there has been a steady decline in the number of new lymphoedema cases"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Entomological surveillance and vector control are part of filariasis control, so A is true (standard knowledge). C is false because the disease was limited to certain districts and is now eliminated as a public health problem. D is false because the SDG lecture states the target as ending the epidemics of AIDS, TB, malaria and NTDs, not eliminating deaths from filariasis. B is false because cases are found through the filariasis campaign's own surveillance rather than the weekly notification card system, and E is true because new infections have fallen since transmission was interrupted (both standard knowledge, uncertain).", "source": "Sustainable Development Goals lecture, \"Health Targets by 2030\" slide (target 3), for D. Emerging and Re-emerging lecture lists filariasis as re-emerging in Sri Lanka only. A, B, C and E are standard knowledge.", "confidence": "CHECK on B. Notification status and the five-year trend in E are in no lecture. Best answer is A True, B False, C False, D False, E True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 110, "batch": "B29 Q7", "file": "B29", "paperNo": 7, "topic": "Dengue", "type": "MTF", "theme": 8, "stem": "True or false regarding Dengue…", "options": {"A": "Is a global pandemic", "B": "It is a significant cause of maternal mortality", "C": "Current control measures in Sri Lanka include vaccination", "D": "It is directly notified to Dengue Control Unit", "E": "Dengue is monitored under special surveillance of Epidemiology Unit"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture defines a pandemic as an epidemic that spreads across continents and lists dengue among the diseases with epidemic potential, so A is true on the lecture's own wording. B is false because dengue is not among the main causes of maternal death (standard knowledge). C is false because vaccination is not part of dengue control in Sri Lanka, and D is false because notification goes to the MOH of residence rather than directly to the Dengue Control Unit. E is true because the Epidemiology Unit runs special dengue surveillance (standard knowledge).", "source": "Emerging and Re-emerging Infectious Diseases lecture, \"COVID\" slide (pandemic definition), \"Top infectious diseases likely to cause epidemics\" slide (dengue) and \"Re-emerging diseases\" slide. B to E are standard knowledge.", "confidence": "CHECK on A. Dengue is usually called endemic or epidemic rather than a pandemic, and I followed the lecture's definition. Best answer is A True, B False, C False, D False, E True.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 111, "batch": "B29 Q8", "file": "B29", "paperNo": 8, "topic": "Gender based violence", "type": "MTF", "theme": 5, "stem": "True or false regarding Gender based violence (GBV)…", "options": {"A": "Can be eliminated by strict legislature", "B": "An emotional violence is not a case of GBV", "C": "GBV is unlikely in an absence of physical injury to face and genital areas", "D": "It is violent act that is directed against a woman because she is a woman", "E": "A woman can be a perpetrator"}, "answer": {"A": false, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture treats prevention as a combination of changing social norms, reducing gender inequality, sexuality education and policy and legislation, so legislation alone cannot eliminate GBV (A). It includes psychological harm and economic harm, so emotional violence counts (B), and GBV does not depend on a physical injury (C). D matches the definition used in Q92 (most GBV is violence against women because of their gender). The lecture says most GBV is by men, which implies women can also be perpetrators (E).", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne), Overview, \"What is GBV?\" and Prevention slides.", "confidence": "CHECK on D. The lecture's main definition says \"a person\", not \"a woman\". Best answer is True.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 112, "batch": "B29 Q9", "file": "B29", "paperNo": 9, "topic": "Reproductive health rights", "type": "MTF", "theme": 1, "stem": "Which of the following is/are true/false regarding reproductive health rights?", "options": {"A": "Contraceptives should be provided free to all the population", "B": "Accessibility to safe abortion practice is considered a right of a woman", "C": "Female genital mutilation is considered a violation of reproductive health rights", "D": "Right to reproduce is the least violated reproductive health right", "E": "Safe motherhood concept is a part of reproductive health rights"}, "answer": {"A": false, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture describes the right to access safe, effective, affordable and acceptable family planning, which is not the same as free for everyone, so A is false. The same \"Freedom\" slide lists contraception, safe abortion and safe motherhood, supporting B and E. C is standard knowledge: FGM violates reproductive rights. D is not covered in the lectures; it is judged true because the right to reproduce is rarely denied compared with access to contraception or safe abortion.", "source": "Reproductive Health Concepts_Batch33 (Reproductive Health 'Freedom' slide). C and D: standard knowledge, no lecture text.", "confidence": "CHECK on B, C and D. B rests on a slide label, and C and D are not in the lecture text. Best answer is B True, C True, D True.", "check": true, "checkLetters": ["A", "B", "C", "D"], "otherDiffers": "", "dupOf": null, "at": "RHC", "atName": "Reproductive health concepts", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 113, "batch": "B29 Q10", "file": "B29", "paperNo": 10, "topic": "Mental health promotion in children", "type": "MTF", "theme": 5, "stem": "Which of the following is/are true/false regarding mental health promotion in children?", "options": {"A": "Parenting plays a significant role", "B": "It is an expensive process to engage in", "C": "Needs the services of a Child Psychiatrist", "D": "Nutrition is a determinant of child mental health", "E": "Generates long standing consequences"}, "answer": {"A": true, "B": false, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture names parenting, mentoring and coaching in the home, preschool and school as the main ways to promote mental well-being, so A is true and a child psychiatrist is not required (C). The ECD lecture builds the brain through time with a responsive adult, play, reading and stories, which cost little (B). Both lectures call early childhood the foundation and say the quality of early experience shapes learning, health and behaviour throughout life (E). Nutrition is not covered in these lectures, so D is standard knowledge.", "source": "11-Mental Health Promotion batch32, slides on Early Childhood – The Foundation, Promoting Mental well-being and Parenting; 13 Early Childhood Development Batch 34, slides 6 to 11. Options B and D: standard knowledge.", "confidence": "CHECK on B. The lectures do not discuss cost. Best answer is False. CHECK on D. Nutrition as a determinant is not in the lectures. Best answer is True.", "check": true, "checkLetters": ["B", "D"], "otherDiffers": "", "dupOf": null, "at": "MHChild", "atName": "Mental health promotion in childhood", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 114, "batch": "B29 Q11", "file": "B29", "paperNo": 11, "topic": "Incorrect statement on infant and child feeding", "type": "SBA", "theme": 4, "stem": "Which of the following is incorrect regarding infant and child feeding?", "options": {"A": "Exclusive breast feeding should be established within one (01) hour after birth", "B": "If there is a growth faltering, complementary feeding can be started early with the medical advice", "C": "Even if an infant has an infection, breastfeeding should be continued", "D": "Oil / Butter should be added for every meal after six (06) months in order to meet the energy requirement", "E": "Adding salt to infant foods after six (06) months of age is recommended to familiarise the infant with family foods"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The guideline and lectures say to avoid adding sugar or salt in the first year, so E is incorrect. B is correct because complementary feeding can start after 120 days if growth falters despite correct breastfeeding and there is no illness. C is correct because breastfeeding and feeding continue during illness. D is correct because 1-2 teaspoons of oil, thick coconut milk or butter are added to raise energy density. A is loosely worded, since the policy is to initiate breastfeeding within 1 hour, but it is not the most incorrect statement.", "source": "Guidelines on Infant and Young Child Feeding (sections 1, 3, 4 and 9); infant feeding - commed (nutrient content in complementary feeding; national recommendations 3 and 10); Booklet on Complementary Feeding (page 2, no salt or sugar till 1 year).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "InfFeed", "atName": "Infant feeding practice", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 115, "batch": "B29 Q12", "file": "B29", "paperNo": 12, "topic": "School of 168 students, school health guidelines", "type": "SBA", "theme": 5, "stem": "Narangodapaluwa primary school has total 168 studying students from grades 1 to 5. Which of the following is a recommended activity under National school health programme guidelines?", "options": {"A": "Targeting grades 1 and 4 students for School medical inspection", "B": "Prohibiting food outlets in the vicinity that sell unhealthy foods", "C": "Organizing Mid day meal program for all the students", "D": "HPV vaccination for all grade 5 students", "E": "Establishment of a school health club with the help of academic staff"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lecture describes the School Health Club as an integral part of the school health programme, planned and run with teachers, students and parents, so E applies to every school. Schools with fewer than 200 children have all students examined, and only larger schools target grades 1, 4, 7 and 10, so A is wrong. HPV vaccine is given in grade 6, not grade 5 (D). The lecture has the PHI inspect food outlets around schools but does not prohibit them (B), and it does not describe a mid day meal for all students (C).", "source": "10 School Health Program Sri Lanka (Dr Gunathilake), SMI, Immunization and School Health Club slides; 10 School Health Programme final (Dr Pannala), SHC slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "SchHlth", "atName": "School health programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 116, "batch": "B29 Q13", "file": "B29", "paperNo": 13, "topic": "Adolescent risk-taking", "type": "SBA", "theme": 5, "stem": "Adolescents are prone to risk taking behaviour driven by inadequate decision-making related skills. Which of the following is the least contributory to this inadequacy?", "options": {"A": "Rapid physical growth", "B": "Still maturing frontal lobe", "C": "Unstable family environment", "D": "Early childhood development problems", "E": "Sexual maturation"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The lecture links poor decision making to the frontal lobe (reasoning, decision making, self-discipline) maturing later than the limbic system and amygdala, which drive emotion and reward, so B contributes. Development also depends on the family, peer and social environment (C), and the ECD lecture shows that early experiences set the foundation for later behaviour (D). Sexual maturation brings the hormonal and reward-system changes that go with risk taking (standard knowledge). Rapid physical growth is a somatic change with no direct link to decision-making skills, so it contributes least.", "source": "05-Adolescent health narrated, slides on Adolescent Development, \"Normal structure and function\", \"Why do adolescents behave the way they do?\" and Adolescent Development in a Social Context; 13 Early Childhood Development Batch 34, slides 6 to 7.", "confidence": "CHECK on A. The lecture does not rank the factors, and E (sexual maturation) is the nearest alternative. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 117, "batch": "B29 Q14", "file": "B29", "paperNo": 14, "topic": "Condition not screened in WWC", "type": "SBA", "theme": 1, "stem": "Which of the following condition is not screened in Well Women Clinic?", "options": {"A": "Hypertension", "B": "Cervical cancer", "C": "Obesity", "D": "Breast cancer", "E": "HIV"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The WWC screens for hypertension, BMI/nutritional status (obesity), cervical abnormalities and breast abnormalities. HIV is not a screening test there; it appears only in health education on preventing STIs including HIV. This is the same idea as Q75 with different options, and the answers are consistent (screened conditions are covered; the unscreened one is the answer).", "source": "14 WELL WOMAN CLINIC PROGRAMME Recorded (services provided and health education slides); 14 WWC (WWC Services slide).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "WWC", "atName": "Well Woman Clinic programme", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 118, "batch": "B29 Q15", "file": "B29", "paperNo": 15, "topic": "Delays matched to examples", "type": "SBA", "theme": 2, "stem": "Which of the following delays paired with maternal mortality correctly?", "options": {"A": "Waiting for husband to come home to go to the hospital - Delay in reaching", "B": "No fuel to reach the hospital - Delay in seeking", "C": "On call doctor not having fuel to come to the hospital - Delay in treating", "D": "Need to take a longer pathway due to a broken bridge - Delay in seeking", "E": "Elder villager saying her no need of going to the hospital - Delay in reaching"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The three-delay model has delay in seeking care (deciding), delay in reaching a facility (transport, distance, roads) and delay in treating (getting adequate care once there). C pairs a facility-side failure with the delay in treating. A and E are decision problems, so they are delays in seeking. B and D are transport or road problems, so they are delays in reaching. This fits Q28 and Q71.", "source": "08 Maternal Mortality, \"Maternal Death Investigation\" slide (three-delay model: seeking, reaching, treating). The definitions of each delay are standard knowledge.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "MatMort", "atName": "Maternal mortality", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": true, "scored": true}, {"id": 119, "batch": "B29 Q16", "file": "B29", "paperNo": 16, "topic": "Eligible family registration after marriage", "type": "SBA", "theme": 1, "stem": "Nimali, a 23 years old female gets married and moves to her husband village. The responsibility of registration in the eligible family register lies on…", "options": {"A": "Nimali", "B": "Nimali's husband", "C": "Both Nimali and her husband", "D": "Public Health Midwife of Nimali's village", "E": "Public Health Midwife of Nimali's husband's village"}, "answer": "E", "prov": null, "cannot": false, "explanation": "The lectures state that the PHM registers every eligible couple in the Eligible Family Register, so the couple does not register themselves (A, B and C are wrong). Nimali now lives in her husband's village, so the PHM of that area is the one who registers her; the PHM of her old village (D) no longer covers her.", "source": "02-ANC and PNC revised (Pre Pregnancy care; What is an Eligible family?). 02 Antenatal and Postnatal Care (Prof Anuradhini), Pre-pregnancy care (registration as eligible family by the PHM).", "confidence": "CHECK on E. The slides say the PHM registers but do not say that it is the PHM of the area of residence. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "RHC", "atName": "Reproductive health concepts", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 120, "batch": "B29 Q17", "file": "B29", "paperNo": 17, "topic": "Continuum of care, postnatal at parents' home", "type": "SBA", "theme": 1, "stem": "After one year, with the birth of her first child, Nimali went to live with her parents in her post natal period. Who is the responsible person for ensuring the continuum of care?", "options": {"A": "Nimali", "B": "Nimali's husband", "C": "Both Nimali and her husband", "D": "Public Health Midwife of Nimali's village", "E": "Public Health Midwife of Nimali's husband's village"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lecture says that if the mother shifts to another area after delivery, the MOH and PHM of the new area are notified to provide the necessary care. Nimali's parents live in her own original village, so the PHM there provides the postnatal visits. The PHM of the husband's village (E) is the one who must hand over, but is not the one visiting.", "source": "02-ANC and PNC revised (Post partum care at field: shifted to a different residential area).", "confidence": "CHECK on D. \"Responsible for ensuring the continuum of care\" could be read as the registering PHM, and \"Nimali's village\" is assumed to be her parents' village. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 121, "batch": "B29 Q18", "file": "B29", "paperNo": 18, "topic": "Contraception, no more children", "type": "SBA", "theme": 2, "stem": "At her post natal clinic visit, she stated she was not having any interest to have further children. What is the most appropriate contraceptive for her?", "options": {"A": "Female sterilization", "B": "Male sterilization", "C": "Oral contraceptive pill", "D": "Intrauterine device", "E": "Male condom"}, "answer": "D", "prov": null, "cannot": false, "explanation": "In Q16 and Q17 Nimali is 23, married, and has just had her first child. The lecture's sterilisation rule needs over 26 years with at least 2 living children (younger over 2 years), or under 26 with at least 3 living children and a spouse who insists. She meets neither, so A and B are not allowed. A highly effective, long-acting, non-hormonal method such as the IUCD suits a postnatal breastfeeding woman better than the combined pill (C) or condoms (E). This differs from Q73, where the 32-year-old with 2 children met the sterilisation criteria. Q16 gives the age 23 and Q17 says \"after one year\", so Nimali is about 24.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Eligibility for Sterilization\" slide (General Circular No. 1586) and \"Modern Family Planning Methods\" slide. The suitability of IUCD postnatally is standard knowledge.", "confidence": "CHECK on A. The examiner may have intended sterilisation without applying the age and parity rule. Best answer is D.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "note": "This continues the Nimali story in Q119 and Q120.", "scored": true}, {"id": 122, "batch": "B29 Q19", "file": "B29", "paperNo": 19, "topic": "Contraception, multiple partners", "type": "SBA", "theme": 2, "stem": "Out of the following, what is the best contraceptive method for a female who is having multiple sexual partners?", "options": {"A": "Oral contraceptive pills", "B": "Emergency contraceptive pills", "C": "Intra-Uterine contraceptive device", "D": "Male condoms", "E": "Sterilisation"}, "answer": "D", "prov": null, "cannot": false, "explanation": "With multiple partners the main risk is STI/HIV, and only condoms give barrier protection. The pill, IUCD and sterilisation prevent pregnancy only, and IUCD use with a high STI risk is also discouraged. Emergency pills (B) are not a regular method. This fits Q20, where condoms were part of the best advice for a sex worker, but here there is no dual-method option.", "source": "Family Planning Services in Sri Lanka_Batch 34, \"Modern Family Planning Methods\" slide (barrier: male condoms). The STI protection point is standard knowledge.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "FP", "atName": "Family planning", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": true, "scored": true}, {"id": 123, "batch": "B29 Q20", "file": "B29", "paperNo": 20, "topic": "Sri Lanka demographic transition, past five decades", "type": "SBA", "theme": 3, "stem": "During the past 5 decades the demographic transition of Sri Lanka…", "options": {"A": "The crude birth rate has increased", "B": "The maternal mortality ratio has increased", "C": "The population growth rate has increased", "D": "The infant mortality rate has increased", "E": "The crude death rate has decreased"}, "answer": "E", "prov": null, "cannot": false, "explanation": "This is a reworded version of Q96 (the stem and options A and B differ slightly), so I answered it separately and kept the answer the same. The lecture shows birth rates falling sharply, so A and C are wrong. Mortality fell as survival and life expectancy rose, and the natural-increase chart shows the death rate dropping to about 6 per 1000 and staying low, so E is right. B and D are wrong because maternal and infant mortality improved (the ANC lecture gives a maternal mortality ratio of 32 per 100,000 live births in 2018 and a target below 10 by 2030). The Dr Nazeer slide notes annual deaths rising with ageing, so recent crude rates have crept up from the low point.", "source": "Demographic transition (Dr Nazeer), \"Where is Sri Lanka today?\"; Demographic transition (Prof Kasturiratne), change in mortality and fertility slides; 07-Measures of Mortality, Natural increase chart and Infant Mortality Rate slides; 02-ANC and PNC revised, Sri Lanka statistics slide.", "confidence": "CHECK on E. Over five decades the crude death rate fell overall, but the lecture's rising annual deaths could make a reader doubt it. Best answer is E.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "DemTr", "atName": "Demographic transition", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 124, "batch": "B29 Q21", "file": "B29", "paperNo": 21, "topic": "Best method to prevent occupational hazard", "type": "SBA", "theme": 6, "stem": "What is the best method to prevent an occupational hazard, if available?", "options": {"A": "Wearing Personal protective equipment", "B": "Substitution", "C": "Engineering controls", "D": "Elimination", "E": "Administrative controls"}, "answer": "D", "prov": null, "cannot": false, "explanation": "The lecture puts elimination at the top of the hierarchy of control: removing the hazard completely is \"always the safest course of action\". B, C and E come lower, and A (PPE) is the last line of defence because the worker stays at some risk.", "source": "Occupational Diseases lecture, \"Controlling hazards; hierarchy of control\" and \"Elimination\" slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": ["OccDis"], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 125, "batch": "B29 Q22", "file": "B29", "paperNo": 22, "topic": "Leptospirosis control strategy", "type": "SBA", "theme": 8, "stem": "What is the most effective and feasible control strategy in the prevention of leptospirosis?", "options": {"A": "Avoiding high risk activities during the periods of high transmission", "B": "Elimination of rodents", "C": "Providing chemoprophylaxis to high risk individuals", "D": "Vaccination of high risk individuals", "E": "Wearing proper footwear while working in paddy fields"}, "answer": "C", "prov": null, "cannot": false, "explanation": "Weekly doxycycline for high-risk groups such as paddy farmers is the main practical control measure in Sri Lanka (standard knowledge), which fits with Q58 where penicillin was wrong. A is not feasible for farmers whose work is the exposure, B is not achievable, and D is wrong because no human vaccine is used in the national programme. E helps but is hard to apply consistently in wet fields, so it is less effective than C.", "source": "No lecture in project (the Occupational Diseases lecture only lists leptospirosis as a biological occupational disease). Standard knowledge.", "confidence": "CHECK on E. No lecture covers the question, and footwear versus chemoprophylaxis depends on how \"feasible\" is read. Best answer is C.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 126, "batch": "B29 Q23", "file": "B29", "paperNo": 23, "topic": "AFP surveillance, incorrect statement", "type": "SBA", "theme": 8, "stem": "Which of the following statement is incorrect regarding Acute flaccid paralysis (AFP) surveillance in Sri Lanka?", "options": {"A": "Stool samples should be collected on suspicion", "B": "Stool sample will be collected from close contact children", "C": "Collected stool samples should be kept in refrigerator until dispatch", "D": "It is a group A notifiable disease", "E": "Guillain-Barré syndrome accounts for majority of cases"}, "answer": "D", "prov": null, "cannot": false, "explanation": "Stool is collected on suspicion and kept cold until dispatch, so A and C are correct, and GBS is the commonest cause of AFP in children, so E is correct (standard knowledge). Contact sampling is part of the response in Sri Lanka, so B is also taken as correct. That leaves D as the statement I judge incorrect, because I could not confirm that AFP sits in notification group A. This is consistent with Q76, where I treated AFP as notifiable through the routine system.", "source": "No lecture in project. The HIS lecture only describes the notification card, field investigation by the PHI and weekly e-surveillance reporting, with no notification groups. Standard knowledge.", "confidence": "CHECK on D. The notification group is in no lecture, and B (contact sampling) is the other possible incorrect statement. Best answer is D.", "check": true, "checkLetters": ["D"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 127, "batch": "B29 Q24", "file": "B29", "paperNo": 24, "topic": "Disease notification challenge", "type": "SBA", "theme": 7, "stem": "Disease notification system in Sri Lanka is facing several problems. Which of the following is the most acute challenge according to the current context?", "options": {"A": "Lack of paper", "B": "Lack of fuel", "C": "Lack of electricity", "D": "Lack of manpower", "E": "High inflation"}, "answer": "A", "prov": null, "cannot": false, "explanation": "The HIS lecture says disease notification starts from a paper Notification Card, followed by PHI field investigation and weekly e-surveillance reporting. Of the options, only paper is part of that notification chain itself. The lecture's listed challenges (data security, interoperability, infrastructure and connectivity, training, funding) do not name paper, fuel, electricity, manpower or inflation. \"Current context\" is therefore read as the recent economic-crisis shortages, which is not a lecture statement.", "source": "HIS lecture, e-Surveillance slide (Notification Card, PHI, weekly reporting) and the Challenges slides. The lecture does not name the options listed.", "confidence": "CHECK on A. The lecture does not settle this, and B (fuel for PHI field visits) or C (electricity for e-systems) could be the intended answer. Best answer is A.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "NHIS", "atName": "National health information system", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 128, "batch": "B29 Q25", "file": "B29", "paperNo": 25, "topic": "HIV, next step after diagnosis", "type": "SBA", "theme": 9, "stem": "A 25 year old female is diagnosed of HIV from National STD / AIDS Programme. What is the most appropriate next step of management?", "options": {"A": "Inform his partner", "B": "Discuss the treatment options", "C": "Refer to the area MOH", "D": "Refer to the local STD clinic", "E": "Prescribe anti-retroviral treatment"}, "answer": "B", "prov": null, "cannot": false, "explanation": "After a confirmed diagnosis the next step is post-test counselling, including explaining the condition and the treatment options, before starting treatment (standard knowledge). Partner notification needs the patient's consent and counselling first (\"his partner\" is probably a typo for \"her partner\"). She was diagnosed through the national STD/AIDS programme, so referring her to the MOH or another STD clinic is not the first step.", "source": "No lecture in project (standard knowledge).", "confidence": "CHECK on B. No lecture in project, and E could be argued under a treat-all policy. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NONE", "atName": "Other topics (not in the Batch 34 notice)", "atCat": "Other", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 129, "batch": "B30 Q1", "file": "B30", "paperNo": 1, "topic": "Antenatal care service in Sri Lanka", "type": "MTF", "theme": 1, "stem": "Regarding anti-natal care service in Sri Lanka,", "options": {"A": "Given free of charge for every pregnant woman in Sri Lanka.", "B": "It should be followed up as a shared care service.", "C": "Regional levels are supervised by regional epidemiologists", "D": "All pregnant women are registered with the PHM before 24 weeks POA", "E": "National-level supervision of ANC in Sri Lanka is overseen by the Family Health Bureau"}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Antenatal care is freely available to anyone through the public health system (A), and the Family Health Bureau is the central organisation for family health (E). Registration with the PHM is before 8 weeks POA, not 24 weeks (D). Regional supervision is by the RDHS and MO MCH, not the regional epidemiologist, who works in communicable disease control (C). B fits the continuum of care across home, field clinic and referral levels. The stem has a typo (\"anti-natal\").", "source": "02 Antenatal and Postnatal Care (Prof Anuradhini), Overview and Summary slides. 02-ANC and PNC revised (registration before 8 weeks POA; continuum of care). Reproductive Health Concepts_Batch33 (organizational structure slides).", "confidence": "CHECK on B. The term \"shared care\" is not used in the lecture text; it is judged true from the continuum of care. Best answer is B True.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 130, "batch": "B30 Q2", "file": "B30", "paperNo": 2, "topic": "Promoting mental wellbeing", "type": "MTF", "theme": 5, "stem": "Actions that can be taken to promote mental well being,", "options": {"A": "Telling stories", "B": "Adequate nutritional supply", "C": "Enlist in a daycare as soon as possible", "D": "Teaching to write the alphabet as soon as possible", "E": "Talk about day-to-day activities"}, "answer": {"A": true, "B": true, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The ECD lecture advises telling stories, reading and discussing what is read, and spending time with a responsive adult, which supports A and E. It builds the brain through play and everyday routines, and the mental health lecture says parenting should be age-adjusted, so pushing early daycare or early writing (C, D) is not part of the promoted actions. Nutrition is not covered in these lectures, so B is standard knowledge. This is consistent with Q113 D.", "source": "13 Early Childhood Development Batch 34, slides 11, 18 and 22 to 23; 11-Mental Health Promotion batch32, Parenting slide. Option B: standard knowledge.", "confidence": "CHECK on B. Nutrition is not in the lectures. Best answer is True. CHECK on C. The lectures do not mention daycare, so this is inferred from their emphasis on a responsive caring adult. Best answer is False.", "check": true, "checkLetters": ["B", "C"], "otherDiffers": "", "dupOf": null, "at": "MHChild", "atName": "Mental health promotion in childhood", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 131, "batch": "B30 Q3", "file": "B30", "paperNo": 3, "topic": "GBV scenarios", "type": "MTF", "theme": 5, "stem": "Incidences where GBV is depicted", "options": {"A": "Manager asking the female assistant to meet him at the hotel before the promotion", "B": "Male doctor insisting the female partner to give up her job after marriage", "C": "Two school girls fighting over a boy", "D": "A group of men making fun of a transgender person", "E": "A male coworker making obnoxious comments on a female coworker's Facebook posts"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "The lecture counts coercion, harassment and verbal insult as psychological harm and restricting access to the labour market as economic harm, so A (coercion linked to promotion), B (forcing a partner to give up work) and E (harassing comments) are GBV. D fits the definition of violence directed at a person because of their gender. C is an interpersonal fight and not based on gender.", "source": "5_6082615564579119301 Gender Based Violence (Dr Kasturiratne), Overview and \"What is GBV?\" slides.", "confidence": "CHECK on D. The lecture does not discuss gender identity, and the answer follows from \"a person because of their gender\". Best answer is True. CHECK on E. Whether the comments are gender-based or sexual depends on their content. Best answer is True.", "check": true, "checkLetters": ["D", "E"], "otherDiffers": "", "dupOf": null, "at": "GBV", "atName": "Gender based violence", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 132, "batch": "B30 Q4", "file": "B30", "paperNo": 4, "topic": "Prevention of occupational diseases", "type": "MTF", "theme": 6, "stem": "T/F regarding the prevention of occupational diseases,", "options": {"A": "Elimination is the best method", "B": "Wearing PPE is the last resort", "C": "Isolation of equipment is an Administrator control method", "D": "Applying exhaust ventilation at points of emission is an engineering control method", "E": "Providing health care facilities is an Administrator control method"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "The lecture ranks elimination as the safest option and PPE as the last line of defence, so A and B are True. It lists ventilation systems that remove pollutants under engineering control, so D is True. C is False because isolation is its own level, separate from administrative control, and E is False because the lecture's administrative controls are SOPs, limiting exposure time, housekeeping, bans on eating and smoking, and washing facilities, not health care facilities (C and E both misspell \"Administrative\" as \"Administrator\").", "source": "Occupational Diseases lecture, \"Hierarchy of control\", \"Isolation\", \"Engineering control\", \"Administrative control\" and \"Personal protective equipment\" slides.", "confidence": "CHECK on E. The lecture lists administrative controls but does not mention health care facilities under any level. Best answer is E False.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "OccIntro", "atName": "Introduction to occupational health", "atCat": "Occupational health", "at2": ["OccDis"], "incomplete": false, "evidence": "lecture", "accepted": false, "scored": true}, {"id": 133, "batch": "B30 Q5", "file": "B30", "paperNo": 5, "topic": "Preventing malaria re-establishment", "type": "MTF", "theme": 8, "stem": "Regarding the prevention of re-establishment of malaria in Sri Lanka,", "options": {"A": "All patients with mild febrile illness after returning from abroad should be monitored.", "B": "Reporting cases should be notified immediately to the anti-malaria campaign by telephone.", "C": "Conducting routine vector control activities", "D": "Informing travelers to take chemoprophylaxis when visiting malaria-endemic countries", "E": "Providing advice to doctors on the threat of re-establishment of malaria"}, "answer": {"A": true, "B": true, "C": true, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Preventing re-establishment depends on catching imported cases early and acting fast, so watching febrile travellers (A), immediate telephone notification of cases (B), chemoprophylaxis advice for travellers (D) and keeping doctors alert (E) are all standard measures. The lecture's prevention list for re-emerging diseases supports good surveillance, quality diagnosis and treatment, and case and foci investigation with rapid response. C is also true because vector control is maintained alongside surveillance, since the vector is still present (standard knowledge).", "source": "Emerging and Re-emerging Infectious Diseases lecture, \"Prevention of re-emergence of diseases\" slide (surveillance, quality diagnosis and treatment, case and foci investigation, rapid response). Telephone notification, chemoprophylaxis and vector control details are standard knowledge.", "confidence": "CHECK on C. The lecture does not mention vector control for malaria, and \"routine\" versus targeted vector control is a wording risk. Best answer is A True, B True, C True, D True, E True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 134, "batch": "B30 Q6", "file": "B30", "paperNo": 6, "topic": "Lymphoedema management", "type": "MTF", "theme": 8, "stem": "Lymphedema management guidelines recommend,", "options": {"A": "Daily examination of the affected limb for wound and crack points.", "B": "Daily washing of affected limb with soap and water.", "C": "Not exercising the affected limb.", "D": "Elevation of the affected limb.", "E": "Check for fungal infection"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": true}, "prov": null, "cannot": false, "explanation": "Lymphoedema care aims to prevent infection of the affected limb, so daily inspection for wounds and cracks, daily washing with soap and water, elevation, and checking for fungal infection between the toes are all recommended (standard knowledge). C is false because gentle exercise helps lymph drainage and is advised rather than avoided. This fits with Q57 and Q109, where managing morbidity is one of the two pillars of the filariasis strategy.", "source": "No lecture in project (the Emerging and Re-emerging lecture only lists filariasis under re-emerging diseases). Standard knowledge.", "confidence": "CHECK on E. No lecture covers lymphoedema care, so all options rest on standard knowledge, and E is the one I am least sure the guideline names. Best answer is A True, B True, C False, D True, E True.", "check": true, "checkLetters": ["E"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 135, "batch": "B30 Q7", "file": "B30", "paperNo": 7, "topic": "Dengue transmission prevention", "type": "MTF", "theme": 8, "stem": "Measures that prevent transmission of dengue", "options": {"A": "Eliminate vector breeding places", "B": "Using mosquito nets", "C": "Isolation of dengue patients", "D": "Wearing long-sleeved shirts and trousers", "E": "Indoor residual spraying with insecticides"}, "answer": {"A": true, "B": true, "C": false, "D": true, "E": false}, "prov": null, "cannot": false, "explanation": "Source reduction is the mainstay of dengue control (A), and protecting people from day-biting Aedes with nets, especially for patients and day sleepers, and with covering clothing both reduce transmission (B and first D). Dengue does not spread from person to person, so isolation (C) does not prevent transmission. Indoor residual spraying is not used against Aedes, which bites outdoors in the day, so the second D is false. The paper prints two options as \"D\" and has no E, so I kept the printed labels.", "source": "No lecture in project (the Emerging and Re-emerging lecture only lists dengue as a re-emerging disease and one with epidemic potential). Standard knowledge.", "confidence": "CHECK on B. Nets are a protective measure rather than a core control measure, and the duplicate \"D\" label makes the item hard to mark. Best answer is A True, B True, C False, D (first) True, D (second) False.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "note": "The paper prints two options labelled D and no E. The second D is shown here as E.", "scored": true}, {"id": 136, "batch": "B30 Q8", "file": "B30", "paperNo": 8, "topic": "Determinants of adolescent mental health", "type": "MTF", "theme": 5, "stem": "Determinants of mental health issues among adolescents?", "options": {"A": "Cannabis use", "B": "Family disputes", "C": "Economical crisis in the country", "D": "Living with extended families", "E": "Networking on social media"}, "answer": {"A": true, "B": true, "C": true, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The adolescent lecture lists drug and alcohol use and mental health problems among adolescent risks, and says development depends on family, peers and the social environment, which covers A and B. It also notes that when future options look grim adolescents make poor decisions, which supports C. The school health lectures blame rising psychosocial problems on changing environments, parental pressure and the breakdown of traditional family structures, so living with extended families (D) is not a determinant. Social media use (E) is standard knowledge as a recognised risk factor.", "source": "05-Adolescent health narrated, \"Risk Faced by adolescents\", \"Why do adolescents behave the way they do?\" and \"Adolescent Development in a Social Context\" slides; 10 School Health Programme final (Dr Pannala), Emerging issues slide 6 (Psycho social problems). Option E: standard knowledge.", "confidence": "CHECK on C. The economic crisis is not named in the lectures, and the answer follows from their social-context slides. Best answer is True. CHECK on D. The lectures do not mention extended families directly. Best answer is False. CHECK on E. Social media is not covered in the adolescent or school health lectures. Best answer is True.", "check": true, "checkLetters": ["C", "D", "E"], "otherDiffers": "", "dupOf": null, "at": "Adol", "atName": "Adolescent health", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 137, "batch": "B30 Q9", "file": "B30", "paperNo": 9, "topic": "Hepatitis A", "type": "MTF", "theme": 8, "stem": "Regarding Hepatitis A", "options": {"A": "Transmitted through contaminated blood products.", "B": "Can be prevented by vaccination.", "C": "Commonly causes complications", "D": "It leads to chronic inflammation of the liver", "E": "There is no specific treatment for hepatitis A"}, "answer": {"A": false, "B": true, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "Hepatitis A spreads by the faecal-oral route through contaminated food and water, not through blood products, so A is false. It is vaccine-preventable (B), it is usually self-limiting with supportive care only (E), and it does not become chronic (D) or commonly cause complications (C). All of this is standard knowledge, and it agrees with Q160 on hepatitis A, where vaccine prevention is also true.", "source": "No lecture in project. Standard knowledge.", "confidence": "CHECK on C. No lecture covers hepatitis A, but the options are textbook points. Best answer is A False, B True, C False, D False, E True.", "check": true, "checkLetters": ["C"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 138, "batch": "B30 Q10", "file": "B30", "paperNo": 10, "topic": "MOH response to AFP", "type": "MTF", "theme": 8, "stem": "What measures are taken by the MOH when a case of acute flaccid paralysis is notified on suspicion?", "options": {"A": "OPV is given to 250 children in an area of 1-2km regardless of previous immunization.", "B": "OPV is given to all the people in an area of 1-2km regardless of their previous immunization.", "C": "Injectable polio vaccine for all the residents in the area", "D": "Chlorinate all the water wells within a 1-2km radius of the index case", "E": "Health education on prevention and control measures taken in poliomyelitis"}, "answer": {"A": true, "B": false, "C": false, "D": false, "E": true}, "prov": null, "cannot": false, "explanation": "The response to a suspected polio case is a targeted OPV round around the case's home, so A is true and fits the usual mop-up approach (standard knowledge). B and C are wrong because vaccinating every resident, or with injectable vaccine, is not the standard response. D is wrong because polio is not controlled by chlorinating wells in this response, and E is true because health education is part of the MOH's work. This is consistent with Q76 and Q126, where AFP is notified immediately on suspicion.", "source": "No lecture in project (the Emerging and Re-emerging lecture does not mention polio or AFP). Standard knowledge.", "confidence": "CHECK on A. The figure of 250 children within 1 to 2 km is not in any lecture and I cannot confirm it independently. Best answer is A True, B False, C False, D False, E True.", "check": true, "checkLetters": ["A"], "otherDiffers": "", "dupOf": null, "at": "EmReEm", "atName": "Emerging and re-emerging diseases", "atCat": "Special topics", "at2": [], "incomplete": false, "evidence": "none", "accepted": false, "scored": true}, {"id": 139, "batch": "B30 Q11", "file": "B30", "paperNo": 11, "topic": "Dengue notification, which MOH", "type": "SBA", "theme": 7, "stem": "A 21 Year old old medical student living in the hostel of the Faculty of Medicine University of Kelaniya felt ill and was suspected to have dengue. He went to be with his family in the Weligama MOH area. He was admitted to the Matara district general hospital the following day. To which MOH should the notification be sent?", "options": {"A": "No one until dengue is confirmed", "B": "Ragama MOH", "C": "Kelaniya MOH", "D": "Weligama MOH", "E": "Matara MOH"}, "answer": "B", "prov": null, "cannot": false, "explanation": "Suspected dengue is notified on suspicion, without waiting for confirmation, so A is wrong (consistent with Q202). Notification goes to the MOH of the area where the patient was living when he fell ill, because that is where the PHI must look for breeding sites and the source of infection. He became ill in the hostel, which lies in the Ragama MOH area rather than Kelaniya (B over C). The paper repeats \"old\" in \"21 Year old old\".", "source": "HIS lecture, e-Surveillance slide (Notification Card, PHI field investigation, Epidemiology Unit). The lecture does not say which MOH receives a notification when the patient moves. The residence rule is standard knowledge.", "confidence": "CHECK on B. The lecture is silent, and D (Weligama, the home area) is the main alternative. Best answer is B.", "check": true, "checkLetters": ["B"], "otherDiffers": "", "dupOf": null, "at": "NHIS", "atName": "National health information system", "atCat": "Special topics", "at2": ["EmReEm"], "incomplete": false, "evidence": "part", "accepted": false, "scored": true}, {"id": 140, "batch": "B30 Q12", "file": "B30", "paperNo": 12, "topic": "First registration after moving (Mali)", "type": "SBA", "theme": 1, "stem": "Mali is a 26 year-old teacher who was married 2 months ago and moved to her partner's village. She found out to be pregnant and visited the PHM for the first time since marriage. She will be first registered in,", "options": {"A": "Eligible family register", "B": "Pregnant mothers' register", "C": "Expected date of delivery register.", "D": "Family planning register.", "E": "Clinic attendance register"}, "answer": "A", "prov": null, "cannot": false, "explanation": "Mali has never been registered with a PHM since marriage, so she must first be registered as an eligible family. Pregnancy registration (pregnant mothers' register) follows once pregnancy is confirmed. This is consistent with Q119 (eligible family registration by the PHM of the area where the couple lives).", "source": "02-ANC and PNC revised (Pre Pregnancy care: every eligible couple registered by the PHM; Antenatal care: registration at the Pregnant mothers register). 02 Antenatal and Postnatal Care (Prof Anuradhini), Pre-pregnancy care and Registration slides.", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 141, "batch": "B30 Q13", "file": "B30", "paperNo": 13, "topic": "Supplement at 8 weeks POA", "type": "SBA", "theme": 1, "stem": "Mala attended to polyclinic for the first time. POA 8th week. What nutrition supplement will she receive?", "options": {"A": "Iron", "B": "Calcium lactate", "C": "Folic acid", "D": "Vitamin C", "E": "Iron-folate"}, "answer": "C", "prov": null, "cannot": false, "explanation": "The lecture gives folic acid 400 mcg daily from the pre-pregnancy period, so it continues at the first (booking) visit. Iron-folate or multiple micronutrients, vitamin C and calcium lactate start from the second visit at 12-14 weeks, so A, B, D and E are not given at 8 weeks.", "source": "02 Antenatal and Postnatal Care (Prof Anuradhini), Supplementation slide (folic acid from pre-pregnancy; MMN in 2nd and 3rd trimesters). Nutrition in Pregnancy Batch 35 (nutritional supplements from the second visit, 12-14 weeks).", "confidence": "Confident", "check": false, "checkLetters": [], "otherDiffers": "", "dupOf": null, "at": "ANC/PNC", "atName": "Antenatal and postnatal care", "atCat": "Reproductive health", "at2": [], "incomplete": false, "evidence": "lecture", "accepted": true, "scored": true}, {"id": 142, "batch": "B30 Q14", "file": "B30", "paperNo": 14, "topic": "Officer responsible for postnatal care, other MOH area", "type": "SBA", "theme": 1, "stem": "Mala delivered a baby and went to her parent's home to stay during her postpartum period. Her parent's home is situated in a different MOH area. Who is the directly responsible officer for her postnatal care?", "options": {"A": "PHM of her husband's MOH area.", "B": "PHM of her parent's MOH area.", "C": "MOH of her husband's MOH area.", "D":
